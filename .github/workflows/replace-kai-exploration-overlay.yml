name: Replace Kai exploration overlay

on:
  push:
    branches:
      - replace-kai-exploration-overlay
    paths:
      - '.github/workflows/replace-kai-exploration-overlay.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-kai-exploration-overlay
          fetch-depth: 1

      - name: Download and verify source PNG
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1IGPrCy1mVjnFeEz7jSFS9RZrlbm-HEnF' \
            -o /tmp/kai_snapshot_overlay.png
          echo 'b41c5133dac3c21b6623a3c0581f5bda795fc11498959e67466ebe60f6c4e8c7  /tmp/kai_snapshot_overlay.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('/tmp/kai_snapshot_overlay.png')
          b = p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Not a PNG')
          width, height = struct.unpack('>II', b[16:24])
          if (width, height) != (1086, 1448):
              raise SystemExit(f'Unexpected dimensions: {width}x{height}')
          print(f'Verified PNG: {width}x{height}, {len(b)} bytes')
          PY

      - name: Replace exploration overlay only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kai_snapshot_overlay.png android-apk/app/src/main/assets/kai_snapshot_overlay.png
          git rm .github/workflows/replace-kai-exploration-overlay.yml
          test "$(git status --short | wc -l)" -eq 2
          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Kai exploration overlay'
          git push origin HEAD:replace-kai-exploration-overlay
