name: Purge GitHub Actions History

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge all previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current purge run: ${CURRENT_RUN_ID}"

          mapfile -t RUN_IDS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Found ${#RUN_IDS[@]} workflow runs."

          # Cancel every other active run first so deletion is not blocked.
          for run_id in "${RUN_IDS[@]}"; do
            [[ "${run_id}" == "${CURRENT_RUN_ID}" ]] && continue

            status=$(gh api "/repos/${REPO}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)
            if [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" || "${status}" == "requested" ]]; then
              echo "Cancelling active run ${run_id} (${status})"
              gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            fi
          done

          sleep 5

          deleted=0
          failed=0

          for run_id in "${RUN_IDS[@]}"; do
            [[ "${run_id}" == "${CURRENT_RUN_ID}" ]] && continue

            echo "Deleting run ${run_id}"
            success=false
            for attempt in 1 2 3 4 5; do
              if gh api --method DELETE "/repos/${REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
                success=true
                break
              fi
              sleep 3
            done

            if [[ "${success}" == "true" ]]; then
              deleted=$((deleted + 1))
            else
              echo "Failed to delete run ${run_id}" >&2
              failed=$((failed + 1))
            fi
          done

          echo "Deleted ${deleted} previous workflow runs."
          echo "Failed deletions: ${failed}."
          echo "This purge run remains because GitHub cannot delete the currently executing run."

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi
