name: Purge Failed GitHub Actions Runs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/purge-actions-history.yml'

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current purge run: ${CURRENT_RUN_ID}"

          mapfile -t RUN_IDS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?status=failure&per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Found ${#RUN_IDS[@]} failed workflow runs."

          deleted=0
          failed=0

          for run_id in "${RUN_IDS[@]}"; do
            [[ "${run_id}" == "${CURRENT_RUN_ID}" ]] && continue

            echo "Deleting failed run ${run_id}"
            success=false
            for attempt in 1 2 3 4 5; do
              if gh api --method DELETE "/repos/${REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
                success=true
                break
              fi
              sleep 2
            done

            if [[ "${success}" == "true" ]]; then
              deleted=$((deleted + 1))
            else
              echo "Failed to delete run ${run_id}" >&2
              failed=$((failed + 1))
            fi
          done

          echo "Deleted ${deleted} failed workflow runs."
          echo "Failed deletions: ${failed}."
          echo "Successful/cancelled runs are preserved."

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi
