name: Emulator Level 0-6 Sublevels

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/scripts/emu-sublevels-0-6.sh'
      - '.github/workflows/build-backroom-apk.yml'
      - '.github/workflows/emulator-sublevels-0-6.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sublevels-0-6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve matching APK build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-backroom-apk.yml/runs?per_page=30")
            run_id=$(jq -r --arg sha "$HEAD_SHA" '.workflow_runs[] | select(.head_sha==$sha and .status=="completed" and .conclusion=="success") | .id' <<<"$json" | head -1)
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for successful APK build for $HEAD_SHA ($attempt/60)"
            sleep 15
          done
          echo "No successful APK build found for $HEAD_SHA" >&2
          exit 1

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p apk-artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir apk-artifact
          APK=$(find apk-artifact -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" Backroom-under-test.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run parent Level and sublevel fixtures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          START_TIMEOUT_SECONDS: '20'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          script: |
            python3 - <<'PY'
            from pathlib import Path
            import re

            p = Path('.github/scripts/emu-sublevels-0-6.sh')
            t = p.read_text(encoding='utf-8')

            old = """    elif kind == 'explore':
                    match = enabled and cls.endswith('Button') and (text == 'kham pha' or desc == 'kham pha')
            """
            new = """    elif kind == 'input':
                    match = enabled and cls.endswith('EditText')
                elif kind == 'submit':
                    match = enabled and cls.endswith('Button') and (
                        rid.endswith(':id/submit') or rid == 'submit' or text == 'thuc hien' or desc == 'thuc hien'
                    )
            """
            if t.count(old) != 1:
                raise SystemExit(f'node_bounds interaction anchor expected 1 match, found {t.count(old)}')
            t = t.replace(old, new, 1)

            wait_pattern = re.compile(r"wait_until_explore_ready\(\) \{\n.*?\n\}\n\nsubmit_explore\(\) \{", re.S)
            wait_replacement = r'''wait_until_explore_ready() {
              local label="$1" deadline tmp bounds non_app=0
              deadline=$((SECONDS + TURN_TIMEOUT_SECONDS))
              tmp="/tmp/backroom-${label}.xml"
              while (( SECONDS < deadline )); do
                dump_ui_to "$tmp" || { sleep "$POLL_SECONDS"; continue; }
                if is_known_system_overlay "$tmp"; then
                  dismiss_system_overlays
                  sleep 1
                  continue
                fi
                if ! is_app_resumed; then
                  non_app=$((non_app + 1))
                  if (( non_app >= 5 )); then
                    return 1
                  fi
                  sleep "$POLL_SECONDS"
                  continue
                fi
                non_app=0
                if ui_is_busy "$tmp"; then
                  sleep "$POLL_SECONDS"
                  continue
                fi
                bounds=$(node_bounds "$tmp" input || true)
                if [[ -n "$bounds" ]]; then
                  cp "$tmp" "$OUT/ui/${label}.xml"
                  return 0
                fi
                sleep "$POLL_SECONDS"
              done
              [[ -s "$tmp" ]] && cp "$tmp" "$OUT/ui/${label}-timeout.xml" || true
              return 1
            }

            submit_explore() {'''
            t, n = wait_pattern.subn(wait_replacement, t, count=1)
            if n != 1:
                raise SystemExit(f'Freedom-ready function patch expected 1 match, found {n}')

            submit_pattern = re.compile(r"submit_explore\(\) \{\n.*?\n\}\n\nread_core_state\(\) \{", re.S)
            submit_replacement = r'''submit_explore() {
              local index="$1" xml input_bounds typed submit_bounds observed_text
              xml="$OUT/ui/ready-${index}.xml"
              dump_ui_to "$xml" || return 1
              input_bounds=$(node_bounds "$xml" input || true)
              [[ -n "$input_bounds" ]] || return 1

              tap_bounds "$input_bounds"
              adb shell 'input keyevent KEYCODE_MOVE_END; for i in $(seq 1 80); do input keyevent KEYCODE_DEL; done; input text continue%sforward' >/dev/null 2>&1 || true
              sleep 1
              typed="$OUT/ui/typed-${index}.xml"
              dump_ui_to "$typed" || return 1
              observed_text=$(python3 - "$typed" <<'PY2'
            import sys, xml.etree.ElementTree as ET
            root=ET.parse(sys.argv[1]).getroot()
            for node in root.iter('node'):
                if (node.attrib.get('class') or '').endswith('EditText'):
                    print(node.attrib.get('text') or '')
                    break
            PY2
              )
              [[ "${observed_text,,}" == *"continue forward"* ]] || return 1

              submit_bounds=$(node_bounds "$typed" submit || true)
              if [[ -z "$submit_bounds" ]]; then
                adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true
                sleep 1
                dump_ui_to "$typed" || return 1
                submit_bounds=$(node_bounds "$typed" submit || true)
              fi
              [[ -n "$submit_bounds" ]] || return 1

              # One physical tap equals one gameplay action. Never retry after a fixed delay: a
              # fast turn may already have finished and re-enabled the composer.
              tap_bounds "$submit_bounds"
              echo "action=$index origin=FREEDOM resolvedKind=EXPLORE input=continue forward" | tee -a "$OUT/actions.log"
              return 0
            }

            read_core_state() {'''
            t, n = submit_pattern.subn(submit_replacement, t, count=1)
            if n != 1:
                raise SystemExit(f'Freedom submit patch expected 1 match, found {n}')

            t = t.replace('wait_until_explore_ready "initial" || fail "Khám phá was not ready after fresh Level 0 launch"',
                          'wait_until_explore_ready "initial" || fail "Freedom input was not ready after fresh Level 0 launch"')
            t = t.replace('fail "Timed out waiting for Khám phá before action $actions"',
                          'fail "Timed out waiting for Freedom input before action $actions"')
            t = t.replace('fail "Real Khám phá tap was not accepted at action $actions"',
                          'fail "Real Freedom traversal submit was not accepted at action $actions"')
            t = t.replace('accepted Khám phá actions', 'accepted Freedom traversal actions classified as EXPLORE')

            # Older bash versions can parse the combined local declaration, but split it so the
            # run-as path is identical across emulator runner images.
            t = t.replace('  local label="$1" raw="$OUT/core-${label}.xml"',
                          '  local label="$1"\n  local raw="$OUT/core-${label}.xml"')

            p.write_text(t, encoding='utf-8')
            PY
            bash -n .github/scripts/emu-sublevels-0-6.sh
            bash -c 'adb(){ command adb "$@" </dev/null; }; export -f adb; adb shell pm disable-user --user 0 com.android.launcher3 >/dev/null 2>&1 || true; bash .github/scripts/emu-sublevels-0-6.sh Backroom-under-test.apk'

      - name: Upload sublevel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-sublevels-0-6-${{ github.run_id }}
          path: emu-sublevels-0-6-results/
          if-no-files-found: warn
