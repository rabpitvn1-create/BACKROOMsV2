name: Fix PR 42 swipe marker

on:
  push:
    branches:
      - fix/device-regressions-1.1.77

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-regressions-1.1.77
          fetch-depth: 0
      - name: Preserve canonical swipe contract marker
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('android-apk/apply-android-ui.py'); s=p.read_text(encoding='utf-8'); old='/* ANDROID_SWIPE_GESTURE_V3: touch hardware uses Touch Events; Pointer Events remain the non-touch fallback. */'; new='/* ANDROID_SWIPE_GESTURE_V2 / ANDROID_SWIPE_TOUCH_FIRST_V1: touch hardware uses Touch Events; Pointer Events remain the non-touch fallback. */'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1), encoding='utf-8')"
          rm -f .github/workflows/fix-pr42-marker.yml
          git diff --check
      - name: Commit marker compatibility
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Android swipe contract marker"
          git push origin HEAD:fix/device-regressions-1.1.77
