name: One-time Actions cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-and-branches.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" != "main" ]]; then
              echo "Deleting branch: $branch"
              git push origin --delete "$branch"
            fi
          done

      - name: Delete run history for selected workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          targets_file="$(mktemp)"
          cat > "$targets_file" <<'EOF'
          Delete non-main branches
          Emulator Combat Regression
          Emulator Level 0-6 Sublevels
          Emulator Level 1 Progression
          One-time UI source cleanup
          Patch PR7 Runtime Prose
          EOF

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r run_id run_name; do
            if grep -Fxq "$run_name" "$targets_file"; then
              echo "Deleting run $run_id: $run_name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
            fi
          done

      - name: Remove selected workflow definitions and this cleanup workflow
        shell: bash
        run: |
          set -euo pipefail

          targets_file="$(mktemp)"
          cat > "$targets_file" <<'EOF'
          Delete non-main branches
          Emulator Combat Regression
          Emulator Level 0-6 Sublevels
          Emulator Level 1 Progression
          One-time UI source cleanup
          Patch PR7 Runtime Prose
          EOF

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$file" ]] || continue
            workflow_name="$(sed -n 's/^name:[[:space:]]*["'"']\?\(.*\?\)["'"']\?[[:space:]]*$/\1/p' "$file" | head -n1)"
            if grep -Fxq "$workflow_name" "$targets_file"; then
              echo "Removing workflow file: $file ($workflow_name)"
              git rm -f "$file"
            fi
          done

          git rm -f .github/workflows/cleanup-actions-and-branches.yml

          if git diff --cached --quiet; then
            echo "No workflow files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove obsolete workflows"
          git push origin HEAD:main

      - name: Delete this cleanup run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
