name: Add two snapshots to every Level 0 sublevel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-two-snapshots-all-level-0-sublevels.yml'

permissions:
  contents: write

concurrency:
  group: add-two-snapshots-all-level-0-sublevels
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      ROOT: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets and current targets
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done

          required=(
            "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_01.webp"
            "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_02.webp"
            "$ROOT/sublevel_0-2/snapshot_level_0_sublevel_0-2_01.webp"
            "$ROOT/sublevel_0-2/snapshot_level_0_sublevel_0-2_02.webp"
            "$ROOT/sublevel_0-5/snapshot_level_0_sublevel_0-5_01.webp"
            "$ROOT/sublevel_0-5/snapshot_level_0_sublevel_0-5_02.webp"
            "$ROOT/sublevel_0-7/snapshot_level_0_sublevel_0-7_01.webp"
            "$ROOT/sublevel_0-7/snapshot_level_0_sublevel_0-7_02.webp"
            "$ROOT/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_01.webp"
            "$ROOT/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_02.webp"
            "$ROOT/sublevel_the-torment/snapshot_level_0_sublevel_the-torment_01.webp"
            "$ROOT/sublevel_the-torment/snapshot_level_0_sublevel_the-torment_02.webp"
            "$ROOT/sublevel_the-torment/snapshot_level_0_sublevel_the-torment_03.webp"
            "$ROOT/sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_01.webp"
            "$ROOT/sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_02.webp"
            "$ROOT/sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_03.webp"
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "::error::Missing existing approved snapshot: $f"; exit 1; }
          done

          mkdir -p .snapshot-raw .snapshot-debug "$ROOT/sublevel_red-rooms"

      - name: Install image QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp tesseract-ocr

      - name: Generate fourteen new visual-only scenes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request

          root = pathlib.Path(os.environ["ROOT"])
          api_key = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = (
              base if base.endswith("/images/generations")
              else base + "/images/generations" if base.endswith("/v1")
              else base + "/v1/images/generations"
          )

          scenes = [
              {
                  "key": "0-1_03",
                  "final": root / "sublevel_0-1/snapshot_level_0_sublevel_0-1_03.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-1_03"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background inside Zenith Station, a gigantic decayed futuristic megastructure embedded within the Backrooms. "
                      "Human eye-level view from a damaged residential and utility sector: brushed metal walls, cracked glass partitions, white technical panels, exposed cables, jammed automatic sliding doors and scattered dead electronic equipment. "
                      "Through a huge fractured observation window, distant stacked layers of yellow Backrooms rooms can be glimpsed outside across an impossible central void. "
                      "Cold white utility lighting works only in patches, with deep unpowered sections beyond. Abandoned, silent, no functioning crew. "
                      "Scene only. No people, no robots, no signs, no labels, no readable screens, no typography, no written words, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-1_04",
                  "final": root / "sublevel_0-1/snapshot_level_0_sublevel_0-1_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-1_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background in a degraded hydroponic sector of Zenith Station. "
                      "A vast abandoned futuristic greenhouse corridor built from metal frames and thick glass, with rows of neglected hydroponic trays, mostly dead plants, condensation on cracked panes, exposed wiring and broken environmental-control panels. "
                      "Beyond the greenhouse glass is a cavernous dark interior void crossed by distant structural decks, suggesting the immense spherical station. "
                      "Some clean white lights still glow while others flicker or fail. Realistic decay, quiet machinery, no safe food implied. "
                      "Scene only. No people, no robots, no signs, no labels, no readable displays, no typography, no written words, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-2_03",
                  "final": root / "sublevel_0-2/snapshot_level_0_sublevel_0-2_03.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-2_03"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of Level 0.2, Remodeled Mess, during an active structural collapse front. "
                      "A formerly clean modern commercial interior with smooth white painted walls and dry red carpet is visibly failing from one side of the frame to the other. "
                      "Ceiling tiles have fallen, drywall is cracking, dust hangs in the air, sections of wall expose timber and metal framing, and the floor sags near a newly opened structural void. "
                      "The intact side remains bright and deceptively normal while the collapsing side is dusty and unstable. "
                      "Scene only. No people, no workers, no signs, no labels, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-2_04",
                  "final": root / "sublevel_0-2/snapshot_level_0_sublevel_0-2_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-2_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of the exposed-construction zone in Level 0.2, Remodeled Mess. "
                      "A long interior passage that once looked finished now resembles an abandoned unfinished building: bare timber studs, exposed metal framing, broken gypsum board, hanging ceiling grid, scattered construction debris and sections of red carpet surviving between raw concrete and damaged subfloor. "
                      "Dusty hard echoes, cold practical lighting and dangerous sharp edges. No machinery operating and no workers present. "
                      "Scene only. No people, no signs, no labels, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-5_03",
                  "final": root / "sublevel_0-5/snapshot_level_0_sublevel_0-5_03.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-5_03"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of Level 0.5, Aquaclaustrophobic Infirmary, in the transition timber halls. "
                      "A narrow claustrophobic corridor remains flooded with opaque dirty knee-deep water, but the familiar pale cream wallpaper is peeling away into rotten wooden wall panels and decayed hospital construction. "
                      "A suspended rectangular blue-green light hangs from frayed wires above the water, with a faint electrical spark safely above the surface. "
                      "Farther ahead, an old medical trolley and damaged drop ceiling suggest the infirmary emerging gradually. Cold, wet, contaminated and exhausting. "
                      "Scene only. No people, no creatures, no gore, no signs, no labels, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-5_04",
                  "final": root / "sublevel_0-5/snapshot_level_0_sublevel_0-5_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-5_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background deep inside the hospital zone of Level 0.5. "
                      "A decayed infirmary corridor with stained oily flooring, misaligned exposed ceiling tiles, damp damaged patient-room doors, abandoned rusting medical trolleys, collapsed debris and several empty moisture-stained hospital beds visible through open rooms. "
                      "The space is somewhat drier than the flooded passages but still filthy, humid and unsafe, with weak institutional lighting and deep shadow. "
                      "Scene only. No people, no creatures, no gore, no medicine labels, no signs, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-7_03",
                  "final": root / "sublevel_0-7/snapshot_level_0_sublevel_0-7_03.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-7_03"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of Level 0.7, The Reminiscence District, showing an ancient preserved manifestation of Level 0. "
                      "A liminal maze built from rough aged plaster, dark timber supports and uneven primitive flooring, with warm non-electric flame light from simple wall lamps and deep shadow. "
                      "The geometry still echoes the repetitive room-and-corridor logic of Level 0, but every material and construction technique feels centuries older. "
                      "At the far edge of one corridor, a subtle visual static-like distortion blocks passage without forming a portal. "
                      "Scene only. No people, no historical characters, no signs, no labels, no documents, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "0-7_04",
                  "final": root / "sublevel_0-7/snapshot_level_0_sublevel_0-7_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/0-7_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of another historical layer inside Level 0.7, The Reminiscence District. "
                      "A preserved early industrial to early twentieth-century version of the Backrooms: faded period wallpaper, dark varnished wood trim, old metal ventilation grilles, exposed conduit, weak tungsten lamps and worn patterned flooring transitioning gradually into later utilitarian materials farther down the corridor. "
                      "The scene should feel like layers of one liminal architecture preserved across eras, not a museum exhibit. "
                      "Scene only. No people, no mannequins, no signs, no labels, no papers, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "manila_03",
                  "final": root / "sublevel_manila-room/snapshot_level_0_sublevel_manila-room_03.webp",
                  "raw": pathlib.Path(".snapshot-raw/manila_03"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of the Manila Room in the Backrooms. "
                      "A quiet small enclosed central room with plain beige-manila wallpaper, thick walls, dry aged wooden flooring and a low simple ceiling under subdued old fluorescent light. "
                      "A worn plain wooden table and three ordinary mismatched chairs form the central meeting area, with two narrow doorless openings leading only to nearby matching side rooms. "
                      "Stable geometry, sparse furnishings, unusually calm liminal sanctuary mood while still clearly not a normal home. "
                      "Scene only. No people, no signs, no labels, no posters, no papers, no documents, no screens, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "manila_04",
                  "final": root / "sublevel_manila-room/snapshot_level_0_sublevel_manila-room_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/manila_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of a quiet extension connected to the Manila Room. "
                      "A short narrow passage with the same beige-manila wallpaper and dry wooden floor opens into a compact side chamber with thick walls, a simple empty wooden shelf, one plain chair and a small unmarked storage cabinet. "
                      "Through the passage, part of the central room's wooden table can be glimpsed, proving the spaces are directly connected. "
                      "Subdued fluorescent lighting, stable modest scale, silent and dry. "
                      "Scene only. No people, no signs, no labels, no posters, no papers, no documents, no screens, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "torment_04",
                  "final": root / "sublevel_the-torment/snapshot_level_0_sublevel_the-torment_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/torment_04"),
                  "prompt": (
                      "Photorealistic monochrome environmental survival-horror game background of The Torment in the Backrooms. "
                      "View from within the inner grave rings at night: weathered stone graves curve in precise concentric arcs through dense cold grey fog, dead leafless trees rise between them and decayed leaves cover the ground. "
                      "The damaged stone statue of a hooded man stands off-center as a silent landmark, partly obscured by fog and lit only by a pale unmoving moon. "
                      "Near one grave ring, a small surface patch fades into ash-grey as the anomaly spreads through material. Quiet dread, no action scene. "
                      "Scene only. No people, no living creatures, no readable gravestone names or dates, no signs, no typography, no written words, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "torment_05",
                  "final": root / "sublevel_the-torment/snapshot_level_0_sublevel_the-torment_05.webp",
                  "raw": pathlib.Path(".snapshot-raw/torment_05"),
                  "prompt": (
                      "Photorealistic monochrome environmental survival-horror game background at the outer fog margin of The Torment. "
                      "A distant liminal boundary where the last faint traces of yellow-beige material from the previous Backrooms environment lose saturation and become completely grey beneath cold moonlight. "
                      "Beyond it, concentric grave rows disappear after only a few metres into thick fog, with tall dead trees and leaf-covered ground barely visible. "
                      "The central statue is only a tiny vague silhouette far away. Oppressive uncertainty, stillness and cold. "
                      "Scene only. No people, no creatures, no readable gravestone text, no signs, no typography, no written words, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "red_04",
                  "final": root / "sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_04.webp",
                  "raw": pathlib.Path(".snapshot-raw/red_04"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of a mold-corner zone deep in the Backrooms Red Rooms. "
                      "An empty Level-0-like room and branching corridor covered in dark crimson wallpaper under weak darkroom-red fluorescent light, with coarse sticky-looking carpet and cold damp walls. "
                      "Black mold and a few small pale fungi gather naturally along one shadowed baseboard and inside a damp corner, clearly contamination rather than food or loot. "
                      "The repetitive geometry feels sealed and difficult to navigate. "
                      "Scene only. No people, no creatures, no signs, no labels, no posters, no documents, no screens, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
              {
                  "key": "red_05",
                  "final": root / "sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_05.webp",
                  "raw": pathlib.Path(".snapshot-raw/red_05"),
                  "prompt": (
                      "Photorealistic environmental survival-horror game background of the Deep Deadzone in the Backrooms Red Rooms. "
                      "A long sequence of offset crimson rooms and doorless corridors under sparse weak red fluorescent fixtures, with rough dark-red carpet, cold damp wallpaper, deep shadow and only occasional mold near the floor. "
                      "The composition should show a disorienting loop: a distinctive bend and wall pattern appears again farther ahead despite a different route, while the former entrance is nowhere visible. "
                      "No exit to Level 1 is shown. Isolated, communications-dead, claustrophobic but physically believable. "
                      "Scene only. No people, no creatures, no signs, no labels, no documents, no screens, no readable text, no typography, no title card, no UI, no watermark. Do not render or quote this instruction."
                  ),
              },
          ]

          generated = []
          skipped = []

          for scene in scenes:
              key = scene["key"]
              final_path = scene["final"]
              raw_path = scene["raw"]

              final_path.parent.mkdir(parents=True, exist_ok=True)
              raw_path.parent.mkdir(parents=True, exist_ok=True)

              if final_path.exists():
                  if final_path.stat().st_size == 0:
                      raise SystemExit(f"{key}: target exists but is empty: {final_path}")
                  print(f"{key}: target already exists, skipping API generation")
                  skipped.append(str(final_path))
                  continue

              payload = {
                  "model": model,
                  "prompt": scene["prompt"],
                  "n": 1,
                  "response_format": "b64_json",
                  "aspect_ratio": "16:9",
                  "resolution": "2k",
              }
              if model.startswith("grok-imagine-image-2.0"):
                  payload["quality"] = "medium"

              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{key}: Image API HTTP {exc.code}: {detail[:2000]}")

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"{key}: Image API response has no data[0]")

              item = data[0]
              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
                  source = "b64_json"
              elif item.get("url"):
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          item["url"],
                          headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"},
                      ),
                      timeout=300,
                  ) as response:
                      raw = response.read()
                  source = "url"
              else:
                  raise SystemExit(f"{key}: response has neither b64_json nor url")

              if len(raw) < 50000:
                  raise SystemExit(f"{key}: generated payload suspiciously small: {len(raw)} bytes")

              raw_path.write_bytes(raw)
              generated.append({
                  "key": key,
                  "raw": str(raw_path),
                  "final": str(final_path),
                  "bytes": len(raw),
                  "source": source,
                  "requested_model": model,
                  "served_model": body.get("model"),
              })
              print(f"{key}: bytes={len(raw)} source={source} served_model={body.get('model') or 'unknown'}")

          pathlib.Path(".snapshot-debug/generation-metadata.json").write_text(
              json.dumps({"generated": generated, "skipped": skipped}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Verify raw images are real scenes, not prompt cards
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          raws=(.snapshot-raw/*)

          if [ "${#raws[@]}" -eq 0 ]; then
            echo "No new raw images in this attempt; all targets already existed."
            exit 0
          fi

          declare -A seen_raw

          for src in "${raws[@]}"; do
            label="$(basename "$src")"
            w="$(identify -format '%w' "$src")"
            h="$(identify -format '%h' "$src")"
            entropy="$(convert "$src" -auto-orient -colorspace Gray -format '%[entropy]' info:)"
            digest="$(sha256sum "$src" | awk '{print $1}')"

            echo "$label raw: ${w}x${h}, entropy=${entropy}, sha256=${digest}"

            python3 - <<PY
          w = $w
          h = $h
          entropy = float("$entropy")
          target = 16 / 9
          ratio = w / h
          if abs(ratio - target) / target > 0.03:
              raise SystemExit("$label: raw image is not native 16:9")
          if w < 1280 or h < 720:
              raise SystemExit("$label: raw image is below 1280x720")
          if entropy < 0.20:
              raise SystemExit("$label: visual entropy too low; possible text-card or flat-image failure")
          PY

            test -z "${seen_raw[$digest]:-}" || { echo "::error::Duplicate raw image: $label"; exit 1; }
            seen_raw[$digest]=1

            ocr="$(tesseract "$src" stdout -l eng 2>/dev/null || true)"
            word_count="$(printf '%s' "$ocr" | tr -cs '[:alnum:]' '\n' | awk 'length($0) >= 3' | wc -l | tr -d ' ')"
            echo "$label OCR word count: $word_count"

            if [ "$word_count" -gt 12 ]; then
              echo "::error::$label contains too much readable text; possible rendered-prompt failure"
              printf '%s\n' "$ocr" | head -20
              exit 1
            fi
          done

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-level-0-sublevels-plus-two-raw
          path: |
            .snapshot-raw/
            .snapshot-debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Convert new raw images to Full HD WebP without cropping
        shell: bash
        run: |
          set -euo pipefail

          convert_one() {
            raw="$1"
            final="$2"
            if [ -e "$final" ]; then
              echo "SKIP existing final: $final"
              return 0
            fi
            test -s "$raw" || { echo "::error::Missing raw image: $raw"; exit 1; }
            mkdir -p "$(dirname "$final")"
            convert "$raw" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95 "$final"
          }

          convert_one ".snapshot-raw/0-1_03" "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_03.webp"
          convert_one ".snapshot-raw/0-1_04" "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_04.webp"
          convert_one ".snapshot-raw/0-2_03" "$ROOT/sublevel_0-2/snapshot_level_0_sublevel_0-2_03.webp"
          convert_one ".snapshot-raw/0-2_04" "$ROOT/sublevel_0-2/snapshot_level_0_sublevel_0-2_04.webp"
          convert_one ".snapshot-raw/0-5_03" "$ROOT/sublevel_0-5/snapshot_level_0_sublevel_0-5_03.webp"
          convert_one ".snapshot-raw/0-5_04" "$ROOT/sublevel_0-5/snapshot_level_0_sublevel_0-5_04.webp"
          convert_one ".snapshot-raw/0-7_03" "$ROOT/sublevel_0-7/snapshot_level_0_sublevel_0-7_03.webp"
          convert_one ".snapshot-raw/0-7_04" "$ROOT/sublevel_0-7/snapshot_level_0_sublevel_0-7_04.webp"
          convert_one ".snapshot-raw/manila_03" "$ROOT/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_03.webp"
          convert_one ".snapshot-raw/manila_04" "$ROOT/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_04.webp"
          convert_one ".snapshot-raw/torment_04" "$ROOT/sublevel_the-torment/snapshot_level_0_sublevel_the-torment_04.webp"
          convert_one ".snapshot-raw/torment_05" "$ROOT/sublevel_the-torment/snapshot_level_0_sublevel_the-torment_05.webp"
          convert_one ".snapshot-raw/red_04" "$ROOT/sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_04.webp"
          convert_one ".snapshot-raw/red_05" "$ROOT/sublevel_red-rooms/snapshot_level_0_sublevel_red-rooms_05.webp"

      - name: Verify every sublevel gained exactly two snapshots
        shell: bash
        run: |
          set -euo pipefail

          check_dir() {
            dir="$1"
            pattern="$2"
            expected="$3"
            mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name "$pattern" | sort)
            echo "$dir -> ${#files[@]} snapshots"
            printf '%s\n' "${files[@]}"
            test "${#files[@]}" -eq "$expected" || {
              echo "::error::$dir expected $expected snapshots, found ${#files[@]}"
              exit 1
            }
          }

          check_dir "$ROOT/sublevel_0-1" 'snapshot_level_0_sublevel_0-1_*.webp' 4
          check_dir "$ROOT/sublevel_0-2" 'snapshot_level_0_sublevel_0-2_*.webp' 4
          check_dir "$ROOT/sublevel_0-5" 'snapshot_level_0_sublevel_0-5_*.webp' 4
          check_dir "$ROOT/sublevel_0-7" 'snapshot_level_0_sublevel_0-7_*.webp' 4
          check_dir "$ROOT/sublevel_manila-room" 'snapshot_level_0_sublevel_manila-room_*.webp' 4
          check_dir "$ROOT/sublevel_the-torment" 'snapshot_level_0_sublevel_the-torment_*.webp' 5
          check_dir "$ROOT/sublevel_red-rooms" 'snapshot_level_0_sublevel_red-rooms_*.webp' 5

          declare -A seen
          while IFS= read -r f; do
            dims="$(identify -format '%wx%h' "$f")"
            test "$dims" = "1920x1080" || { echo "::error::$f is $dims"; exit 1; }
            digest="$(sha256sum "$f" | awk '{print $1}')"
            test -z "${seen[$digest]:-}" || { echo "::error::Duplicate snapshot content: $f"; exit 1; }
            seen[$digest]=1
          done < <(
            find "$ROOT" -type f -name 'snapshot_level_0_sublevel_*.webp' \
              \( -path '*/sublevel_0-1/*' -o -path '*/sublevel_0-2/*' -o -path '*/sublevel_0-5/*' -o -path '*/sublevel_0-7/*' -o -path '*/sublevel_manila-room/*' -o -path '*/sublevel_the-torment/*' -o -path '*/sublevel_red-rooms/*' \) \
              | sort
          )

      - name: Commit all new snapshots and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/add-two-snapshots-all-level-0-sublevels.yml

          git add \
            "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_03.webp" \
            "$ROOT/sublevel_0-1/snapshot_level_0_sublevel_0-1_04.webp" \
