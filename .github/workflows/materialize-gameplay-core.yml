name: Materialize Gameplay Core

on:
  push:
    branches:
      - refactor/issue-43-final-cleanup
    paths:
      - .github/workflows/materialize-gameplay-core.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-43-final-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install patch dependencies
        run: python -m pip install pillow

      - name: Sync verified Kai SRU visuals
        shell: bash
        run: |
          set -euo pipefail
          python android-apk/sync-kai-sru-assets.py
          test -s android-apk/app/src/main/assets/kai_snapshot_overlay.png
          test -s android-apk/app/src/main/assets/kai_entity_overlay.png
          test -s android-apk/app/src/main/assets/avatars/kai_avatar.png

      - name: Materialize settled runtime gameplay authority
        shell: bash
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-kai-sru-visuals.py patch-player-address-lock.py patch-runtime-canon-final.py sync-play-font-assets.py apply-android-ui.py patch-android-launch-safety.py patch-level-transition-final.py patch-haiku-provider-final.py patch-party-turn-combat-final.py patch-entity-rates-drops-final.py patch-gm-choices-freedom-final.py patch-lucia-story-gate-final.py patch-low-risk-canon-fallback-final.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done
          git diff --check

      - name: Commit materialized Kotlin authority
        shell: bash
        run: |
          set -euo pipefail
          git add \
            android-apk/app/src/main/java/com/rabpit/backroom/core/AnNhienCanon.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailJson.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailProjection.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/CommandPipeline.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/Engines.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/GameState.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/GameStateCodec.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/HealingItems.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/IntentPipeline.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/InventoryPolicy.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/OmnivaultEngine.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/PhysiologyStatusPolicy.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/StateReducer.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/TurnCoordinator.kt \
            android-apk/app/src/main/java/com/rabpit/backroom/core/knowledge/KnowledgeContextEngine.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/AnNhienFollowerTest.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/GameStateCodecTest.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/GameStateCoreTest.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/InventoryPolicyTest.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/ItemContentStateTest.kt \
            android-apk/app/src/test/java/com/rabpit/backroom/core/PhysiologyItemEffectTest.kt
          if git diff --cached --quiet; then
            echo "No gameplay authority changes to materialize."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Materialize gameplay core authority"
          git push origin HEAD:refactor/issue-43-final-cleanup
