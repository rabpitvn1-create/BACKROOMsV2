name: Regenerate Level 0.7 and Manila Room snapshots v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-0-7-manila-v2.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-0-7-manila-v2
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_07: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7
      OUT_MANILA: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets and empty targets
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_07" "$OUT_MANILA" .snapshot-debug
          test ! -e "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"
          test ! -e "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"
          test ! -e "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"
          test ! -e "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"

      - name: Generate native 16:9 2K images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request

          api_key = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = (
              base if base.endswith("/images/generations")
              else base + "/images/generations" if base.endswith("/v1")
              else base + "/v1/images/generations"
          )

          out07 = pathlib.Path(os.environ["OUT_07"])
          outm = pathlib.Path(os.environ["OUT_MANILA"])
          debug = pathlib.Path(".snapshot-debug")

          prompts = [
              (
                  "0-7_01",
                  out07 / "raw_01",
                  "Photorealistic environmental game background for BACKROOMsV2 Level 0.7, The Reminiscence District. "
                  "Show one coherent late-20th-century historical remnant of Level 0: an empty enclosed commercial corridor with faded yellow-beige patterned wallpaper, worn dry carpet, low acoustic-tile ceiling, aging fluorescent tubes, old wood-and-metal trim, dust and abandonment. "
                  "At the far end only, the materials begin to transition gradually into rough older plaster, hinting that this level preserves different historical manifestations of Level 0. "
                  "The scene must feel like a preserved obsolete form of Level 0, not a museum and not time travel. Human eye-level camera, strong natural depth, no characters, no entities, no readable text, no signage, no portal, no UI, no watermark."
              ),
              (
                  "0-7_02",
                  out07 / "raw_02",
                  "Photorealistic environmental game background for BACKROOMsV2 Level 0.7, The Reminiscence District. "
                  "Show one coherent pre-industrial-to-early-industrial remnant: a narrow empty passage built from rough aged plaster, dark wood, old brick and cast-iron details, lit by warm candle niches mixed with a few primitive early electric fixtures. "
                  "Include a small abandoned outpost trace with one old metal filing cabinet, a stripped wooden desk and dead loose cables. One side doorway is visibly blocked by opaque television-static visual noise, behaving as a solid inaccessible obstruction. "
                  "Human eye-level camera, abandoned and dusty, no people, no entities, no readable documents, no portal, no futuristic technology, no UI, no watermark."
              ),
              (
                  "manila_01",
                  outm / "raw_01",
                  "Photorealistic environmental game background of the BACKROOMsV2 Manila Room central room. "
                  "A small, stable, enclosed rectangular room with plain beige-manila wallpaper, thick walls, a dry wooden floor and a low simple ceiling with subdued old fluorescent lighting. "
                  "A worn plain rectangular table stands near the center with three mismatched ordinary chairs. Two simple open doorways lead only to small adjacent rooms. "
                  "The room is sparse, quiet, dry and modest in scale, with a calm liminal sanctuary feeling. Human eye-level camera. No people, no entities, no hotel styling, no office cubicles, no giant hall, no endless corridor, no readable text, no UI, no watermark."
              ),
              (
                  "manila_02",
                  outm / "raw_02",
                  "Photorealistic environmental game background of a quiet annex inside the BACKROOMsV2 Manila Room. "
                  "A compact beige-manila wallpapered side room with thick walls, dry wooden floor and subdued old fluorescent light. A single mismatched chair sits beside a small bulletin board holding aged blank or illegible papers. "
                  "A very short narrow passage opens back into the nearby central room, where only the edge of the same plain table and one chair are visible. "
                  "The proportions remain small, enclosed, stable and quiet. Human eye-level camera. No people, no entities, no hotel corridor, no office complex, no grand architecture, no readable writing, no UI, no watermark."
              ),
          ]

          meta = []
          for key, target, prompt in prompts:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "n": 1,
                  "response_format": "b64_json",
                  "aspect_ratio": "16:9",
                  "resolution": "2k",
              }
              if model.startswith("grok-imagine-image-2.0"):
                  payload["quality"] = "medium"

              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Image API HTTP {exc.code}: {detail[:2000]}")

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"{key}: Image API response has no data[0]")
              item = data[0]

              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
                  source = "b64_json"
              elif item.get("url"):
                  with urllib.request.urlopen(
                      urllib.request.Request(item["url"], headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"}),
                      timeout=300,
                  ) as response:
                      raw = response.read()
                  source = "url"
              else:
                  raise SystemExit(f"{key}: response has neither b64_json nor url")

              if len(raw) < 20000:
                  raise SystemExit(f"{key}: generated payload suspiciously small: {len(raw)} bytes")

              target.write_bytes(raw)
              print(f"{key}: served_model={body.get('model') or 'unknown'} bytes={len(raw)} source={source}")
              meta.append({
                  "key": key,
                  "requested_model": model,
                  "served_model": body.get("model"),
                  "source": source,
                  "raw_bytes": len(raw),
                  "aspect_ratio": "16:9",
                  "resolution": "2k",
                  "quality": payload.get("quality", "provider-default"),
              })

          (debug / "generation-metadata.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload raw generation evidence
        uses: actions/upload-artifact@v4
        with:
          name: level-0-7-manila-v2-raw
          path: |
            .snapshot-debug/
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/raw_01
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/raw_02
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/raw_01
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/raw_02
          retention-days: 7

      - name: Validate raw geometry and convert without cropping
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp

          validate_and_convert() {
            src="$1"
            dst="$2"
            label="$3"

            test -s "$src"
            raw_w="$(identify -format '%w' "$src")"
            raw_h="$(identify -format '%h' "$src")"
            raw_ratio="$(python3 -c "print($raw_w / $raw_h)")"
            echo "$label raw: ${raw_w}x${raw_h}, ratio=${raw_ratio}"

            python3 - <<PY
          ratio = $raw_w / $raw_h
          target = 16 / 9
          if abs(ratio - target) / target > 0.03:
              raise SystemExit("$label: raw image is not acceptably close to native 16:9")
          if $raw_w < 1280 or $raw_h < 720:
              raise SystemExit("$label: raw image is unexpectedly below 1280x720")
          PY

            cp "$src" ".snapshot-debug/${label}_raw"
            convert "$src" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95 "$dst"
            rm "$src"

            dims="$(identify -format '%wx%h' "$dst")"
            test "$dims" = "1920x1080" || { echo "::error::$label final is $dims"; exit 1; }
          }

          validate_and_convert "$OUT_07/raw_01" "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp" "0-7_01"
          validate_and_convert "$OUT_07/raw_02" "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp" "0-7_02"
          validate_and_convert "$OUT_MANILA/raw_01" "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp" "manila_01"
          validate_and_convert "$OUT_MANILA/raw_02" "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp" "manila_02"

      - name: Verify four distinct final images
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"
            "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"
            "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"
            "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"
          )

          declare -A seen
          for f in "${files[@]}"; do
            test -s "$f"
            dims="$(identify -format '%wx%h' "$f")"
            test "$dims" = "1920x1080"
            digest="$(sha256sum "$f" | awk '{print $1}')"
            test -z "${seen[$digest]:-}" || { echo "::error::Duplicate image: $f"; exit 1; }
            seen[$digest]=1
            file "$f"
            echo "$digest  $f"
          done

      - name: Commit replacement snapshots and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/regenerate-0-7-manila-v2.yml
          git add             "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"             "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"             "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"             "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"

          git commit -m 'Regenerate Level 0.7 and Manila Room snapshots with native 16:9'
          git push origin HEAD:main
