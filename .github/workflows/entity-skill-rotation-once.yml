name: Apply first Entity skill rotation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entity-skill-rotation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Patch first three Entity skill sets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java')
          s = p.read_text(encoding='utf-8')

          old = '''  private static final class Ultimate {
          '''
          insert = '''  private static final class EntitySkill {
            final String name;
            final int damagePercent;
            final int procPercent;

            EntitySkill(String name, int damagePercent, int procPercent) {
              this.name = name;
              this.damagePercent = damagePercent;
              this.procPercent = procPercent;
            }
          }

          private static final class Ultimate {
          '''
          if 'private static final class EntitySkill' not in s:
            if old not in s: raise SystemExit('EntitySkill class marker missing')
            s = s.replace(old, insert, 1)

          old = '''  private static final Map<String, List<Skill>> SKILLS = new LinkedHashMap<>();
          private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();
          '''
          new = '''  private static final Map<String, List<Skill>> SKILLS = new LinkedHashMap<>();
          private static final Map<String, List<EntitySkill>> ENTITY_SKILLS = new LinkedHashMap<>();
          private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();
          '''
          if 'ENTITY_SKILLS = new LinkedHashMap' not in s:
            if old not in s: raise SystemExit('ENTITY_SKILLS map marker missing')
            s = s.replace(old, new, 1)

          marker = '''    // Only offensive canonical skills participate in Poker Dice Skill hands. Passive/evasion
          '''
          block = '''    entitySkills("hound",
              entitySkill("Dead Bite", 120, 35),
              entitySkill("Rending Pounce", 115, 32),
              entitySkill("Pack Maul", 110, 38));
            entitySkills("clump",
              entitySkill("Grasping Crush", 120, 34),
              entitySkill("Limb Barrage", 115, 36),
              entitySkill("Drag Down", 110, 31));
            entitySkills("duller",
              entitySkill("Blindside Strike", 125, 33),
              entitySkill("Distorted Lunge", 115, 37),
              entitySkill("Column Ambush", 120, 30));

            // Only offensive canonical skills participate in Poker Dice Skill hands. Passive/evasion
          '''
          if 'entitySkill("Dead Bite"' not in s:
            if marker not in s: raise SystemExit('Entity skill registration marker missing')
            s = s.replace(marker, block, 1)

          marker = '''  private static void skills(String id, Skill... definitions) {
            List<Skill> list = new ArrayList<>();
            for (Skill definition : definitions) list.add(definition);
            SKILLS.put(id, list);
          }
          '''
          block = marker + '''
            private static EntitySkill entitySkill(String name, int damagePercent, int procPercent) {
              return new EntitySkill(name, damagePercent, procPercent);
            }

            private static void entitySkills(String id, EntitySkill... definitions) {
              List<EntitySkill> list = new ArrayList<>();
              for (EntitySkill definition : definitions) list.add(definition);
              ENTITY_SKILLS.put(id, list);
            }

            static int entitySkillCount(String entityKey) {
              List<EntitySkill> pool = ENTITY_SKILLS.get(entityKey == null ? "" : entityKey.trim().toLowerCase(Locale.ROOT));
              return pool == null ? 0 : pool.size();
            }

            static int entitySkillDamage(int rawDamage, int damagePercent) {
              long scaled = (long)Math.max(1, rawDamage) * Math.max(0, damagePercent);
              return Math.max(1, (int)((scaled + 50L) / 100L));
            }

            static int entitySkillProcRoll(int seed, int round, int actorIndex, int skillIndex) {
              long mixed = (seed & 0xffffffffL) * 1_664_525L
                  + (long)Math.max(1, round) * 1_013_904_223L
                  + (long)(actorIndex + 1) * 2_654_435_761L
                  + (long)(skillIndex + 1) * 97_531L;
              mixed ^= mixed >>> 16;
              mixed ^= mixed << 11;
              return (int)Math.floorMod(mixed, 100L);
            }
          '''
          if 'static int entitySkillCount' not in s:
            if marker not in s: raise SystemExit('Entity skill helper marker missing')
            s = s.replace(marker, block, 1)

          old = '''    int rawDamage = Math.max(1, entity.optInt("attack", 1));
            int def = actor.optInt("DEF", CharacterProgressionCore.BASE_STAT);
            int damage = defendedIncomingDamage(rawDamage, def);
            actor.put("hp", Math.max(0, actor.optInt("hp", 0) - damage));
            addFeedback(combat, "entity", "actor", "damage", "-" + damage + " HP", true);
          '''
          new = '''    int rawDamage = Math.max(1, entity.optInt("attack", 1));
            int def = actor.optInt("DEF", CharacterProgressionCore.BASE_STAT);
            List<EntitySkill> pool = ENTITY_SKILLS.get(entity.optString("key", ""));
            boolean procTriggered = false;
            if (pool != null) {
              int seed = combat.optInt("seed", 1);
              int round = Math.max(1, combat.optInt("round", 1));
              int actorIndex = Math.max(0, combat.optInt("actorIndex", 0));
              for (int i = 0; i < pool.size(); i++) {
                EntitySkill skill = pool.get(i);
                if (entitySkillProcRoll(seed, round, actorIndex, i) >= skill.procPercent) continue;
                procTriggered = true;
                int damage = defendedIncomingDamage(entitySkillDamage(rawDamage, skill.damagePercent), def);
                actor.put("hp", Math.max(0, actor.optInt("hp", 0) - damage));
                addFeedback(combat, "entity", "actor", "damage",
                    skill.name + " · -" + damage + " HP", true);
              }
            }
            if (!procTriggered) {
              int damage = defendedIncomingDamage(rawDamage, def);
              actor.put("hp", Math.max(0, actor.optInt("hp", 0) - damage));
              addFeedback(combat, "entity", "actor", "damage", "-" + damage + " HP", true);
            }
          '''
          if 'skill.name + " · -" + damage' not in s:
            if old not in s: raise SystemExit('Entity response marker missing')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          # Regression tests: exactly three skills, 30-40% proc band by declarations, bounded damage,
          # and deterministic per-turn roll so a skill cannot proc twice from reroll/reload noise.
          tp = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java')
          t = tp.read_text(encoding='utf-8')
          marker = '''  private static void finalizeAs(JSONObject state, int... values) throws Exception {
          '''
          tests = '''  @Test public void firstEntityRotationHasExactlyThreeSkillsEach() {
            assertEquals(3, CombatChoiceEngine.entitySkillCount("hound"));
            assertEquals(3, CombatChoiceEngine.entitySkillCount("clump"));
            assertEquals(3, CombatChoiceEngine.entitySkillCount("duller"));
          }

            @Test public void entitySkillDamageStaysSlightlyAboveBasicAttack() {
              assertEquals(18, CombatChoiceEngine.entitySkillDamage(15, 120));
              assertEquals(17, CombatChoiceEngine.entitySkillDamage(15, 115));
              assertEquals(17, CombatChoiceEngine.entitySkillDamage(15, 110));
              assertEquals(21, CombatChoiceEngine.entitySkillDamage(17, 125));
            }

            @Test public void entitySkillProcRollIsStableWithinTheSameTurn() {
              int first = CombatChoiceEngine.entitySkillProcRoll(12345, 4, 2, 1);
              assertTrue(first >= 0 && first < 100);
              assertEquals(first, CombatChoiceEngine.entitySkillProcRoll(12345, 4, 2, 1));
              assertNotEquals(first, CombatChoiceEngine.entitySkillProcRoll(12345, 5, 2, 1));
            }

            private static void finalizeAs(JSONObject state, int... values) throws Exception {
          '''
          if 'firstEntityRotationHasExactlyThreeSkillsEach' not in t:
            if marker not in t: raise SystemExit('Test insertion marker missing')
            t = t.replace(marker, tests, 1)
          tp.write_text(t, encoding='utf-8')

          jp = Path('android-apk/app/src/main/assets/knowledge/entity_encounters.json')
          root = json.loads(jp.read_text(encoding='utf-8'))
          skills = {
            'hound': [
              {'name':'Dead Bite','damagePercent':120,'procPercent':35},
              {'name':'Rending Pounce','damagePercent':115,'procPercent':32},
              {'name':'Pack Maul','damagePercent':110,'procPercent':38}],
            'clump': [
              {'name':'Grasping Crush','damagePercent':120,'procPercent':34},
              {'name':'Limb Barrage','damagePercent':115,'procPercent':36},
              {'name':'Drag Down','damagePercent':110,'procPercent':31}],
            'duller': [
              {'name':'Blindside Strike','damagePercent':125,'procPercent':33},
              {'name':'Distorted Lunge','damagePercent':115,'procPercent':37},
              {'name':'Column Ambush','damagePercent':120,'procPercent':30}]
          }
          for e in root['entities']:
            if e['key'] in skills:
              e['autoProcSkills'] = skills[e['key']]
          root.setdefault('rules', {})['entitySkillProcPolicy'] = 'Each listed skill rolls independently once per valid Entity response; if none proc, use the normal basic attack.'
          jp.write_text(json.dumps(root, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run regression tests and build
        working-directory: android-apk
        run: |
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit runtime update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/entity-skill-rotation-once.yml
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java \
                  android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java \
                  android-apk/app/src/main/assets/knowledge/entity_encounters.json
          git commit -m 'Add first Entity auto-proc skills'
          git push origin HEAD:main
