name: Cleanup Level 0.7 and Manila snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-0-7-manila-assets.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-0-7-manila-assets
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the four approved replacement images
        shell: bash
        run: |
          set -euo pipefail

          F07_01="android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_01.webp"
          F07_02="android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_02.webp"
          FM_01="android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_01.webp"
          FM_02="android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_02.webp"

          check_blob() {
            file="$1"
            expected="$2"
            test -s "$file" || { echo "::error::Missing approved snapshot: $file"; exit 1; }
            actual="$(git hash-object "$file")"
            echo "$file -> $actual"
            test "$actual" = "$expected" || {
              echo "::error::Approved snapshot content changed: $file"
              echo "::error::Expected blob $expected, got $actual"
              exit 1
            }
          }

          check_blob "$F07_01" "2d0af4733c8681ffec598886b73eae051fbe464a"
          check_blob "$F07_02" "2d79a365084ebae69640342250a7ad0546de8e94"
          check_blob "$FM_01" "adc30dfeea12320545736b4f2ea85c760652301d"
          check_blob "$FM_02" "d1ee67bb4f55b89307375e329cd3af1f321ed578"

      - name: Remove obsolete Level 0.7 and Manila snapshot image files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="android-apk/app/src/main/assets/level_snapshots"

          KEEP=(
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_01.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_02.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_01.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_02.webp"
          )

          is_keep() {
            local candidate="$1"
            local k
            for k in "${KEEP[@]}"; do
              [[ "$candidate" == "$k" ]] && return 0
            done
            return 1
          }

          mapfile -t candidates < <(
            find "$ROOT" -type f \
              \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
              \( -path '*/sublevel_0-7/*' -o -path '*/sublevel_manila-room/*' -o -iname '*0-7*' -o -iname '*manila*' \) \
              | sort
          )

          echo "Candidate 0.7/Manila snapshot images:"
          printf '%s\n' "${candidates[@]:-}"

          removed=0
          for f in "${candidates[@]}"; do
            if is_keep "$f"; then
              echo "KEEP   $f"
            else
              echo "DELETE $f"
              git rm -f -- "$f"
              removed=$((removed + 1))
            fi
          done

          echo "Removed obsolete files: $removed"

      - name: Verify only the approved four remain
        shell: bash
        run: |
          set -euo pipefail

          ROOT="android-apk/app/src/main/assets/level_snapshots"

          mapfile -t remaining < <(
            find "$ROOT" -type f \
              \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
              \( -path '*/sublevel_0-7/*' -o -path '*/sublevel_manila-room/*' -o -iname '*0-7*' -o -iname '*manila*' \) \
              | sort
          )

          printf 'Remaining matched files:\n'
          printf '%s\n' "${remaining[@]}"

          expected=(
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_01.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7/snapshot_level_0_sublevel_0-7_02.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_01.webp"
            "android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/snapshot_level_0_sublevel_manila-room_02.webp"
          )

          test "${#remaining[@]}" -eq 4 || {
            echo "::error::Expected exactly 4 matched snapshot files, found ${#remaining[@]}"
            exit 1
          }

          for i in 0 1 2 3; do
            test "${remaining[$i]}" = "${expected[$i]}" || {
              echo "::error::Unexpected remaining file: ${remaining[$i]}"
              exit 1
            }
          done

      - name: Commit cleanup if anything was removed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Current main tree is already clean; no obsolete 0.7/Manila snapshot files remain."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean obsolete Level 0.7 and Manila snapshot files'
          git push origin HEAD:main
