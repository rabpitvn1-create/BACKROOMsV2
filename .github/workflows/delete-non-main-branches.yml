name: Delete non-main branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-non-main-branches.yml

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi

            echo "Deleting branch: $branch"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
