name: Continue Retired Content Purge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/continue-purge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanitize shared patch dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sanitize-shared-patches.py
          python3 .github/scripts/repair-sanitized-patches.py
          python3 .github/scripts/repair-lucia-runtime.py
          python3 .github/scripts/sanitize-active-residue.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/purge-retired-systems.py')
          text = p.read_text(encoding='utf-8')
          anchor = '    ROOT / ".github/workflows/scan-madgod-annhien.yml",\n'
          extras = [
              '    ROOT / ".github/scripts/sanitize-shared-patches.py",\n',
              '    ROOT / ".github/scripts/sanitize-active-residue.py",\n',
              '    ROOT / ".github/scripts/repair-sanitized-patches.py",\n',
              '    ROOT / ".github/scripts/repair-lucia-runtime.py",\n',
              '    ROOT / ".github/workflows/continue-purge.yml",\n',
          ]
          if anchor not in text:
              raise SystemExit('purge exclusion anchor missing')
          insertion = ''.join(extra for extra in extras if extra not in text)
          if insertion:
              text = text.replace(anchor, anchor + insertion, 1)
          compile(text, str(p), 'exec')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove retired systems and repair patch chain
        run: python3 .github/scripts/purge-retired-systems.py

      - name: Stabilize Jeff prompt anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android-apk/patch-jeff-encounter-2pct.py')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^prompt_anchor = .*?$',
              "prompt_anchor = '\"Chỉ dùng flag root:'",
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'Jeff prompt anchor rewrite expected 1 match, got {count}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Syntax-check surviving Python patches
        shell: bash
        run: |
          set -euo pipefail
          find android-apk -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

      - name: Verify production patch chain in disposable copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/backroom-verify
          mkdir -p /tmp/backroom-verify
          cp -a android-apk /tmp/backroom-verify/android-apk
          find /tmp/backroom-verify -type d -name '__pycache__' -prune -exec rm -rf {} +
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-kai-encounter-overlay.py)
          for script in "${scripts[@]}"; do
            echo "VERIFY ==> $script"
            python3 "/tmp/backroom-verify/android-apk/$script"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/backroom-verify/android-apk')
          target = re.compile(r'MadGod|Mad God|madgod|mad god|AN_NHIEN|AnNhien|an_nhien|an-nhien|(?<![\w])An Nhiên(?![\w])|(?<![\w])An Nhien(?![\w])|annhien', re.I)
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              match = target.search(text)
              if match:
                  line = text[:match.start()].count('\n') + 1
                  raise SystemExit(f'generated output still contains retired reference: {path}:{line}:{match.group(0)}')
          print('Generated patch-chain output is clean.')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/purge-retired-systems.py
          rm -f .github/scripts/sanitize-shared-patches.py
          rm -f .github/scripts/sanitize-active-residue.py
          rm -f .github/scripts/repair-sanitized-patches.py
          rm -f .github/scripts/repair-lucia-runtime.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove MadGod and An Nhien systems'
          git push origin HEAD:main
