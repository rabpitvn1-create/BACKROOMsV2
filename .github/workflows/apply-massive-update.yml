name: Apply Massive Item Update

on:
  push:
    branches:
      - massive-update
    paths:
      - '.github/workflows/apply-massive-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: massive-update
          fetch-depth: 0
      - name: Apply item architecture update
        run: |
          set -euo pipefail
          python3 android-apk/patch-massive-item-update.py
          git diff --check
      - name: Commit transformed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No transformed changes to commit.'
            exit 0
          fi
          git commit -m 'Retire Omnivault and lock item drops'
          git push origin HEAD:massive-update
