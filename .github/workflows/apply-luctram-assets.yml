name: Apply Lục Trầm avatar and overlay

on:
  push:
    branches:
      - codex/luc-tram-sync
    paths:
      - '.github/workflows/apply-luctram-assets.yml'

permissions:
  contents: write

jobs:
  replace-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/luc-tram-sync
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download public Drive assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1M876xffPaGaYY8k2waX5h1ff5JcmxJVp&export=download&confirm=t' \
            -o /tmp/luctram_overlay.png
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1qauFB8EC6jDhVPOxVdrlXU_PLUFa_GHk&export=download&confirm=t' \
            -o /tmp/luctram_avatar.png

          echo '838a4d6b14797aa1e906789725de1a67dbeb176f7ca4ea4e6155c17a07c78d4b  /tmp/luctram_overlay.png' | sha256sum -c -
          echo 'ce363613a69ca6363e9717069002da4dc5b7ea6e2708971cd61bfc2a389b7544  /tmp/luctram_avatar.png' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          for p in (Path('/tmp/luctram_overlay.png'), Path('/tmp/luctram_avatar.png')):
              data = p.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'Not a PNG: {p}')
          PY

      - name: Replace runtime assets and regenerate overlay metrics
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/luctram_avatar.png android-apk/app/src/main/assets/avatars/lucia_avatar.png
          cp /tmp/luctram_overlay.png android-apk/app/src/main/assets/lucia_entity_overlay.png

          test "$(git hash-object android-apk/app/src/main/assets/avatars/lucia_avatar.png)" = '1ce0362afa76281c0dc1fac0e414954ac28ee484'
          test "$(git hash-object android-apk/app/src/main/assets/lucia_entity_overlay.png)" = '5040709dc73f63185ed7c857af3a6589d0a0aa7b'

          java android-apk/tools/GenerateOverlayMetrics.java
          java android-apk/tools/GenerateOverlayMetrics.java --check

      - name: Update asset assertions and canon notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          build = Path('.github/workflows/build-backroom-apk.yml')
          s = build.read_text()
          s = s.replace(
              "test \"$(git hash-object android-apk/app/src/main/assets/avatars/lucia_avatar.png)\" = 'e87ba8a420346fac12dc5129d5619b958b85f518'",
              "test \"$(git hash-object android-apk/app/src/main/assets/avatars/lucia_avatar.png)\" = '1ce0362afa76281c0dc1fac0e414954ac28ee484'"
          )
          s = s.replace(
              "test \"$(git hash-object android-apk/app/src/main/assets/lucia_entity_overlay.png)\" = 'aeafc7403ce4845fe5bd64825f7ba3ef52b62a82'",
              "test \"$(git hash-object android-apk/app/src/main/assets/lucia_entity_overlay.png)\" = '5040709dc73f63185ed7c857af3a6589d0a0aa7b'"
          )
          build.write_text(s)

          codex = Path('android-apk/CHARACTER_CODEX_CURRENT.md')
          s = codex.read_text()
          s = s.replace(
              '- Avatar và combat overlay hiện **giữ nguyên asset legacy**; retcon hình ảnh sẽ xử lý riêng sau.',
              '- Avatar và combat overlay đã được thay bằng ảnh Lục Trầm hiện hành từ Google Drive. Runtime vẫn giữ tên file legacy `lucia_avatar.png` và `lucia_entity_overlay.png` chỉ để tránh phá đường dẫn hiện có; nội dung hình ảnh là Lục Trầm.'
          )
          codex.write_text(s)

          chars = Path('android-apk/app/src/main/assets/knowledge/characters_current.json')
          data = json.loads(chars.read_text())
          visual = data['characters']['lucia']['visual']
          visual = visual.replace(
              'Avatar/overlay assets are intentionally unchanged for now.',
              "Avatar and combat overlay now use Lục Trầm's current Drive images; legacy runtime filenames are retained only for path compatibility."
          )
          data['characters']['lucia']['visual'] = visual
          chars.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          dbp = Path('android-apk/app/src/main/assets/knowledge/knowledge_db.json')
          db = json.loads(dbp.read_text())
          for record in db.get('records', []):
              if record.get('id') == 'CHAR.LUC_TRAM.VISUAL_R01':
                  record['text'] = record['text'].replace(
                      'Avatar and overlay assets are intentionally unchanged until a later art pass.',
                      "Avatar and combat overlay now use Lục Trầm's current Drive images; legacy runtime filenames are retained only for path compatibility."
                  )
                  break
          else:
              raise SystemExit('CHAR.LUC_TRAM.VISUAL_R01 not found')
          dbp.write_text(json.dumps(db, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"lucia_entity_overlay.png":{"width":1024,"height":1536' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq '"sha256":"838a4d6b14797aa1e906789725de1a67dbeb176f7ca4ea4e6155c17a07c78d4b"' android-apk/app/src/main/assets/snapshot-ui.js
          node --check android-apk/app/src/main/assets/snapshot-ui.js
          node --check android-apk/app/src/main/assets/party-ui.js
          node --test android-apk/tests/snapshot-layout.test.cjs android-apk/tests/snapshot-visibility.test.cjs
          python3 -m json.tool android-apk/app/src/main/assets/knowledge/characters_current.json >/dev/null
          python3 -m json.tool android-apk/app/src/main/assets/knowledge/knowledge_db.json >/dev/null
          git diff --check

      - name: Commit verified replacement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-luctram-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-apk/app/src/main/assets/avatars/lucia_avatar.png \
            android-apk/app/src/main/assets/lucia_entity_overlay.png \
            android-apk/app/src/main/assets/snapshot-ui.js \
            android-apk/app/src/main/assets/knowledge/characters_current.json \
            android-apk/app/src/main/assets/knowledge/knowledge_db.json \
            android-apk/CHARACTER_CODEX_CURRENT.md \
            .github/workflows/build-backroom-apk.yml \
            .github/workflows/apply-luctram-assets.yml
          git commit -m 'Replace Lục Trầm avatar and overlay'
          git push origin HEAD:codex/luc-tram-sync
