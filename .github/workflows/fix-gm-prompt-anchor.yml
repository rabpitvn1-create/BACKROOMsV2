name: Fix GM Prompt Anchor

on:
  push:
    branches:
      - release/pr06-gm-prose
    paths:
      - '.github/workflows/fix-gm-prompt-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep legacy prompt anchor while preserving refined prose
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java')
          text = p.read_text(encoding='utf-8')
          needle = '            "Không thay đổi dữ kiện chưa có căn cứ. Người chơi chỉ điều khiển hành động có chủ ý của Kai Akechi; không tự chọn hành động tiếp theo thay người chơi. " +\n'
          anchor = '            "Viết tiếng Việt tự nhiên, đầy đủ ý. Không trả lời bằng câu rỗng. Không thay đổi dữ kiện chưa có căn cứ. Người chơi chỉ điều khiển Kai Akechi. " +\n'
          if text.count(needle) != 1:
              raise SystemExit(f'refined prompt anchor expected once, found {text.count(needle)}')
          if anchor in text:
              raise SystemExit('legacy prompt anchor already present')
          p.write_text(text.replace(needle, anchor + needle, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit prompt compatibility line
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          git commit -m 'Preserve GM prompt patch compatibility'
          git push origin HEAD:release/pr06-gm-prose
