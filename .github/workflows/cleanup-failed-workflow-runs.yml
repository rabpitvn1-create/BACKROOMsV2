name: Cleanup failed workflow runs

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Delete failed workflow runs created within the last N days"
        required: true
        default: "3"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete recent failed runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || [ "$DAYS" -lt 1 ]; then
            echo "days must be a positive integer" >&2
            exit 1
          fi

          cutoff="$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Deleting failed workflow runs created from $cutoff through $now"

          mapfile -t run_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=failure&per_page=100" \
              --jq ".workflow_runs[] | select(.created_at >= \"$cutoff\" and .created_at <= \"$now\") | .id"
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No failed workflow runs found in the requested window."
            exit 0
          fi

          echo "Found ${#run_ids[@]} failed workflow run(s)."

          for run_id in "${run_ids[@]}"; do
            echo "Deleting workflow run $run_id"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

          echo "Deleted ${#run_ids[@]} failed workflow run(s)."
