name: Cleanup failed workflow runs

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Delete failed runs created at or after this ISO-8601 UTC timestamp"
        required: true
        default: "2026-09-12T11:00:00Z"
        type: string
      until:
        description: "Optional ISO-8601 UTC end timestamp; leave blank to use current time"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete failed runs in exact window
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        shell: bash
        run: |
          set -euo pipefail

          if ! cutoff="$(date -u -d "$SINCE" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"; then
            echo "Invalid since timestamp: $SINCE" >&2
            exit 1
          fi

          if [ -n "$UNTIL" ]; then
            if ! until="$(date -u -d "$UNTIL" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"; then
              echo "Invalid until timestamp: $UNTIL" >&2
              exit 1
            fi
          else
            until="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          if [[ "$cutoff" > "$until" ]]; then
            echo "since must not be later than until" >&2
            exit 1
          fi

          echo "Deleting failed workflow runs created from $cutoff through $until"

          mapfile -t run_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?status=failure&per_page=100" \
              --jq ".workflow_runs[] | select(.created_at >= \"$cutoff\" and .created_at <= \"$until\") | .id"
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No failed workflow runs found in the requested window."
            exit 0
          fi

          echo "Found ${#run_ids[@]} failed workflow run(s)."

          for run_id in "${run_ids[@]}"; do
            echo "Deleting workflow run $run_id"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done

          echo "Deleted ${#run_ids[@]} failed workflow run(s)."
