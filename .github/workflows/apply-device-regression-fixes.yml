name: Apply device regression fixes

on:
  push:
    branches:
      - fix/device-regressions-1.1.77

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-regressions-1.1.77
          fetch-depth: 0

      - name: Apply focused fixes and regressions
        run: |
          set -euo pipefail
          python3 android-apk/apply-device-regression-fixes.py
          rm -f android-apk/apply-device-regression-fixes.py
          rm -f .github/workflows/apply-device-regression-fixes.yml
          git diff --check

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Android device regressions"
          git push origin HEAD:fix/device-regressions-1.1.77
