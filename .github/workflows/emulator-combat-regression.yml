name: Emulator Combat Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/emu-combat-regression.sh'
      - '.github/workflows/emulator-combat-regression.yml'

permissions:
  actions: read
  contents: read

jobs:
  combat-regression:
    runs-on: ubuntu-latest
    env:
      MAX_EXPLORES: 16
      POLL_SECONDS: 1
      TURN_TIMEOUT_SECONDS: 120
      COMBAT_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve APK from tested main base
        id: apk_run
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-backroom-apk.yml/runs?per_page=40")
            run_id=$(jq -r --arg sha "$BASE_SHA" '.workflow_runs[] | select(.head_sha==$sha and .status=="completed" and .conclusion=="success") | .id' <<<"$json" | head -1)
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Using successful Build Backroom APK run $run_id for main base $BASE_SHA"
              exit 0
            fi
            echo "Waiting for successful APK build for $BASE_SHA ($attempt/80)"
            sleep 15
          done
          echo "No successful APK build found for $BASE_SHA" >&2
          exit 1

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.apk_run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p apk-artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir apk-artifact
          APK=$(find apk-artifact -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" Backroom-under-test.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real APK combat probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          script: bash .github/scripts/emu-combat-regression.sh Backroom-under-test.apk

      - name: Upload combat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-combat-regression-${{ github.run_id }}
          path: emu-combat-results/
          if-no-files-found: warn
