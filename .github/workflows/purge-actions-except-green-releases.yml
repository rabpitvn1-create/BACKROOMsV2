name: Purge Actions Except Green Releases

run-name: Purge non-release workflow history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE_NON_RELEASE_RUNS to confirm'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/purge-actions-except-green-releases.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-actions-except-green-releases
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONFIRM}" != "DELETE_NON_RELEASE_RUNS" ]]; then
            echo "::error::Confirmation must be exactly DELETE_NON_RELEASE_RUNS"
            exit 1
          fi

      - name: Delete every non-release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          kept_release_runs=0
          deleted_runs=0
          failed_deletions=0
          orphaned_queued_runs=0
          skipped_current=0

          mapfile -t RUNS < <(
            gh api --paginate               -H 'Accept: application/vnd.github+json'               "/repos/${REPO}/actions/runs?per_page=100"               --jq '.workflow_runs[] | {id, name, status, conclusion: (.conclusion // ""), head_branch, created_at} | @json'
          )

          is_green_release_run() {
            local run_id="$1"
            local status="$2"
            local conclusion="$3"

            [[ "${status}" == "completed" && "${conclusion}" == "success" ]] || return 1

            gh api --paginate               -H 'Accept: application/vnd.github+json'               "/repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100"               --jq '[
                .jobs[].steps[]?
                | select((.name // "") | test("^Publish GitHub Release v"))
                | select(.conclusion == "success")
              ] | length > 0'               | grep -qx 'true'
          }

          cancel_if_needed() {
            local run_id="$1"
            local status="$2"

            [[ "${status}" == "completed" ]] && return 0

            gh api --method POST               "/repos/${REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            gh api --method POST               "/repos/${REPO}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1 || true

            for _ in {1..15}; do
              current_status="$(
                gh api                   -H 'Accept: application/vnd.github+json'                   "/repos/${REPO}/actions/runs/${run_id}"                   --jq '.status' 2>/dev/null || echo missing
              )"
              [[ "${current_status}" == "missing" || "${current_status}" == "completed" ]] && return 0
              sleep 2
            done
          }

          for row in "${RUNS[@]}"; do
            run_id="$(jq -r '.id' <<< "${row}")"
            run_name="$(jq -r '.name' <<< "${row}")"
            status="$(jq -r '.status' <<< "${row}")"
            conclusion="$(jq -r '.conclusion' <<< "${row}")"
            branch="$(jq -r '.head_branch // ""' <<< "${row}")"
            created_at="$(jq -r '.created_at' <<< "${row}")"

            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              echo "Preserving current purge run ${run_id}; an in-progress run cannot delete itself."
              skipped_current=$((skipped_current + 1))
              continue
            fi

            if is_green_release_run "${run_id}" "${status}" "${conclusion}"; then
              echo "KEEP release run ${run_id}: ${run_name} [branch=${branch}, created=${created_at}]"
              kept_release_runs=$((kept_release_runs + 1))
              continue
            fi

            echo "DELETE run ${run_id}: ${run_name} [status=${status}, conclusion=${conclusion:-none}, branch=${branch}]"
            cancel_if_needed "${run_id}" "${status}"

            deleted=false
            for _ in {1..5}; do
              if gh api --method DELETE                 -H 'Accept: application/vnd.github+json'                 "/repos/${REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
                deleted=true
                break
              fi
              sleep 2
            done

            if [[ "${deleted}" == "true" ]]; then
              deleted_runs=$((deleted_runs + 1))
            else
              job_count="$(
                gh api                   -H 'Accept: application/vnd.github+json'                   "/repos/${REPO}/actions/runs/${run_id}/jobs?per_page=1"                   --jq '.total_count' 2>/dev/null || echo -1
              )"
              if [[ "${status}" == "queued" && "${job_count}" == "0" ]]; then
                echo "::warning::Preserving orphaned queued run ${run_id}: GitHub reports zero jobs and refuses deletion."
                orphaned_queued_runs=$((orphaned_queued_runs + 1))
              else
                echo "::warning::Failed to delete workflow run ${run_id}"
                failed_deletions=$((failed_deletions + 1))
              fi
            fi
          done

          echo
          echo "Green release runs preserved: ${kept_release_runs}"
          echo "Non-release runs deleted: ${deleted_runs}"
          echo "Current purge run preserved temporarily: ${skipped_current}"
          echo "Orphaned queued runs preserved by GitHub: ${orphaned_queued_runs}"
          echo "Failed deletions: ${failed_deletions}"

          if (( failed_deletions != 0 )); then
            exit 1
          fi
