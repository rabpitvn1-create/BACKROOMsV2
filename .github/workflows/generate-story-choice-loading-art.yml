name: Generate Story Choice Loading Backrooms Art

on:
  push:
    branches:
      - art/story-choice-loading-overlay
    paths:
      - '.github/workflows/generate-story-choice-loading-art.yml'

permissions:
  contents: write

concurrency:
  group: generate-story-choice-loading-backrooms-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_DIR: android-apk/app/src/main/assets/hud
      OUT_FILE: android-apk/app/src/main/assets/hud/story_choice_loading_backrooms.png

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate IMG API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_DIR"

      - name: Generate Backrooms artwork for Story choice loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          api = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = base if base.endswith("/images/generations") else (
              base + "/images/generations" if base.endswith("/v1") else base + "/v1/images/generations"
          )
          out_dir = pathlib.Path(os.environ["OUT_DIR"])
          out_dir.mkdir(parents=True, exist_ok=True)

          prompt = (
              "A cinematic Backrooms loading-panel background for a mobile dark survival text game. "
              "Empty Level 0 yellow office maze, stained yellow-beige wallpaper, damp worn carpet, repeating rectangular openings, "
              "cold fluorescent ceiling lights and subtly impossible liminal perspective. The scene should feel uncanny, lonely and oppressive. "
              "Composition is for a medium vertical UI card covering three stacked decision buttons: keep the central area calm and readable, "
              "with richer corridor architecture and fluorescent detail toward the edges. Dominant dirty amber, mustard yellow, nicotine yellow, "
              "olive and charcoal palette, realistic game concept art, restrained cinematic lighting, fine grime and material texture. "
              "No people, no creatures, no weapons, no text, no letters, no numbers, no logos, no watermark, no UI elements, no border frame, "
              "no neon, no excessive bloom, no gore."
          )

          payload = {"model": model, "prompt": prompt, "n": 1, "response_format": "b64_json"}
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=300) as response:
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"IMG API HTTP {exc.code}: {detail[:2000]}")

          data = body.get("data")
          if not isinstance(data, list) or not data:
              raise SystemExit("IMG API response has no data[0]")
          item = data[0]
          if item.get("b64_json"):
              raw = base64.b64decode(item["b64_json"])
          elif item.get("url"):
              dl = urllib.request.Request(item["url"], headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"})
              with urllib.request.urlopen(dl, timeout=300) as response:
                  raw = response.read()
          else:
              raise SystemExit("IMG API response has neither b64_json nor url")

          if raw.startswith(b"\x89PNG\r\n\x1a\n"):
              ext = "png"
          elif raw.startswith(b"\xff\xd8\xff"):
              ext = "jpg"
          elif raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
              ext = "webp"
          elif raw.startswith((b"GIF87a", b"GIF89a")):
              ext = "gif"
          elif len(raw) >= 12 and raw[4:8] == b"ftyp":
              ext = "avif"
          else:
              raise SystemExit(f"Unsupported IMG API format; magic={raw[:16].hex()} length={len(raw)}")

          source = out_dir / f"story_choice_loading_backrooms.source.{ext}"
          source.write_bytes(raw)
          (out_dir / "story_choice_loading_backrooms.generated.json").write_text(
              json.dumps({"model": model, "prompt": prompt}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          src="$(find "$OUT_DIR" -maxdepth 1 -type f -name 'story_choice_loading_backrooms.source.*' -print -quit)"
          test -n "$src"
          convert "$src" -auto-orient -resize '1200x760^' -gravity center -extent 1200x760 "$OUT_FILE"
          rm "$src"
          identify "$OUT_FILE"

      - name: Verify generated asset and UI contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT_FILE"
          test "$(identify -format '%wx%h' "$OUT_FILE")" = "1200x760"
          test -s "$OUT_DIR/story_choice_loading_backrooms.generated.json"
          grep -Fq "url('hud/story_choice_loading_backrooms.png')" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'story-choice-hourglass-spin' android-apk/app/src/main/assets/gm-choice-ui.js
          node --test android-apk/tests/story-choice-ui.test.js

      - name: Commit IMG API artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/hud/story_choice_loading_backrooms.png \
                  android-apk/app/src/main/assets/hud/story_choice_loading_backrooms.generated.json
          git diff --cached --quiet && { echo 'Story choice loading artwork unchanged.'; exit 0; }
          git commit -m 'Generate Story choice loading art with IMG API'
          git push origin HEAD:art/story-choice-loading-overlay
