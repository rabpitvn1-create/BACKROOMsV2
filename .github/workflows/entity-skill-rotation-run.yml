name: Run Entity skill rotation with Gradle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/entity-skill-rotation-run.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply validated patch script
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/entity-skill-rotation-final.yml | sed '1d;$d;s/^          //' > /tmp/entity_patch.py
          python3 /tmp/entity_patch.py
      - name: Test and build
        working-directory: android-apk
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/entity-skill-rotation-once.yml .github/workflows/entity-skill-rotation-fix.yml .github/workflows/entity-skill-rotation-final.yml .github/workflows/entity-skill-rotation-run.yml
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java android-apk/app/src/main/assets/knowledge/entity_encounters.json
          git commit -m 'Add first Entity auto-proc skills'
          git push origin HEAD:main
