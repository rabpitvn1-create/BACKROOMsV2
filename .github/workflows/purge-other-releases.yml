name: Purge Other Releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/purge-other-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete every release except v1.1.64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep='v1.1.64'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' > /tmp/releases.tsv

          deleted=0
          while IFS=$'\t' read -r release_id tag; do
            [ -n "${release_id:-}" ] || continue
            if [ "$tag" = "$keep" ]; then
              echo "KEEP  $tag ($release_id)"
              continue
            fi
            echo "DELETE $tag ($release_id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            deleted=$((deleted + 1))
          done < /tmp/releases.tsv

          echo "Deleted $deleted release(s); kept $keep."

      - name: Verify only v1.1.64 remains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "v1.1.64") | .tag_name')
          if [ -n "$unexpected" ]; then
            echo "Unexpected releases remain:"
            echo "$unexpected"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.64" --jq '.tag_name'

      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/purge-other-releases.yml
          git commit -m 'Remove release purge workflow'
          git push origin HEAD:main
