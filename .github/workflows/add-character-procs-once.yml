      - name: Run focused tests
        working-directory: android-apk
        run: ./gradlew testDebugUnitTest --tests com.rabpit.backroom.core.CombatChoiceEngineTest
      - name: Commit gameplay update
        run: |
          rm .github/workflows/add-character-procs-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java .github/workflows/add-character-procs-once.yml
          git commit -m 'Add Cao Minh and Lucia proc skills'
          git push
