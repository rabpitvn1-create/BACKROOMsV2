name: Add character procs once
on:
  push:
    paths:
      - '.github/workflows/add-character-procs-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch proc skills
        shell: python
        run: |
          from pathlib import Path
          p=Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java')
          s=p.read_text()
          s=s.replace('  private static final class Ultimate {', '''  private static final class CharacterProc {
    final String name; final int procPercent; final String effect; final int turns; final int value;
    CharacterProc(String name, int procPercent, String effect, int turns, int value) {
      this.name=name; this.procPercent=procPercent; this.effect=effect; this.turns=turns; this.value=value;
    }
  }

  private static final class Ultimate {''')
          s=s.replace('  private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();', '''  private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();
  private static final Map<String, List<CharacterProc>> CHARACTER_PROCS = new LinkedHashMap<>();''')
          s=s.replace('    // Ultimate damage derives from each character', '''    characterProcs("cao_minh", new CharacterProc("Huyết Sát Thực Cốt", 50, "Chảy máu", 2, 4));
    characterProcs("lucia", new CharacterProc("Toxic Round", 50, "Trúng độc", 2, 4));

    // Ultimate damage derives from each character''')
          s=s.replace('  private static EntitySkill entitySkill', '''  private static void characterProcs(String id, CharacterProc... definitions) {
    List<CharacterProc> list = new ArrayList<>();
    for (CharacterProc definition : definitions) list.add(definition);
    CHARACTER_PROCS.put(id, list);
  }

  private static EntitySkill entitySkill''')
          s=s.replace('.put("bleedPercent", 0)\n            .put("stunTurns", 0));', '''.put("bleedPercent", 0)
            .put("poisonTurns", 0)
            .put("poisonPercent", 0)
            .put("armorPenTurns", 0)
            .put("armorPenPercent", 0)
            .put("stunTurns", 0));''')
          s=s.replace('      applyEntityDamage(combat, entity, damage);\n      if ("TWO PAIR".equals(hand)) {', '''      applyEntityDamage(combat, entity, damage);
      applyCharacterProcs(combat, actor, entity);
      if ("TWO PAIR".equals(hand)) {''')
          s=s.replace('    applySkillEffect(entity, selected);\n    result.summary', '''    applySkillEffect(entity, selected);
    applyCharacterProcs(combat, actor, entity);
    result.summary''')
          marker='  private static void applySkillEffect(JSONObject entity, JSONObject selected) throws Exception {'
          insert='''  private static void applyCharacterProcs(JSONObject combat, JSONObject actor, JSONObject entity) throws Exception {
    List<CharacterProc> pool = CHARACTER_PROCS.get(actor.optString("id", ""));
    if (pool == null) return;
    for (int i=0;i<pool.size();i++) {
      CharacterProc proc=pool.get(i);
      if (nextPercent(combat, "character-proc:" + actor.optString("id", "") + ":" + i) >= proc.procPercent) continue;
      applyStackingEffect(entity, proc.effect, proc.turns, proc.value);
      addFeedback(combat, "actor", "entity", "proc", proc.name + " · " + proc.effect, true);
    }
  }

  static void applyStackingEffect(JSONObject entity, String effect, int turns, int value) throws Exception {
    turns=Math.max(0,turns); value=Math.max(0,value);
    if ("Choáng".equals(effect) && turns>0) {
      entity.put("stunTurns", Math.min(3, Math.max(0,entity.optInt("stunTurns",0)) + turns));
    } else if ("Chảy máu".equals(effect) && turns>0 && value>0) {
      entity.put("bleedTurns", Math.max(entity.optInt("bleedTurns",0), turns));
      entity.put("bleedPercent", Math.min(25, Math.max(0,entity.optInt("bleedPercent",0)) + value));
    } else if ("Trúng độc".equals(effect) && turns>0 && value>0) {
      entity.put("poisonTurns", Math.max(entity.optInt("poisonTurns",0), turns));
      entity.put("poisonPercent", Math.min(25, Math.max(0,entity.optInt("poisonPercent",0)) + value));
    } else if ("Xuyên giáp".equals(effect) && turns>0 && value>0) {
      entity.put("armorPenTurns", Math.max(entity.optInt("armorPenTurns",0), turns));
      entity.put("armorPenPercent", Math.min(75, Math.max(0,entity.optInt("armorPenPercent",0)) + value));
    }
  }

'''
          s=s.replace(marker, insert+marker)
          s=s.replace('      entity.put("stunTurns", Math.max(entity.optInt("stunTurns", 0), turns));', '      applyStackingEffect(entity, effect, turns, value);')
          s=s.replace('      entity.put("bleedTurns", Math.max(entity.optInt("bleedTurns", 0), turns));\n      entity.put("bleedPercent", Math.max(entity.optInt("bleedPercent", 0), value));', '      applyStackingEffect(entity, effect, turns, value);')
          old='''    int turns = Math.max(0, entity.optInt("bleedTurns", 0));
    int percent = Math.max(0, entity.optInt("bleedPercent", 0));
    if (turns <= 0 || percent <= 0 || entity.optInt("hp", 0) <= 0) return;
    int damage = Math.max(1, entity.optInt("maxHp", 1) * percent / 100);
    entity.put("hp", Math.max(0, entity.optInt("hp", 0) - damage));
    entity.put("bleedTurns", turns - 1);
    addFeedback(combat, "actor", "entity", "damage", "-" + damage + " HP", true);'''
          new='''    if (entity.optInt("hp",0) <= 0) return;
    int bleedTurns=Math.max(0,entity.optInt("bleedTurns",0));
    int poisonTurns=Math.max(0,entity.optInt("poisonTurns",0));
    int percent=(bleedTurns>0?Math.max(0,entity.optInt("bleedPercent",0)):0)
        +(poisonTurns>0?Math.max(0,entity.optInt("poisonPercent",0)):0);
    if (percent>0) {
      int damage=Math.max(1,entity.optInt("maxHp",1)*percent/100);
      entity.put("hp",Math.max(0,entity.optInt("hp",0)-damage));
      addFeedback(combat,"actor","entity","damage","-"+damage+" HP",true);
    }
    if (bleedTurns>0) entity.put("bleedTurns",bleedTurns-1);
    if (poisonTurns>0) entity.put("poisonTurns",poisonTurns-1);
    int armorTurns=Math.max(0,entity.optInt("armorPenTurns",0));
    if (armorTurns>0) entity.put("armorPenTurns",armorTurns-1);'''
          if old not in s: raise SystemExit('tick block not found')
          s=s.replace(old,new)
          p.write_text(s)
      - name: Add regression tests
        shell: bash
        run: |
          cat > android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterProcStackingTest.java <<'EOF'
          package com.rabpit.backroom.core;
          import static org.junit.Assert.assertEquals;
          import org.json.JSONObject;
          import org.junit.Test;
          public class CharacterProcStackingTest {
            @Test public void bleedAndPoisonIncreaseDamageNotDuration() throws Exception {
              JSONObject e=new JSONObject();
              CombatChoiceEngine.applyStackingEffect(e,"Chảy máu",2,4);
              CombatChoiceEngine.applyStackingEffect(e,"Chảy máu",2,4);
              assertEquals(2,e.getInt("bleedTurns")); assertEquals(8,e.getInt("bleedPercent"));
              CombatChoiceEngine.applyStackingEffect(e,"Trúng độc",2,5);
              CombatChoiceEngine.applyStackingEffect(e,"Trúng độc",2,5);
              assertEquals(2,e.getInt("poisonTurns")); assertEquals(10,e.getInt("poisonPercent"));
            }
            @Test public void armorPenIncreasesPercentNotDuration() throws Exception {
              JSONObject e=new JSONObject();
              CombatChoiceEngine.applyStackingEffect(e,"Xuyên giáp",2,15);
              CombatChoiceEngine.applyStackingEffect(e,"Xuyên giáp",2,15);
              assertEquals(2,e.getInt("armorPenTurns")); assertEquals(30,e.getInt("armorPenPercent"));
            }
            @Test public void stunIsOnlyDurationStackAndIsCapped() throws Exception {
              JSONObject e=new JSONObject();
              CombatChoiceEngine.applyStackingEffect(e,"Choáng",1,0);
              CombatChoiceEngine.applyStackingEffect(e,"Choáng",1,0);
              CombatChoiceEngine.applyStackingEffect(e,"Choáng",2,0);
              assertEquals(3,e.getInt("stunTurns"));
            }
          }
          EOF
      - name: Run focused tests
        working-directory: android-apk
        run: ./gradlew testDebugUnitTest --tests 'com.rabpit.backroom.core.CombatChoiceEngineTest' --tests 'com.rabpit.backroom.core.CharacterProcStackingTest'
      - name: Commit gameplay change and remove one-shot workflow
        run: |
          rm .github/workflows/add-character-procs-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add Cao Minh and Lucia proc skills'
          git push origin main