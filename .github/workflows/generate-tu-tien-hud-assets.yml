name: Generate Tu Tien HUD Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-tu-tien-hud-assets.yml'

permissions:
  contents: write

concurrency:
  group: generate-tu-tien-hud-assets-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_DIR: android-apk/app/src/main/assets/hud

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_DIR"

      - name: Generate HUD source art via configured image API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          api = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = base if base.endswith("/images/generations") else (
              base + "/images/generations" if base.endswith("/v1") else base + "/v1/images/generations"
          )
          out = pathlib.Path(os.environ["OUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)

          prompts = {
              "snapshot_frame": (
                  "Game UI asset only, no scene and no characters. A premium ornate rectangular viewport frame for a dark xianxia cultivation game "
                  "lost inside the Backrooms. Four-sided frame, antique blackened metal and obsidian, aged muted brass, deep dried-blood crimson accents, "
                  "subtle talisman engravings and formation-array geometry concentrated at the four corners. Slight worn fluorescent-yellow Backrooms contamination, "
                  "liminal industrial corrosion, sinister ancient immortal-artifact feeling. Strong readable silhouette on a phone screen, sophisticated and restrained, "
                  "not baroque, not cyberpunk, not sci-fi military. The center must be visually empty/plain so it can be cut out later. "
                  "No words, no letters, no numbers, no logos, no watermark, no people, no weapons, no scenery."
              ),
              "action_plate": (
                  "Game UI asset only. A single wide horizontal action-button plate for a dark xianxia cultivation game inside the Backrooms. "
                  "Ancient blackened metal and lacquered obsidian body, aged brass edge pieces, deep blood-red inner energy, restrained talisman lines and formation sigils "
                  "at both ends, slight fluorescent-yellow liminal contamination and worn industrial texture. Premium mobile RPG HUD, strong readable silhouette, "
                  "wide and low, symmetrical, elegant, ominous, not cyberpunk, not military, no glow overload. "
                  "Absolutely no text, no letters, no numbers, no icons, no logos, no watermark."
              )
          }

          def request_image(prompt):
              payload = {"model": model, "prompt": prompt, "n": 1, "response_format": "b64_json"}
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Image API HTTP {exc.code}: {detail[:2000]}")
              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit("Image API response has no data[0]")
              item = data[0]
              if item.get("b64_json"):
                  return base64.b64decode(item["b64_json"])
              if item.get("url"):
                  dl = urllib.request.Request(item["url"], headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"})
                  with urllib.request.urlopen(dl, timeout=300) as response:
                      return response.read()
              raise SystemExit("Image API response has neither b64_json nor url")

          for name, prompt in prompts.items():
              raw = request_image(prompt)
              magic = raw[:16].hex()
              if magic.startswith("89504e470d0a1a0a"):
                  ext = "png"
              elif magic.startswith("ffd8ff"):
                  ext = "jpg"
              elif raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
                  ext = "webp"
              elif raw.startswith((b"GIF87a", b"GIF89a")):
                  ext = "gif"
              elif len(raw) >= 12 and raw[4:8] == b"ftyp":
                  ext = "avif"
              else:
                  raise SystemExit(f"Unsupported image format for {name}; magic={magic} length={len(raw)}")
              (out / f"{name}.source.{ext}").write_bytes(raw)

          (out / "hud_assets.generated.json").write_text(
              json.dumps({"model": model, "prompts": prompts}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build transparent HUD assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          frame_src="$(find "$OUT_DIR" -maxdepth 1 -type f -name 'snapshot_frame.source.*' -print -quit)"
          action_src="$(find "$OUT_DIR" -maxdepth 1 -type f -name 'action_plate.source.*' -print -quit)"
          test -n "$frame_src"
          test -n "$action_src"

          convert "$frame_src" -auto-orient -resize '1536x1152^' -gravity center -extent 1536x1152 \
            -alpha on -fill 'rgba(0,0,0,0)' \
            -draw 'roundrectangle 108,92 1428,1060 18,18' \
            "$OUT_DIR/snapshot_frame.png"

          convert "$action_src" -auto-orient -resize '1400x300^' -gravity center -extent 1400x300 \
            -alpha on "$OUT_DIR/action_plate.png"

          rm "$frame_src" "$action_src"

      - name: Verify HUD assets
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/snapshot_frame.png"
          test -s "$OUT_DIR/action_plate.png"
          test "$(identify -format '%wx%h' "$OUT_DIR/snapshot_frame.png")" = "1536x1152"
          test "$(identify -format '%wx%h' "$OUT_DIR/action_plate.png")" = "1400x300"

          frame_alpha="$(identify -format '%[opaque]' "$OUT_DIR/snapshot_frame.png")"
          test "$frame_alpha" = "False" || { echo "::error::snapshot_frame.png must contain transparency"; exit 1; }

          file "$OUT_DIR/snapshot_frame.png"
          file "$OUT_DIR/action_plate.png"
          sha256sum "$OUT_DIR/snapshot_frame.png" "$OUT_DIR/action_plate.png"

      - name: Commit generated HUD assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR/snapshot_frame.png" "$OUT_DIR/action_plate.png" "$OUT_DIR/hud_assets.generated.json"
          git diff --cached --quiet && { echo 'HUD assets unchanged.'; exit 0; }
          git commit -m 'Generate Tu Tien HUD assets'
          git push origin HEAD:main
