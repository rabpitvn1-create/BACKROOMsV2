name: Regenerate Hound Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/regenerate-hound-overlay.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-hound-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-hound:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Regenerate Hound overlay from current asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          from collections import deque
          import json
          import math
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          from PIL import Image

          target = pathlib.Path("android-apk/app/src/main/assets/entity/hound.png")
          original = Image.open(target).convert("RGBA")
          target_size = original.size

          api_key = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base_url = os.environ["IMG_BASE_URL"].strip().rstrip("/")

          if base_url.endswith("/images/generations"):
              endpoint = base_url
          elif base_url.endswith("/v1"):
              endpoint = base_url + "/images/generations"
          else:
              endpoint = base_url + "/v1/images/generations"

          prompt = (
              "Create a polished in-game entity overlay of a Backrooms Hound. "
              "The Hound is a terrifying emaciated humanoid-canine creature moving on all fours, with unnaturally "
              "long limbs, lean sinewy anatomy, dark gray to near-black skin or extremely short fur, sharp claws, "
              "a snarling predatory mouth with visible teeth, and an aggressive hostile posture. "
              "Show exactly ONE Hound, FULL BODY, completely visible with no cropping, centered and grounded, "
              "with a strong readable silhouette suitable for a mobile game overlay. "
              "Use detailed dark horror game art, not cute, not cartoon mascot, not photorealistic scenery. "
              "Place it on one perfectly flat uniform chroma-key green background #00FF00 with absolutely no "
              "scenery, texture, gradient, fog, frame, text, watermark, props, or extra creatures. "
              "Do not use green anywhere on the Hound. Add one soft neutral dark-gray contact shadow directly "
              "under the feet/body so the creature visibly touches the ground; the shadow must contain no green."
          )

          payload = {
              "model": model,
              "prompt": prompt,
              "response_format": "url",
              "n": 1
          }

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          body = None
          max_attempts = 6
          for attempt in range(1, max_attempts + 1):
              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  retryable = exc.code == 429 or 500 <= exc.code < 600
                  if not retryable or attempt == max_attempts:
                      raise SystemExit(f"Image API HTTP {exc.code}: {detail[:2000]}")
                  delay = min(60, 8 * (2 ** (attempt - 1)))
                  print(f"Image API HTTP {exc.code}; retry {attempt}/{max_attempts} after {delay}s")
                  time.sleep(delay)
              except urllib.error.URLError as exc:
                  if attempt == max_attempts:
                      raise SystemExit(f"Image API network error: {exc}")
                  delay = min(60, 8 * (2 ** (attempt - 1)))
                  print(f"Image API network error; retry {attempt}/{max_attempts} after {delay}s")
                  time.sleep(delay)

          if body is None:
              raise SystemExit("Image API returned no response")

          data = body.get("data")
          if not isinstance(data, list) or not data:
              raise SystemExit("Image API response has no data[0]")

          item = data[0]
          if item.get("b64_json"):
              generated_bytes = base64.b64decode(item["b64_json"])
          elif item.get("url"):
              download = urllib.request.Request(
                  item["url"],
                  headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"}
              )
              with urllib.request.urlopen(download, timeout=300) as response:
                  generated_bytes = response.read()
          else:
              raise SystemExit("Image API response has neither b64_json nor url")

          generated = Image.open(io.BytesIO(generated_bytes)).convert("RGBA")

          # First try chroma-key removal. If the image model ignores the exact green,
          # fall back to connected edge-background removal using the actual corner color.
          src = generated.load()
          keyed = Image.new("RGBA", generated.size, (0, 0, 0, 0))
          dst = keyed.load()

          transparent_pixels = 0
          for y in range(generated.height):
              for x in range(generated.width):
                  r, g, b, a = src[x, y]
                  green_strength = g - max(r, b)
                  if g >= 90 and green_strength >= 18:
                      t = min(1.0, max(0.0, (green_strength - 18.0) / 82.0))
                      new_a = int(a * (1.0 - t))
                      if new_a <= 10:
                          new_a = 0
                          transparent_pixels += 1
                      if new_a:
                          g = min(int(g * (1.0 - t)), max(r, b) + 10)
                      dst[x, y] = (r, g, b, new_a)
                  else:
                      dst[x, y] = (r, g, b, a)

          total_generated = generated.width * generated.height
          if transparent_pixels < total_generated * 0.15:
              # Determine the real background color from four corner patches.
              patch = max(2, min(generated.width, generated.height) // 24)
              samples = []
              for yy in list(range(patch)) + list(range(generated.height - patch, generated.height)):
                  for xx in list(range(patch)) + list(range(generated.width - patch, generated.width)):
                      samples.append(src[xx, yy][:3])

              samples.sort(key=lambda p: (p[0] + p[1] + p[2], p[0], p[1], p[2]))
              mid = samples[len(samples) // 2]
              bg_r, bg_g, bg_b = mid

              def bg_distance(pixel):
                  r, g, b, _ = pixel
                  return math.sqrt((r-bg_r)**2 + (g-bg_g)**2 + (b-bg_b)**2)

              # Flood only from image edges, so similarly colored details inside the Hound
              # are preserved unless they are actually connected to the background.
              threshold = 78.0
              seen = bytearray(total_generated)
              q = deque()

              def enqueue(x, y):
                  idx = y * generated.width + x
                  if seen[idx]:
                      return
                  if bg_distance(src[x, y]) <= threshold:
                      seen[idx] = 1
                      q.append((x, y))

              for x in range(generated.width):
                  enqueue(x, 0)
                  enqueue(x, generated.height - 1)
              for y in range(generated.height):
                  enqueue(0, y)
                  enqueue(generated.width - 1, y)

              while q:
                  x, y = q.popleft()
                  for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if 0 <= nx < generated.width and 0 <= ny < generated.height:
                          enqueue(nx, ny)

              keyed = generated.copy()
              dst = keyed.load()
              transparent_pixels = 0
              for y in range(generated.height):
                  for x in range(generated.width):
                      idx = y * generated.width + x
                      if seen[idx]:
                          dst[x, y] = (0, 0, 0, 0)
                          transparent_pixels += 1
                      else:
                          r, g, b, a = dst[x, y]
                          # Suppress residual green spill on subject edges.
                          if g > max(r, b) + 25:
                              g = max(r, b) + 8
                          dst[x, y] = (r, g, b, a)

          if transparent_pixels < total_generated * 0.15:
              raise SystemExit(
                  "Could not isolate enough background safely; refusing to replace hound.png"
              )

          alpha = keyed.getchannel("A")
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit("Chroma removal produced an empty image")

          cropped = keyed.crop(bbox)

          # Preserve the exact old canvas size so existing overlay layout remains stable.
          margin_x = max(2, round(target_size[0] * 0.04))
          margin_top = max(2, round(target_size[1] * 0.03))
          margin_bottom = max(2, round(target_size[1] * 0.02))
          available_w = max(1, target_size[0] - 2 * margin_x)
          available_h = max(1, target_size[1] - margin_top - margin_bottom)

          scale = min(available_w / cropped.width, available_h / cropped.height)
          new_size = (
              max(1, round(cropped.width * scale)),
              max(1, round(cropped.height * scale))
          )
          resized = cropped.resize(new_size, Image.Resampling.LANCZOS)

          canvas = Image.new("RGBA", target_size, (0, 0, 0, 0))
          x = (target_size[0] - resized.width) // 2
          y = target_size[1] - margin_bottom - resized.height
          canvas.alpha_composite(resized, (x, y))

          final_alpha = canvas.getchannel("A")
          extrema = final_alpha.getextrema()
          if extrema[0] != 0 or extrema[1] != 255:
              # Some alpha is expected, but we also want at least some fully opaque
              # creature pixels for a clean overlay.
              if extrema[0] != 0:
                  raise SystemExit("Final PNG is not transparent")
          opaque_count = sum(1 for px in final_alpha.getdata() if px >= 245)
          transparent_count = sum(1 for px in final_alpha.getdata() if px == 0)
          total = target_size[0] * target_size[1]
          if opaque_count < total * 0.03:
              raise SystemExit("Final Hound subject is unexpectedly faint")
          if transparent_count < total * 0.15:
              raise SystemExit("Final Hound PNG lacks sufficient transparent background")

          canvas.save(target, "PNG", optimize=True)

          meta = {
              "model": model,
              "source": "android-apk/app/src/main/assets/entity/hound.png",
              "output": target.as_posix(),
              "canvas": {"width": target_size[0], "height": target_size[1]},
              "requirements": [
                  "Backrooms Hound full-body entity overlay",
                  "transparent background",
                  "soft ground contact shadow",
                  "same output path and canvas size"
              ]
          }
          pathlib.Path(".github/hound-overlay-generation.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Recreated Hound overlay at {target} using canvas {target_size[0]}x{target_size[1]}")
          print(f"Transparent pixels: {transparent_count}/{total}")
          print(f"Opaque subject pixels: {opaque_count}/{total}")
          PY

      - name: Verify replacement PNG
        shell: bash
        run: |
          set -euo pipefail
          test -s android-apk/app/src/main/assets/entity/hound.png
          python3 - <<'PY'
          from PIL import Image
          path = "android-apk/app/src/main/assets/entity/hound.png"
          image = Image.open(path)
          if image.format != "PNG":
              raise SystemExit("hound.png is not PNG")
          if image.mode not in ("RGBA", "LA", "P"):
              raise SystemExit(f"hound.png has no alpha-capable mode: {image.mode}")
          rgba = image.convert("RGBA")
          alpha = rgba.getchannel("A")
          lo, hi = alpha.getextrema()
          if lo != 0:
              raise SystemExit("hound.png has no fully transparent pixels")
          if hi < 245:
              raise SystemExit("hound.png has no solid subject pixels")
          print(f"Verified PNG {image.width}x{image.height}, alpha range {lo}..{hi}")
          PY
          sha256sum android-apk/app/src/main/assets/entity/hound.png

      - name: Commit replacement Hound overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/entity/hound.png .github/hound-overlay-generation.json
          if git diff --cached --quiet; then
            echo 'Hound overlay is unchanged.'
            exit 0
          fi
          git commit -m 'Regenerate Hound overlay'
          git push origin HEAD:${GITHUB_REF_NAME}
