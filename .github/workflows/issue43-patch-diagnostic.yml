name: Issue 43 Patch Diagnostic

on:
  push:
    branches:
      - refactor/issue-43-final-cleanup

permissions:
  contents: write

jobs:
  purge-retired-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-43-final-cleanup
          fetch-depth: 0
      - name: Purge retired feature references
        run: python3 .github/scripts/purge-retired-feature.py
      - name: Verify Python patch syntax
        run: python3 -m compileall -q android-apk .github/scripts/purge-retired-feature.py
      - name: Verify clean diff
        run: git diff --check
      - name: Commit purge
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No purge changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Purge retired feature references"
          git push origin HEAD:refactor/issue-43-final-cleanup
