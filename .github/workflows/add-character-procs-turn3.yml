name: Add Cao Minh and Lucia proc skills turn 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-character-procs-turn3.yml'

permissions:
  contents: write

jobs:
  update-procs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch authoritative proc definitions and regression count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java')
          s = engine.read_text()
          old = '''    characterProcs("cao_minh",
                  characterProc("Huyết Sát Kiếm Ấn", 50, 25, "Chảy máu", 2, 3),
                  characterProc("Phá Giáp Ma Kiếm", 48, 20, "Xuyên giáp", 2, 10),
                  characterProc("Ma Tâm Chấn", 45, 15, "Choáng", 1, 0),
                  characterProc("Huyết Độc Ma Khí", 47, 20, "Trúng độc", 2, 3));
              characterProcs("lucia",
                  characterProc("Toxic Burst", 52, 25, "Trúng độc", 2, 3),
                  characterProc("Armor-Piercing Burst", 55, 20, "Xuyên giáp", 2, 10),
                  characterProc("Concussive Burst", 46, 15, "Choáng", 1, 0),
                  characterProc("Rending Burst", 49, 20, "Chảy máu", 2, 3));'''
          new = '''    characterProcs("cao_minh",
                  characterProc("Huyết Sát Kiếm Ấn", 50, 25, "Chảy máu", 2, 3),
                  characterProc("Phá Giáp Ma Kiếm", 48, 20, "Xuyên giáp", 2, 10),
                  characterProc("Ma Tâm Chấn", 45, 15, "Choáng", 1, 0),
                  characterProc("Huyết Độc Ma Khí", 47, 20, "Trúng độc", 2, 3),
                  characterProc("Huyết Liệt Ma Ấn", 51, 20, "Chảy máu", 2, 4));
              characterProcs("lucia",
                  characterProc("Toxic Burst", 52, 25, "Trúng độc", 2, 3),
                  characterProc("Armor-Piercing Burst", 55, 20, "Xuyên giáp", 2, 10),
                  characterProc("Concussive Burst", 46, 15, "Choáng", 1, 0),
                  characterProc("Rending Burst", 49, 20, "Chảy máu", 2, 3),
                  characterProc("Corrosive Burst", 51, 20, "Trúng độc", 2, 4));'''
          if old not in s:
              raise SystemExit('Expected four-proc block not found; refusing unsafe patch')
          engine.write_text(s.replace(old, new, 1))

          test = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java')
          t = test.read_text()
          t = t.replace('caoMinhAndLuciaEachHaveFourCharacterProcsAndKaiHasNone',
                        'caoMinhAndLuciaEachHaveFiveCharacterProcsAndKaiHasNone', 1)
          t = t.replace('assertEquals(4, CombatChoiceEngine.characterProcCount("cao_minh"));',
                        'assertEquals(5, CombatChoiceEngine.characterProcCount("cao_minh"));', 1)
          t = t.replace('assertEquals(4, CombatChoiceEngine.characterProcCount("lucia"));',
                        'assertEquals(5, CombatChoiceEngine.characterProcCount("lucia"));', 1)
          t = t.replace('for (int i = 0; i < 4; i++) {\n        int chance = CombatChoiceEngine.characterProcPercent(id, i);',
                        'for (int i = 0; i < 5; i++) {\n        int chance = CombatChoiceEngine.characterProcPercent(id, i);', 1)
          test.write_text(t)
          PY
      - name: Run combat regression tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --tests com.rabpit.backroom.core.CombatChoiceEngineTest --no-daemon
      - name: Commit verified update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/add-character-procs-turn3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java .github/workflows/add-character-procs-turn3.yml
          git commit -m 'Add Cao Minh and Lucia proc skills'
          git push origin HEAD:main