name: Fix PR 42 swipe regression assertion

on:
  push:
    branches:
      - fix/device-regressions-1.1.77

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-regressions-1.1.77
          fetch-depth: 0
      - name: Narrow pointer-first negative assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-apk/test-android-ui-regressions.mjs')
          s = p.read_text(encoding='utf-8')
          old = 'assert.ok(!html.includes("if(\'PointerEvent\' in window)installPointerSwipe();else installTouchSwipe()"), "pointer-first Android gesture gate must not return");'
          new = 'assert.ok(!/\\n\\s*if\\(\'PointerEvent\' in window\\)installPointerSwipe\\(\\);else installTouchSwipe\\(\\);/.test(html), "standalone pointer-first Android gesture gate must not return");'
          if s.count(old) != 1:
              raise SystemExit(f'expected one pointer-first assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-pr42-swipe-test.yml
          git diff --check
      - name: Commit test correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix swipe regression assertion"
          git push origin HEAD:fix/device-regressions-1.1.77
