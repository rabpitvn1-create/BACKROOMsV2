name: Compile Story Decision Contracts

on:
  push:
    paths:
      - 'android-apk/app/src/main/assets/story/source/**'
      - '.github/scripts/compile-story.py'
      - '.github/workflows/compile-story.yml'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Optional storyId to rebuild; blank means all'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: story-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      HAIKU_API: ${{ secrets.HAIKU_API }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL || vars.HAIKU_BASE_URL }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || vars.HAIKU_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Story compile scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.story_id || '' }}" ]; then
            printf '%s\n' "--story-id" "${{ inputs.story_id }}" > /tmp/compiler.args
          else
            printf '%s\n' "--all" > /tmp/compiler.args
          fi

      - name: Compile Story assets atomically
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARGS < /tmp/compiler.args
          python .github/scripts/compile-story.py "${ARGS[@]}"
          python .github/scripts/compile-story.py "${ARGS[@]}" --validate-generated

      - name: Refuse stale artifact commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "${GITHUB_SHA}"

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add android-apk/app/src/main/assets/story/generated/
          if git diff --cached --quiet; then
            echo "Generated Story artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(story): compile authored artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
