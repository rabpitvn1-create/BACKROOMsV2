name: Regenerate Manila Room snapshots v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-manila-room-v3.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-manila-room-v3
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_DIR: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets and empty Manila targets
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_DIR" .snapshot-debug
          test ! -e "$OUT_DIR/snapshot_level_0_sublevel_manila-room_01.webp"
          test ! -e "$OUT_DIR/snapshot_level_0_sublevel_manila-room_02.webp"

      - name: Generate two visual-only Manila Room scenes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request

          api_key = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = (
              base if base.endswith("/images/generations")
              else base + "/images/generations" if base.endswith("/v1")
              else base + "/v1/images/generations"
          )

          out = pathlib.Path(os.environ["OUT_DIR"])
          prompts = [
              (
                  "manila_01",
                  out / "raw_01",
                  "Photorealistic environmental game background of the Manila Room in the Backrooms. "
                  "Show one small, quiet, enclosed rectangular room at human eye level. "
                  "Plain beige-manila wallpaper covers thick walls. The floor is dry aged wood. "
                  "The ceiling is low and simple with subdued old fluorescent lighting. "
                  "A plain worn table stands near the center with a few ordinary mismatched chairs. "
                  "Two simple doorways lead only to nearby small rooms. "
                  "Sparse furnishings, stable geometry, calm liminal sanctuary atmosphere, believable realistic materials. "
                  "Scene only. No people, no creatures, no signs, no labels, no posters, no documents, no screens, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
              (
                  "manila_02",
                  out / "raw_02",
                  "Photorealistic environmental game background of a quiet side extension connected to the same Manila Room. "
                  "Show a compact enclosed beige-manila wallpapered side room at human eye level, with thick walls, dry aged wooden flooring and subdued old fluorescent light. "
                  "A single ordinary chair and a small empty wooden shelf sit against one wall. "
                  "A short narrow passage opens back toward the central room, where only part of the plain central table and one chair can be seen. "
                  "Keep the space small, stable, dry, quiet and visually consistent with the central Manila Room. "
                  "Scene only. No people, no creatures, no signs, no labels, no posters, no papers, no documents, no screens, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
          ]

          for key, target, prompt in prompts:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "n": 1,
                  "response_format": "b64_json",
                  "aspect_ratio": "16:9",
                  "resolution": "2k",
              }
              if model.startswith("grok-imagine-image-2.0"):
                  payload["quality"] = "medium"

              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{key}: Image API HTTP {exc.code}: {detail[:2000]}")

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"{key}: Image API response has no data[0]")
              item = data[0]

              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
                  source = "b64_json"
              elif item.get("url"):
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          item["url"],
                          headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"},
                      ),
                      timeout=300,
                  ) as response:
                      raw = response.read()
                  source = "url"
              else:
                  raise SystemExit(f"{key}: response has neither b64_json nor url")

              if len(raw) < 50000:
                  raise SystemExit(f"{key}: generated payload suspiciously small: {len(raw)} bytes")

              target.write_bytes(raw)
              print(f"{key}: bytes={len(raw)} source={source} served_model={body.get('model') or 'unknown'}")
          PY

      - name: Install image verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp

      - name: Verify raw images are native 16:9 and not black text cards
        shell: bash
        run: |
          set -euo pipefail

          check_raw() {
            src="$1"
            label="$2"

            test -s "$src"
            w="$(identify -format '%w' "$src")"
            h="$(identify -format '%h' "$src")"
            mean="$(convert "$src" -auto-orient -colorspace Gray -format '%[fx:mean]' info:)"

            echo "$label raw: ${w}x${h}, mean_luminance=${mean}"

            python3 - <<PY
          w = $w
          h = $h
          mean = float("$mean")
          target = 16 / 9
          ratio = w / h
          if abs(ratio - target) / target > 0.03:
              raise SystemExit("$label: raw image is not native 16:9")
          if w < 1280 or h < 720:
              raise SystemExit("$label: raw image is below 1280x720")
          if mean < 0.16:
              raise SystemExit("$label: image is abnormally dark and may be a rendered text/card failure")
          PY
          }

          check_raw "$OUT_DIR/raw_01" "manila_01"
          check_raw "$OUT_DIR/raw_02" "manila_02"

      - name: Upload raw Manila evidence
        uses: actions/upload-artifact@v4
        with:
          name: manila-room-v3-raw
          path: |
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/raw_01
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room/raw_02
          retention-days: 7

      - name: Convert to Full HD WebP without cropping
        shell: bash
        run: |
          set -euo pipefail

          convert "$OUT_DIR/raw_01" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95             "$OUT_DIR/snapshot_level_0_sublevel_manila-room_01.webp"
          convert "$OUT_DIR/raw_02" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95             "$OUT_DIR/snapshot_level_0_sublevel_manila-room_02.webp"

          rm "$OUT_DIR/raw_01" "$OUT_DIR/raw_02"

      - name: Verify final Manila snapshots
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "$OUT_DIR/snapshot_level_0_sublevel_manila-room_01.webp"
            "$OUT_DIR/snapshot_level_0_sublevel_manila-room_02.webp"
          )

          declare -A seen
          for f in "${files[@]}"; do
            test -s "$f"
            dims="$(identify -format '%wx%h' "$f")"
            test "$dims" = "1920x1080" || { echo "::error::$f is $dims"; exit 1; }
            digest="$(sha256sum "$f" | awk '{print $1}')"
            test -z "${seen[$digest]:-}" || { echo "::error::Duplicate Manila image: $f"; exit 1; }
            seen[$digest]=1
            file "$f"
            echo "$digest  $f"
          done

      - name: Commit Manila replacements and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/regenerate-manila-room-v3.yml
          git add             "$OUT_DIR/snapshot_level_0_sublevel_manila-room_01.webp"             "$OUT_DIR/snapshot_level_0_sublevel_manila-room_02.webp"

          git commit -m 'Regenerate Manila Room snapshots'
          git push origin HEAD:main
