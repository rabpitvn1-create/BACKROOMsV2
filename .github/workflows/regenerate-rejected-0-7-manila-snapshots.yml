name: Regenerate rejected Level 0.7 and Manila Room snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-rejected-0-7-manila-snapshots.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-rejected-0-7-manila-snapshots
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_07: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_0-7
      OUT_MANILA: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_manila-room
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate target and secrets
        shell: bash
        run: |
          set -euo pipefail
          for n in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!n:-}" || { echo "::error::Missing GitHub Secret: $n"; exit 1; }
          done
          mkdir -p "$OUT_07" "$OUT_MANILA"
          test ! -e "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"
          test ! -e "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"
          test ! -e "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"
          test ! -e "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"

      - name: Generate four canon-locked backgrounds via configured IMG API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          api = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = base if base.endswith("/images/generations") else (
              base + "/images/generations" if base.endswith("/v1")
              else base + "/v1/images/generations"
          )

          out07 = pathlib.Path(os.environ["OUT_07"])
          outm = pathlib.Path(os.environ["OUT_MANILA"])

          prompts = [
              (
                  out07 / "raw_01",
                  """BACKROOMsV2 Level 0.7 — The Reminiscence District. Create a photorealistic 16:9 environmental game background at human eye level, architecture only. This place preserves historical manifestations of Level 0 in one continuous structure. Show a deep connected corridor whose materials transition gradually across rooms: very old rough masonry and plaster with candle niches, then early industrial brick/cast-iron details and primitive electric fixtures, then a late-20th-century Level 0 remnant with yellow-beige patterned wallpaper, old acoustic ceiling tiles, aging fluorescent tubes and worn carpet. The transitions must feel architectural and physical, not like a museum exhibit and not like time travel. Empty, abandoned, dusty, coherent liminal space. No people, no characters, no entities, no museum displays, no dates, no readable text, no signs, no portal, no sci-fi machinery, no UI, no watermark."""
              ),
              (
                  out07 / "raw_02",
                  """BACKROOMsV2 Level 0.7 — The Reminiscence District. Create a clearly different photorealistic 16:9 environmental game background at human eye level. Depict a recovered-outpost trace inside a late-20th-century remnant of Level 0: faded yellow-beige walls, old fluorescent lighting, worn carpet, abandoned metal filing cabinets, a stripped desk, loose dead cables and dismantled utility hardware. At one side, the architecture naturally degrades into an older pre-industrial rough-plaster passage lit by candle-like warm light. Include one blocked doorway covered by opaque television-static/no-signal visual distortion, clearly a solid inaccessible obstruction, NOT a gateway. Empty and abandoned. No people, no characters, no entities, no readable documents, no readable signs, no portal, no futuristic tech, no UI, no watermark."""
              ),
              (
                  outm / "raw_01",
                  """BACKROOMsV2 Manila Room. Create a photorealistic 16:9 environmental game background showing the CENTRAL ROOM exactly as a small, stable, enclosed sanctuary-like Level 0 sub-level. Thick walls covered in plain beige/manila wallpaper, dry wooden floor, simple low ceiling with subdued old fluorescent lighting, a worn plain rectangular table at the center and three mismatched ordinary chairs. Only a few plain door openings, roughly one to four, leading to small nearby rooms. Sparse, quiet, dry, modest scale, visibly more stable than Level 0. It must look like one small room, NOT a hotel, office complex, warehouse, giant hall or endless corridor. No people, no characters, no entities, no clutter piles, no readable text, no signs, no UI, no watermark."""
              ),
              (
                  outm / "raw_02",
                  """BACKROOMsV2 Manila Room. Create a second, clearly different photorealistic 16:9 environmental game background of the SAME place from a small quiet annex looking through a short narrow passage back toward the Central Room. Keep the exact visual identity: plain beige/manila wallpaper, thick walls, dry wooden floor, subdued old fluorescent light, compact enclosed proportions. In the annex place one simple mismatched chair and a small bulletin board with aged blank or illegible papers; through the short passage the edge of the central plain table and another chair can be visible. Stable and quiet, not threateningly huge, not labyrinthine. No people, no characters, no entities, no readable writing, no hotel corridor, no office cubicles, no grand architecture, no UI, no watermark."""
              ),
          ]

          for target, prompt in prompts:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "n": 1,
                  "response_format": "b64_json",
              }
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {api}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"Image API HTTP {exc.code}: "
                      + exc.read().decode(errors="replace")[:2000]
                  )

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit("Image API response has no data[0]")
              item = data[0]
              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
              elif item.get("url"):
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          item["url"],
                          headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"},
                      ),
                      timeout=300,
                  ) as response:
                      raw = response.read()
              else:
                  raise SystemExit("Image API response has neither b64_json nor url")

              if len(raw) < 10000:
                  raise SystemExit(f"Generated image payload too small: {len(raw)} bytes")
              target.write_bytes(raw)
          PY

      - name: Convert to Full HD WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp

          convert_one() {
            src="$1"
            dst="$2"
            convert "$src" -auto-orient -filter Lanczos -resize '1920x1080^' -gravity center -extent 1920x1080 -quality 95 "$dst"
            rm "$src"
          }

          convert_one "$OUT_07/raw_01" "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"
          convert_one "$OUT_07/raw_02" "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"
          convert_one "$OUT_MANILA/raw_01" "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"
          convert_one "$OUT_MANILA/raw_02" "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"

      - name: Verify dimensions, uniqueness and replacement
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"
            "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"
            "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"
            "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"
          )

          old_blob_shas=(
            "1007fbb423419f40df4be907b2fede000444e655"
            "cff7bbb6fa2a06677d4f3ede8688c58f8287f29c"
            "0042f98052ee55782e27a34e337e80e2bb376ae7"
            "2f87d0b3df20860d8f81d083935b13ff770dba88"
          )

          declare -A seen
          for idx in 0 1 2 3; do
            f="${files[$idx]}"
            test -s "$f"
            dims="$(identify -format '%wx%h' "$f")"
            test "$dims" = "1920x1080" || { echo "::error::$f is $dims"; exit 1; }

            blob="$(git hash-object "$f")"
            test "$blob" != "${old_blob_shas[$idx]}" || {
              echo "::error::$f is byte-identical to the rejected image"
              exit 1
            }

            digest="$(sha256sum "$f" | awk '{print $1}')"
            test -z "${seen[$digest]:-}" || {
              echo "::error::Duplicate generated image content: $f"
              exit 1
            }
            seen[$digest]=1

            file "$f"
            echo "$dims  $digest  $f"
          done

      - name: Commit four replacement assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/regenerate-rejected-0-7-manila-snapshots.yml
          git add             "$OUT_07/snapshot_level_0_sublevel_0-7_01.webp"             "$OUT_07/snapshot_level_0_sublevel_0-7_02.webp"             "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_01.webp"             "$OUT_MANILA/snapshot_level_0_sublevel_manila-room_02.webp"

          git commit -m 'Regenerate Level 0.7 and Manila Room snapshots'
          git push origin HEAD:main
