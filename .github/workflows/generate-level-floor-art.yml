name: Generate Level Floor Art

on:
  push:
    branches:
      - ui/redmi-viewport-foundation
    paths:
      - '.github/workflows/generate-level-floor-art.yml'

permissions:
  contents: write

concurrency:
  group: generate-level-floor-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_DIR: android-apk/app/src/main/assets/floors

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate IMG API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_DIR"

      - name: Generate main Level and sublevel floor plates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request

          api = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = base if base.endswith("/images/generations") else (
              base + "/images/generations" if base.endswith("/v1") else base + "/v1/images/generations"
          )
          out_dir = pathlib.Path(os.environ["OUT_DIR"])
          out_dir.mkdir(parents=True, exist_ok=True)

          common = (
              "Create a pure environmental FLOOR MATERIAL PLATE for a mobile Backrooms game. "
              "Camera is pointed downward at the walkable surface only, with a shallow perspective suitable for character feet and shadows. "
              "The entire frame must contain ONLY floor material and tiny floor debris. "
              "Absolutely no walls, ceiling, horizon, room interior, furniture, signs, interface, captions, typography, readable symbols, people, creatures, shoes, legs, feet, hands, silhouettes, or body parts. "
              "Do not write or render any words from this prompt. "
              "Surface must look used and neglected, never freshly cleaned. Include only 1 to 3 SMALL believable pieces of litter/debris plus restrained stains, dust, wear or scuffs. "
              "Trash must stay sparse and physically small relative to the full floor plate, never a pile and never a focal object. "
              "Realistic game texture, natural material detail, restrained lighting, no bloom, no neon, no dramatic spotlight."
          )

          assets = [
              ("0", "level_0.webp",
               common + " Level 0: damp dirty mustard-beige Berber-like office carpet, flattened fibers, darker wet patches, faint mold grime, nicotine-yellow cast; add a tiny torn paper corner and a small dark lint clump."),
              ("1", "level_1.webp",
               common + " Level 1 Parking Zone: worn gray parking-garage concrete, hairline cracks, tire scuffs, dusty aggregate and a faint old oil smear; add one tiny paper scrap and a very small metal washer."),
              ("2", "level_2.webp",
               common + " Level 2 Pipe Dreams: grimy utility-tunnel concrete, chalky dust, rust flakes and condensation marks; add one tiny clipped wire piece and a small paper fiber."),
              ("3", "level_3.webp",
               common + " Level 3 Electrical Station: dark dusty industrial concrete, subtle electrical soot and old oil grime; add a tiny copper-wire clipping and one small torn insulation fragment."),
              ("4", "level_4.webp",
               common + " Level 4 Abandoned Office: old charcoal-gray office carpet tiles with worn seams, embedded dust and a faint coffee stain; add one tiny paper corner and one very small plastic chip."),
              ("5", "level_5.webp",
               common + " Level 5 Terror Hotel: aged dark mahogany parquet with a narrow burgundy carpet edge, elegant but not pristine, fine scuffs and dust; add one tiny faded paper scrap and a couple of dark crumbs."),
              ("6", "level_6.webp",
               common + " Level 6 Lights Out: almost-black cold smooth concrete with barely visible roughness and a damp smear; add tiny grit and one very small pale paper fleck visible only by minimal ambient light. Keep texture readable despite deep darkness."),

              ("0.1", "sublevel_0_1.webp",
               common + " Level 0.1 Zenith Station: worn brushed-metal deck panels with fine seams, anti-slip texture, cold gray alloy, scratches, oxidation and dried maintenance grime; add a tiny clipped cable tie and two small glass-like flakes."),
              ("0.2", "sublevel_0_2.webp",
               common + " Level 0.2 Remodeled Mess: dry deep-red commercial carpet partly dusted by pale plaster powder and construction grit, a subtle cracked seam suggesting nearby collapse; add two tiny plaster chips and a small torn paper scrap."),
              ("0.5", "sublevel_0_5.webp",
               common + " Level 0.5 Aquaclaustrophobic Infirmary: filthy off-white hospital vinyl/tile floor under a very shallow dirty-water sheen, gray-brown grime and oily residue; add one tiny soaked paper fragment and a small rust flake."),
              ("0.7", "sublevel_0_7.webp",
               common + " Level 0.7 Reminiscence District: worn historical patchwork flooring with a restrained transition from old dark wood planks into faded twentieth-century linoleum, dusty and age-scuffed; add one tiny yellowed paper scrap and a small chipped fragment."),
              ("manila_room", "sublevel_manila_room.webp",
               common + " Manila Room: dry aged honey-brown wooden plank floor, matte worn finish, subtle dust in seams and quiet beige cast; add one tiny pencil shaving and one small yellowed paper corner."),
              ("the_torment", "sublevel_the_torment.webp",
               common + " The Torment: monochrome gray cracked stone and packed earth with a thin scatter of dead leaf fragments, cold moonlit grayscale, damp dirt in crevices; add one tiny pale weathered scrap and a small broken twig, all desaturated."),
              ("red_rooms", "sublevel_red_rooms.webp",
               common + " Red Rooms: dark crimson rough carpet, slightly sticky matted fibers, black mold specks and deep red grime, low darkroom-like lighting; add one tiny torn paper fragment and one small dull plastic fleck.")
          ]

          metadata = {
              "model": model,
              "format": "webp",
              "displayPurpose": "snapshot-ground-plane",
              "targetDimensions": {"width": 768, "height": 144},
              "assets": []
          }

          for level_key, filename, prompt in assets:
              payload = {"model": model, "prompt": prompt, "n": 1, "response_format": "b64_json"}
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"IMG API HTTP {exc.code} for {level_key}: {detail[:2000]}")

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"IMG API response has no data[0] for {level_key}")
              item = data[0]
              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
              elif item.get("url"):
                  dl = urllib.request.Request(item["url"], headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"})
                  with urllib.request.urlopen(dl, timeout=300) as response:
                      raw = response.read()
              else:
                  raise SystemExit(f"IMG API response has neither b64_json nor url for {level_key}")

              if raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  ext = "png"
              elif raw.startswith(b"\xff\xd8\xff"):
                  ext = "jpg"
              elif raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
                  ext = "webp"
              elif raw.startswith((b"GIF87a", b"GIF89a")):
                  ext = "gif"
              elif len(raw) >= 12 and raw[4:8] == b"ftyp":
                  ext = "avif"
              else:
                  raise SystemExit(f"Unsupported IMG API format for {level_key}; magic={raw[:16].hex()}")

              stem = filename[:-5]
              source = out_dir / f"{stem}.source.{ext}"
              source.write_bytes(raw)
              metadata["assets"].append({
                  "levelKey": level_key,
                  "file": filename,
                  "prompt": prompt
              })

          (out_dir / "level_floors.generated.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp

          mapfile -t stems < <(python3 - <<'PY'
          import json, os, pathlib
          data=json.loads((pathlib.Path(os.environ["OUT_DIR"])/"level_floors.generated.json").read_text())
          for item in data["assets"]:
              print(item["file"][:-5])
          PY
          )

          for stem in "${stems[@]}"; do
            src="$(find "$OUT_DIR" -maxdepth 1 -type f -name "${stem}.source.*" -print -quit)"
            test -n "$src"
            tmp="/tmp/${stem}.png"

            convert "$src" -auto-orient \
              -resize '768x144^' -gravity south -extent 768x144 \
              -alpha set -channel A -fx 'j<28?j/28:1' +channel \
              "$tmp"

            out="$OUT_DIR/${stem}.webp"
            cwebp -quiet -q 76 -m 6 -alpha_q 88 -metadata none "$tmp" -o "$out"

            bytes="$(stat -c%s "$out")"
            if [ "$bytes" -gt 80000 ]; then
              cwebp -quiet -q 70 -m 6 -alpha_q 84 -metadata none "$tmp" -o "$out"
              bytes="$(stat -c%s "$out")"
            fi
            if [ "$bytes" -gt 80000 ]; then
              cwebp -quiet -q 66 -m 6 -alpha_q 82 -metadata none "$tmp" -o "$out"
              bytes="$(stat -c%s "$out")"
            fi

            rm -f "$src" "$tmp"
            test "$(identify -format '%wx%h' "$out")" = "768x144"
            test "$bytes" -le 80000 || { echo "::error::$stem floor is too large: $bytes bytes"; exit 1; }
            echo "$stem floor: $bytes bytes"
          done

          total="$(du -cb "$OUT_DIR"/*.webp | tail -1 | awk '{print $1}')"
          test "$total" -le 900000 || { echo "::error::Floor asset batch too large: $total bytes"; exit 1; }
          identify "$OUT_DIR"/*.webp

      - name: Commit generated floor artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR"/*.webp "$OUT_DIR/level_floors.generated.json"
          git diff --cached --quiet && { echo 'Floor artwork unchanged.'; exit 0; }
          git commit -m 'Generate Level and sublevel floor artwork with IMG API'
          git push origin HEAD:ui/redmi-viewport-foundation
