name: Patch Chain Check

on:
  push:
    branches:
      - refactor/issue-43-final-cleanup
    paths:
      - android-apk/**
      - .github/workflows/patch-chain-check.yml

permissions:
  contents: read

jobs:
  patch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-43-final-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install patch dependencies
        run: python -m pip install pillow
      - name: Sync runtime assets
        run: python android-apk/sync-kai-sru-assets.py
      - name: patch-provider-status.py
        run: python3 android-apk/patch-provider-status.py
      - name: patch-gemini-five-keys.py
        run: python3 android-apk/patch-gemini-five-keys.py
      - name: patch-level-snapshot-backgrounds.py
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: patch-snapshot-fallback.py
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: patch-kai-hd-continuous.py
        run: python3 android-apk/patch-kai-hd-continuous.py
      - name: patch-kai-png-preferred.py
        run: python3 android-apk/patch-kai-png-preferred.py
      - name: patch-kai-codex.py
        run: python3 android-apk/patch-kai-codex.py
      - name: patch-r06-source-marker.py
        run: python3 android-apk/patch-r06-source-marker.py
      - name: patch-drive-canon-gameplay.py
        run: python3 android-apk/patch-drive-canon-gameplay.py
      - name: patch-inventory-persistence.py
        run: python3 android-apk/patch-inventory-persistence.py
      - name: patch-ai-orchestrator.py
        run: python3 android-apk/patch-ai-orchestrator.py
      - name: patch-state-op-hardening.py
        run: python3 android-apk/patch-state-op-hardening.py
      - name: patch-gemini-health-pool.py
        run: python3 android-apk/patch-gemini-health-pool.py
      - name: patch-conditional-audit.py
        run: python3 android-apk/patch-conditional-audit.py
      - name: patch-audit-validated-risk.py
        run: python3 android-apk/patch-audit-validated-risk.py
      - name: patch-gameplay-parity-final.py
        run: python3 android-apk/patch-gameplay-parity-final.py
      - name: patch-final-authority-hardening.py
        run: python3 android-apk/patch-final-authority-hardening.py
      - name: patch-rejected-op-repair-final.py
        run: python3 android-apk/patch-rejected-op-repair-final.py
      - name: patch-kai-resource-policy-final.py
        run: python3 android-apk/patch-kai-resource-policy-final.py
      - name: patch-gemini-provider-label.py
