name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Import Wikidot Level 0-6 snapshot pool
        if: startsWith(github.ref, 'refs/heads/release/level-0-6-wiki-snapshots')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

          ROOT='android-apk/app/src/main/assets/level_snapshots/wiki'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          download() {
            local level="$1" index="$2" page="$3" url="$4"
            local dir="$ROOT/level_${level}"
            local out="$dir/$(printf '%02d' "$index").webp"
            local tmp
            mkdir -p "$dir"
            tmp="$(mktemp)"
            echo "Downloading Level $level #$index: $url"
            curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              --user-agent 'Mozilla/5.0 (GitHub Actions; BACKROOMsV2 snapshot importer)' \
              --referer "$page" \
              "$url" --output "$tmp"
            local mime
            mime="$(file --brief --mime-type "$tmp")"
            case "$mime" in
              image/jpeg|image/png|image/webp) ;;
              *) echo "Unexpected MIME type $mime for $url" >&2; exit 1 ;;
            esac
            local width height
            read -r width height < <(identify -format '%w %h' "$tmp")
            if (( width < 480 || height < 270 )); then
              echo "Image is too small (${width}x${height}): $url" >&2
              exit 1
            fi
            convert "$tmp" -auto-orient -strip -resize '1600x1600>' -quality 84 "$out"
            test -s "$out"
            rm -f "$tmp"
          }

          P0='https://backrooms-wiki.wikidot.com/level-0'
          download 0 1 "$P0" 'https://backrooms-wiki.wikidot.com/local--files/level-0/OGLevel0.jpg'
          download 0 2 "$P0" 'https://backrooms-wiki.wdfiles.com/local--files/level-0/2'
          download 0 3 "$P0" 'https://backrooms-wiki.wikidot.com/local--files/level-0/3'
          download 0 4 "$P0" 'https://backrooms-wiki.wikidot.com/local--files/level-0/4'
          download 0 5 "$P0" 'https://backrooms-wiki.wikidot.com/local--files/level-0/5'
          download 0 6 "$P0" 'https://backrooms-wiki.wdfiles.com/local--files/level-0/6'

          P1='https://backrooms-wiki.wikidot.com/level-1'
          download 1 1 "$P1" 'https://backrooms-wiki.wdfiles.com/local--files/level-1/artistdiesinme.jpg'
          download 1 2 "$P1" 'https://backrooms-sandbox-2.wdfiles.com/local--files/collab%3Alevel-1/int%C3%A9rieur'
          download 1 3 "$P1" 'https://praetor.wdfiles.com/local--files/level-1/flickering'
          download 1 4 "$P1" 'https://backrooms-sandbox-2.wdfiles.com/local--files/collab%3Alevel-1/caisse'

          P2='https://backrooms-wiki.wikidot.com/level-2'
          download 2 1 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2first.jpg'
          download 2 2 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2piping.jpg'
          download 2 3 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2fluorescent.jpg'
          download 2 4 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2fluorescent2.jpg'
          download 2 5 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2door.jpg'
          download 2 6 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2macchinahome.jpg'
          download 2 7 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2stragglersbase.jpg'
          download 2 8 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2trainprogress.jpg'
          download 2 9 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2track.jpg'
          download 2 10 "$P2" 'https://backrooms-wiki.wdfiles.com/local--files/level-2/2dark.jpg'

          P3='https://backrooms-wiki.wikidot.com/level-3'
          download 3 1 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3FirstPhoto'
          download 3 2 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3Thin'
          download 3 3 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3SecondPhoto'
          download 3 4 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3Dark'
          download 3 5 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/DarkLevel3'
          download 3 6 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-5/Level3ElectricalRoom2'
          download 3 7 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3AssemblyLine'
          download 3 8 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-5/Level3AssemblyLine2'
          download 3 9 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3BoilerRoom'
          download 3 10 "$P3" 'https://natedagreat563.wdfiles.com/local--files/storage-unit-4/Level3Sanctum'

          P4='https://backrooms-wiki.wikidot.com/level-4'
          download 4 1 "$P4" 'https://backrooms-wiki.wdfiles.com/local--files/level-4/Level-4-new'

          P5='https://backrooms-wiki.wikidot.com/level-5'
          download 5 1 "$P5" 'https://backrooms-wiki.wdfiles.com/local--files/level-5/Level-5-1-cc.png'
          download 5 2 "$P5" 'https://backrooms-wiki.wdfiles.com/local--files/level-5/Level-5-2-cc.jpg'
          download 5 3 "$P5" 'https://backrooms-wiki.wdfiles.com/local--files/level-5/Level-5-3-cc.jpg'

          P6='https://backrooms-wiki.wikidot.com/level-6'
          download 6 1 "$P6" 'https://backrooms-wiki.wdfiles.com/local--files/level-6/level6map.jpg'

          for level in 0 1 2 3 4 5 6; do
            count="$(find "$ROOT/level_${level}" -maxdepth 1 -type f -name '*.webp' | wc -l)"
            if (( count < 1 || count > 10 )); then
              echo "Invalid Level $level pool size: $count" >&2
              exit 1
            fi
            echo "Level $level: $count image(s)"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          if ! git diff --cached --quiet; then
            git commit -m 'Import Wikidot level snapshot pool'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify Java-only baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 68' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.66'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.66.txt
          test -z "$(find android-apk/app/src -type f -name '*.kt' -print -quit)"
          test -z "$(find android-apk -type f -name '*.py' -print -quit)"
          test ! -d android-apk/ml
          test ! -e android-apk/app/src/main/assets/models/backroom_intent_labels.txt
          ! grep -R -n -E 'org\.jetbrains\.kotlin|LiteRTIntentInterpreter|com\.google\.ai\.edge\.litert' android-apk --include='*.gradle' --include='*.java'

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Java tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.66.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.66.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.66.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.66.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='68' versionName='1.1.66'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.66.apk
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/kai_snapshot_overlay.png'
          unzip -l Backroom-1.1.66.apk | grep -q 'assets/kai_entity_overlay.png'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.66-debug-apk
          path: Backroom-1.1.66.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.66
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.66'
          TITLE='Backroom 1.1.66 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.66.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.66.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.66.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.66 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.66.apk' --output Backroom-1.1.66-verified.apk
          test -s Backroom-1.1.66-verified.apk
          cmp Backroom-1.1.66.apk Backroom-1.1.66-verified.apk
          sha256sum Backroom-1.1.66-verified.apk
