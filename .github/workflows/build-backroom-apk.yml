name: Build Backroom APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Apply Entity Core runtime
        run: |
          set -euo pipefail
          if grep -Fq 'new EntityCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java; then
            echo 'Entity Core runtime already connected.'
          else
            python3 .github/scripts/apply-entity-core-runtime.py
          fi

      - name: Commit Entity Core runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Entity Core runtime already connected.'
          else
            git commit -m 'Connect Entity Core to gameplay runtime'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify Java-only baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 72' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.70'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.70.txt
          test -z "$(find android-apk/app/src -type f -name '*.kt' -print -quit)"
          test -z "$(find android-apk -type f -name '*.py' -print -quit)"
          test ! -d android-apk/ml
          test ! -e android-apk/app/src/main/assets/models/backroom_intent_labels.txt
          ! grep -R -n -E 'org\.jetbrains\.kotlin|LiteRTIntentInterpreter|com\.google\.ai\.edge\.litert' android-apk --include='*.gradle' --include='*.java'
          grep -Fq 'function activeEntityKey()' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'function shouldShowKaiOverlay()' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'file:///android_asset/kai_snapshot_overlay.png' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq "img.dataset.groundOffsetPx='5'" android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'file:///android_asset/entity/' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'generatedFlags = generated.optJSONObject("flags")' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'CombatChoiceEngine.resolve' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'backroomCombatTurn' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '__loot:open_chest' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'Android.itemAction' android-apk/app/src/main/assets/inventory-ui.js
          grep -Fq 'CHEST_SPAWN_RATE_PERCENT = 3' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'ENTITY_DROP_MIN_PERCENT = 10' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'ENTITY_DROP_MAX_PERCENT = 20' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'itemCore.prepareExplorationLoot' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'itemCore.validateAndApply' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'gameCore.processItemAction' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'ITEM.GAMEPLAY_LOOT_LOCK' android-apk/app/src/main/assets/knowledge/knowledge_db.json
          grep -Fq "@font-face{font-family:'Play'" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-character{color:#67d5ff}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-entity{color:#ff6b6b}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-item{color:#f6c85f}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-skill{color:#c792ea}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq ".semantic{font-family:'Play',system-ui,sans-serif;font-weight:700;text-decoration:none}" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq ".inventory-item-name{font-family:'Play',system-ui,sans-serif;font-weight:700;color:#f6c85f;text-decoration:none}" android-apk/app/src/main/assets/inventory-ui.js
          ! grep -Fq 'text-decoration:underline' android-apk/app/src/main/assets/gm-choice-ui.js
          ! grep -Fq 'text-decoration:underline' android-apk/app/src/main/assets/inventory-ui.js
          grep -Fq 'type chỉ được là character, entity, item, skill, effect, location hoặc stat' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          test -s android-apk/app/src/main/assets/fonts/OFL-Play.txt
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterEncounterCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailCore.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterDetailCoreTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/EntityCoreTest.java
          grep -Fq 'characterDetailCore.projectState(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          test -s android-apk/app/src/main/assets/knowledge/knowledge_db.json
          test -s android-apk/app/src/main/assets/knowledge/entity_encounters.json
          test -s android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          test -s android-apk/SNAPSHOT_SHA256SUMS.txt
          grep -Fq '"version": 3' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          grep -Fq '"root": "level_snapshots/drive"' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          sha256sum -c android-apk/SNAPSHOT_SHA256SUMS.txt
          test "$(find android-apk/app/src/main/assets/level_snapshots/drive -type f -name '*.webp' | wc -l)" -eq 21
          test -z "$(find android-apk/app/src/main/assets/level_snapshots -type f -name '*.webp' ! -path '*/drive/*' -print -quit)"
          test ! -e android-apk/app/src/main/assets/level_snapshots/wiki
          grep -Fq 'new LevelCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'new EntityCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'new CharacterEncounterCore()' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'characterPromptContext' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'safeApplyImmersiveFullscreen("onCreate")' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'catch (Throwable error)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'applyLegacyFullscreenFlags()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'Build.VERSION.SDK_INT < Build.VERSION_CODES.VANILLA_ICE_CREAM' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -Fq '<item name="android:windowFullscreen">true</item>' android-apk/app/src/main/res/values/styles.xml
          grep -Fq 'CharacterEncounterCore.isJoinedMember' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'testImplementation '\''org.json:json:20240303'\''' android-apk/app/build.gradle
          grep -Fq 'levelCore.validateAndApplyTransition' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'entityCore.validateAndApply' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'entityCore.prepareEncounter' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'levelPromptContext' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'entityPromptContext' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'levelSnapshotDescriptor' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'currentLevel' android-apk/app/src/main/assets/index.html
          grep -Fq 'function partyDisplayItems()' android-apk/app/src/main/assets/index.html
          grep -Fq 'function levelTitle()' android-apk/app/src/main/assets/index.html
          grep -Fq 'Level "+level+" : ' android-apk/app/src/main/assets/index.html
          grep -Fq '.snapshot{height:250px' android-apk/app/src/main/assets/index.html
          grep -Fq '.log{height:clamp(360px,55vh,620px)' android-apk/app/src/main/assets/index.html
          grep -Fq 'id="playerActionOpen"' android-apk/app/src/main/assets/index.html
          grep -Fq 'id="playerActionModal"' android-apk/app/src/main/assets/index.html
          grep -Fq 'PLAYER ACTION' android-apk/app/src/main/assets/index.html
          grep -Fq 'player-action-ui.js' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq ".message.gm .role,.gm-choice{font-family:system-ui" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq ".semantic{font-family:'Play'" android-apk/app/src/main/assets/gm-choice-ui.js
          ! grep -Fq ".message.gm .role,.gm-choice,.combat-turn-label{font-family:'Play'" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'VIRTUAL_GROUND_RATIO=0.92' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'function visibleAlphaBounds' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'function alignOverlayToGround' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'snapshot-grounded' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'file:///android_asset/kai_entity_overlay.png' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'COMBAT_PHASE_MS = 1000' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'function playCombatPhase' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'combat-float' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'combat-hit-flash' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'snapshot-character-placeholder' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'backroomSetCombatVisualActor' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'MAX_COMBAT_PARTICIPANTS = 4' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'output.length() < MAX_COMBAT_PARTICIPANTS' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'feedbackEvents' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          jq -e '.rollMode == "independent_per_entity" and .rules.sharedPool == false and .rules.roamingAllLevels == true and .rules.canonLevelRestrictionsApplied == false and (.entities | length == 16) and ([.entities[].ratePercent | select(. < 1 or . > 1.5)] | length == 0)' android-apk/app/src/main/assets/knowledge/entity_encounters.json >/dev/null
          grep -Fq 'static boolean roamingAllowedOn(int level)' android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          grep -Fq 'ROAMING POLICY: this registered Entity is valid on every Backrooms Level.' android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          ! grep -Fq 'entity.allowedOn(level)' android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          grep -Fq 'width:38%;height:72%;' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq "alignOverlayToGround(img,'right',0.84,0.46)" android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq "alignOverlayToGround(img,'left',0.84,0.46)" android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'shared roaming Entity pool' ENTITY_ASSETS.md
          ! grep -Fq 'independent 3%' ENTITY_ASSETS.md
          node --check android-apk/app/src/main/assets/snapshot-ui.js
          node --check android-apk/app/src/main/assets/gm-choice-ui.js
          node --check android-apk/app/src/main/assets/inventory-ui.js
          node --check android-apk/app/src/main/assets/party-ui.js
          node --check android-apk/app/src/main/assets/player-action-ui.js
          grep -Fq 'CHỈ SỐ SINH TỒN' android-apk/app/src/main/assets/party-ui.js
          grep -Fq 'state.partyDetails' android-apk/app/src/main/assets/party-ui.js
          grep -Fq 'foodPercent' android-apk/app/src/main/assets/party-ui.js
          grep -Fq 'waterPercent' android-apk/app/src/main/assets/party-ui.js
          grep -Fq 'restPercent' android-apk/app/src/main/assets/party-ui.js
          grep -Fq "kai:'file:///android_asset/avatars/kai_avatar.jpg'" android-apk/app/src/main/assets/party-ui.js
          grep -Fq "lucia:'file:///android_asset/avatars/lucia_avatar.jpg'" android-apk/app/src/main/assets/party-ui.js
          grep -Fq "lucia:'file:///android_asset/lucia_entity_overlay.png'" android-apk/app/src/main/assets/snapshot-ui.js
          test "$(sha256sum android-apk/app/src/main/assets/avatars/kai_avatar.jpg | awk '{print $1}')" = '18d07e33799f10bf727d2d80aa8be0b0d47d76b40323c1257fcea61e37706a03'
          test "$(sha256sum android-apk/app/src/main/assets/avatars/lucia_avatar.jpg | awk '{print $1}')" = 'c6145cde037c6128f50f0e8c8820ee2febcc66cb840e260c6f1801c9725b403e'
          test "$(sha256sum android-apk/app/src/main/assets/lucia_entity_overlay.png | awk '{print $1}')" = 'c1077f762254555b92232a18a50d930dfe8d572bfc1327da3ddeb8859d63029d'

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Java tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.70.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.70.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.70.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.70.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='72' versionName='1.1.70'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.70.apk
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/snapshot-ui.js'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/gm-choice-ui.js'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/inventory-ui.js'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/party-ui.js'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/player-action-ui.js'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/avatars/kai_avatar.jpg'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/avatars/lucia_avatar.jpg'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/lucia_entity_overlay.png'
          test "$(unzip -p Backroom-1.1.70.apk assets/avatars/kai_avatar.jpg | sha256sum | awk '{print $1}')" = '18d07e33799f10bf727d2d80aa8be0b0d47d76b40323c1257fcea61e37706a03'
          test "$(unzip -p Backroom-1.1.70.apk assets/avatars/lucia_avatar.jpg | sha256sum | awk '{print $1}')" = 'c6145cde037c6128f50f0e8c8820ee2febcc66cb840e260c6f1801c9725b403e'
          test "$(unzip -p Backroom-1.1.70.apk assets/lucia_entity_overlay.png | sha256sum | awk '{print $1}')" = 'c1077f762254555b92232a18a50d930dfe8d572bfc1327da3ddeb8859d63029d'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/chest_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/fonts/Play-Bold.ttf'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/fonts/OFL-Play.txt'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/kai_snapshot_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/kai_entity_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/knowledge/knowledge_db.json'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/knowledge/entity_encounters.json'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/level_snapshots/drive/manifest.json'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/level_snapshots/drive/level_0/01.webp'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/level_snapshots/drive/level_6/03.webp'
          test "$(unzip -l Backroom-1.1.70.apk | grep -c 'assets/level_snapshots/drive/level_')" -eq 21
          ! unzip -l Backroom-1.1.70.apk | grep -q 'assets/level_snapshots/wiki/'
          ! unzip -l Backroom-1.1.70.apk | grep -E -q 'assets/level_snapshots/level_[0-6]\.webp'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.70-debug-apk
          path: Backroom-1.1.70.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.70
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.70'
          TITLE='Backroom 1.1.70 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.70.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.70.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.70.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.70 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.70.apk' --output Backroom-1.1.70-verified.apk
          test -s Backroom-1.1.70-verified.apk
          cmp Backroom-1.1.70.apk Backroom-1.1.70-verified.apk
          sha256sum Backroom-1.1.70-verified.apk
