name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and provider baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 67' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.65'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.65.txt
          test -s android-apk/sync-kai-sru-assets.py
          test -s android-apk/patch-kai-sru-visuals.py
          test -s android-apk/patch-mobile-swipe-ui.py
          test -s android-apk/patch-mobile-swipe-ui-final.py
          test ! -e android-apk/patch-luna-text.py
          test ! -e android-apk/patch-luna-model-failover-final.py
          test ! -e android-apk/patch-provider-deadline-final.py
          ! grep -q 'LUNA_' android-apk/app/build.gradle

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Sync verified Kai SRU visuals
        run: |
          set -euo pipefail
          python android-apk/sync-kai-sru-assets.py
          test -s android-apk/app/src/main/assets/kai_snapshot_overlay.png
          test -s android-apk/app/src/main/assets/kai_entity_overlay.png
          test -s android-apk/app/src/main/assets/avatars/kai_avatar.png

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-kai-sru-visuals.py patch-mobile-swipe-ui-final.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done
          git diff --check
          ! grep -q 'LUNA_' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -q 'Luna fallback' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'file:///android_asset/kai_entity_overlay.png' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'PLAYER ADDRESS HARD LOCK' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'normalizePlayerAddress(reply)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'MOBILE_SWIPE_UI_V1' android-apk/app/src/main/assets/index.html
          grep -q 'ui/action_search.webp' android-apk/app/src/main/assets/index.html
          grep -q 'ui/action_execute.webp' android-apk/app/src/main/assets/index.html
          grep -q 'ui/action_explore.webp' android-apk/app/src/main/assets/index.html
          ! grep -q '<svg class="action-icon' android-apk/app/src/main/assets/index.html
          test -s android-apk/app/src/main/assets/ui/action_search.webp
          test -s android-apk/app/src/main/assets/ui/action_execute.webp
          test -s android-apk/app/src/main/assets/ui/action_explore.webp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.65.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.65.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.65.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.65.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='67' versionName='1.1.65'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.65.apk
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/avatars/MadGod.jpg'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/kai_snapshot_overlay.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/kai_entity_overlay.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/avatars/kai_avatar.png'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/ui/action_search.webp'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/ui/action_execute.webp'
          unzip -l Backroom-1.1.65.apk | grep -q 'assets/ui/action_explore.webp'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.65-debug-apk
          path: Backroom-1.1.65.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.65
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.65'
          TITLE='Backroom 1.1.65 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.65.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.65.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.65.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.65 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.65.apk' --output Backroom-1.1.65-verified.apk
          test -s Backroom-1.1.65-verified.apk
          cmp Backroom-1.1.65.apk Backroom-1.1.65-verified.apk
          sha256sum Backroom-1.1.65-verified.apk
