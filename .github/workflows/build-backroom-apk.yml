name: Build Backroom APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      HAIKU_API: ${{ secrets.HAIKU_API }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL || vars.HAIKU_BASE_URL }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || vars.HAIKU_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Apply Entity Core runtime
        run: |
          set -euo pipefail
          if grep -Fq 'new EntityCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java; then
            echo 'Entity Core runtime already connected.'
          else
            python3 .github/scripts/apply-entity-core-runtime.py
          fi

      - name: Commit Entity Core runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Entity Core runtime already connected.'
          else
            git commit -m 'Connect Entity Core to gameplay runtime'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify Java-only baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 84' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.84'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.84.txt
          test -z "$(find android-apk/app/src -type f -name '*.kt' -print -quit)"
          test -z "$(find android-apk -type f -name '*.py' -print -quit)"
          test ! -d android-apk/ml
          test ! -e android-apk/app/src/main/assets/models/backroom_intent_labels.txt
          ! grep -R -n -E 'org\.jetbrains\.kotlin|LiteRTIntentInterpreter|com\.google\.ai\.edge\.litert' android-apk --include='*.gradle' --include='*.java'
          grep -Fq 'function activeEntityKey()' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'function fallbackExplorerChoices()' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'if (latest && !choices.length' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'Quan sát kỹ khu vực xung quanh' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'Android.levelSnapshot' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq "localStorage.removeItem('backroom-apk-snapshot')" android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'Android.requestSnapshot' android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'function requestSnapshot' android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'window.backroomSnapshot' android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'GEMINI_IMAGE_MODEL' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -Fq 'requestSnapshotInternal' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -Fq '@JavascriptInterface public void requestSnapshot' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'function shouldShowCaoMinhOverlay()' android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'file:///android_asset/kai_snapshot_overlay.png' android-apk/app/src/main/assets/snapshot-ui.js
          grep -Fq 'file:///android_asset/entity/' android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq 'generatedFlags = generated.optJSONObject("flags")' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'generated.optString("transitionTarget", "")' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'CombatChoiceEngine.resolveFinalized' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'backroomCombatTurn' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '__loot:open_chest' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'Android.itemAction' android-apk/app/src/main/assets/inventory-ui.js
          grep -Fq "selectedOwnerId='cao_minh'" android-apk/app/src/main/assets/inventory-ui.js
          grep -Fq 'CHEST_SPAWN_RATE_PERCENT = 3' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'ENTITY_DROP_MIN_PERCENT = 10' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'ENTITY_DROP_MAX_PERCENT = 20' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          grep -Fq 'itemCore.prepareExplorationLoot' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'itemCore.validateAndApply' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'gameCore.processItemAction' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'ITEM.GAMEPLAY_LOOT_LOCK' android-apk/app/src/main/assets/knowledge/knowledge_db.json
          grep -Fq "@font-face{font-family:'Play'" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-character{color:#67d5ff}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-entity{color:#ff6b6b}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-item{color:#f6c85f}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq '.semantic-skill{color:#c792ea}' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq ".semantic{font-family:'Play',system-ui,sans-serif;font-weight:700;text-decoration:none}" android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq ".inventory-item-name{font-family:'Play',system-ui,sans-serif;font-weight:700;color:#f6c85f;text-decoration:none}" android-apk/app/src/main/assets/inventory-ui.js
          ! grep -Fq 'text-decoration:underline' android-apk/app/src/main/assets/gm-choice-ui.js
          ! grep -Fq 'text-decoration:underline' android-apk/app/src/main/assets/inventory-ui.js
          grep -Fq 'GmNarrativePacket.build' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
          grep -Fq 'projected.remove("characterCanon")' android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/GmNarrativePacketTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/GmChoiceContractTest.java
          grep -Fq 'GmChoiceContract.gmEntry(reply, generated, state)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'CombatChoiceEngine.semanticCatalog()' android-apk/app/src/main/java/com/rabpit/backroom/core/GmChoiceContract.java
          grep -Fq 'ItemCore.semanticCatalog()' android-apk/app/src/main/java/com/rabpit/backroom/core/GmChoiceContract.java
          grep -Fq 'gmEntryAddsCoreOwnedSemanticHighlightsWithoutModelMetadata' android-apk/app/src/test/java/com/rabpit/backroom/core/GmChoiceContractTest.java
          grep -Fq 'NGÔN NGỮ HIỂN THỊ:' android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
          grep -Fq 'normalizePlayerFacingVietnamese' android-apk/app/src/main/java/com/rabpit/backroom/core/GmChoiceContract.java
          grep -Fq 'gmEntryNormalizesLeakedEnglishEnvironmentTerms' android-apk/app/src/test/java/com/rabpit/backroom/core/GmChoiceContractTest.java
          jq -e '
            .levels["0"] as $l |
            ([ $l.identity[], $l.architecture[], $l.zones[], $l.sensory[], $l.anomalies[],
               $l.hazards[], $l.resources[], $l.entities[], $l.navigation[],
               $l.entrancesExits[], $l.gameplayOverride[], $l.gmConstraints[],
               $l.variationPool[], $l.narrativeGrammar[], $l.microLocations[], $l.sceneSeeds[] ]
             | join(" ")
             | test("(?i)\\b(wallpaper|ceiling|fixture|opening|buzz|corridor|junction)\\b") | not)
          ' android-apk/app/src/main/assets/knowledge/level_knowledge.json >/dev/null
          grep -Fq 'HAIKU_RETRY_DELAY_MS = 1_200L' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'private String haikuTextOnce(String prompt)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'Haiku primary failed; falling back to Gemini.' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'return haikuText(prompt);' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'return geminiText(prompt);' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          test -s android-apk/app/src/main/assets/fonts/OFL-Play.txt
          test ! -e android-apk/app/src/main/assets/status/status_bleed.webp
          test ! -e android-apk/app/src/main/assets/status/status_poison.webp
          test ! -e android-apk/app/src/main/assets/status/status_stun.webp
          test ! -e android-apk/app/src/main/assets/status/status_armor_break.webp
          test ! -e android-apk/app/src/main/assets/status/status_icons.generated.json
          ! grep -Fq 'combat-status-hud' android-apk/app/src/main/assets/snapshot-ui.js
          test -s android-apk/app/src/main/assets/hud/snapshot_frame.png
          test -s android-apk/app/src/main/assets/hud/action_plate.png
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterEncounterCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterProgressionCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterStatCore.java
          ! test -e android-apk/app/src/main/java/com/rabpit/backroom/core/EquipmentStatCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/EntityStatCore.java
          ! test -e android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterLevelCore.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/LevelCoreTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterDetailCoreTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterProgressionCoreTest.java
          ! test -e android-apk/app/src/test/java/com/rabpit/backroom/core/EquipmentStatCoreTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/EntityStatCoreTest.java
          test -s android-apk/app/src/test/java/com/rabpit/backroom/core/EntityCoreTest.java
          grep -Fq 'characterDetailCore.projectState(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          test -s android-apk/app/src/main/assets/knowledge/knowledge_db.json
          test -s android-apk/app/src/main/assets/knowledge/entity_encounters.json
          test -s android-apk/app/src/main/assets/knowledge/gm_style_examples.json
          jq -e '.version == 2 and (.goodExamples | length == 2) and (.badExample | type == "object") and ([.goodExamples[] | select((.player | type) != "string" or (.gm | type) != "string")] | length == 0)' android-apk/app/src/main/assets/knowledge/gm_style_examples.json >/dev/null
          test -s android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          test -s android-apk/SNAPSHOT_SHA256SUMS.txt
          grep -Fq '"version": 4' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          grep -Fq '"root": "level_snapshots/drive"' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          grep -Fq '"sublevelRoot": "level_snapshots/sublevels/level_0"' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json
          jq -e '
            (.sublevels["0.1"].assets | length == 4) and
            (.sublevels["0.2"].assets | length == 4) and
            (.sublevels["0.5"].assets | length == 4) and
            (.sublevels["0.7"].assets | length == 4) and
            (.sublevels.manila_room.assets | length == 4) and
            (.sublevels.the_torment.assets | length == 5) and
            (.sublevels.red_rooms.assets | length == 5)
          ' android-apk/app/src/main/assets/level_snapshots/drive/manifest.json >/dev/null
          sha256sum -c android-apk/SNAPSHOT_SHA256SUMS.txt
          test "$(find android-apk/app/src/main/assets/level_snapshots/drive -type f -name '*.webp' | wc -l)" -eq 21
          test "$(find android-apk/app/src/main/assets/level_snapshots/sublevels/level_0 -type f -name '*.webp' | wc -l)" -eq 30
          test -z "$(find android-apk/app/src/main/assets/level_snapshots -type f -name '*.webp' ! -path '*/drive/*' ! -path '*/sublevels/level_0/*' -print -quit)"
          test ! -e android-apk/app/src/main/assets/level_snapshots/wiki
          grep -Fq 'new LevelCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'new EntityCore(appContext)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'new CharacterEncounterCore()' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'characterPromptContext' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'safeApplyImmersiveFullscreen("onCreate")' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'catch (Throwable error)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'applyLegacyFullscreenFlags()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'Build.VERSION.SDK_INT < Build.VERSION_CODES.VANILLA_ICE_CREAM' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.GEMINI_API_KEY_4' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.GEMINI_API_KEY_5' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.HAIKU_API' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'private String haikuText(String prompt)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'claude-haiku-4-5-20251001' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'private void sleepBeforeNextGeminiKey' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'buildConfigField "String", "HAIKU_API"' android-apk/app/build.gradle
          grep -Fq 'buildConfigField "String", "HAIKU_BASE_URL"' android-apk/app/build.gradle
          grep -Fq 'buildConfigField "String", "HAIKU_MODEL"' android-apk/app/build.gradle
          grep -Fq 'function scrollLatestGmToStart()' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'window.backroomScrollLatestGmToStart = scrollLatestGmToStart' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'function scrollCombatToBottom()' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'function scrollForCurrentMode()' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'window.backroomScrollCombatToBottom = scrollCombatToBottom' android-apk/app/src/main/assets/gm-choice-ui.js
          ! grep -Fq 'logEl.scrollTop=logEl.scrollHeight' android-apk/app/src/main/assets/index.html
          ! grep -Fq "renderSnapshot();scrollBottom();" android-apk/app/src/main/assets/snapshot-ui.js
          ! grep -Fq '<item name="android:windowFullscreen">true</item>' android-apk/app/src/main/res/values/styles.xml
          grep -Fq 'CharacterEncounterCore.isJoinedMember' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'finishDefeat(state, combat)' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'clearEncounterFlag(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'COMPANION_REVIVE_TURNS = 10' android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterProgressionCore.java
          grep -Fq '.put("leaderId", "cao_minh")' android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailCore.java
          grep -Fq 'ensureProfileObject(characters, "cao_minh")' android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterProgressionCore.java
          grep -Fq 'applyCaoMinhDeathPenalty(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'LevelCore.resetToLevelZeroStart(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          grep -Fq 'characterProgressionCore.applyExplorerTurnRecovery(sanitized)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'CombatChoiceEngine.normalizeTerminalEncounter(state)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'testImplementation '\''org.json:json:20240303'\''' android-apk/app/build.gradle
          grep -Fq 'levelCore.validateAndApplyTransition' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'ROUTE_SUCCESS_PERCENT = 60' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          grep -Fq 'ROUTE_TRIPLE_SUCCESS_PERCENT = 5' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          grep -Fq 'ROUTE_TRIPLE_SUCCESS_INCREMENT = 3' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          grep -Fq 'ROUTE_REQUIRED_STREAK = 10' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          test -s android-apk/app/src/main/assets/knowledge/level_knowledge.json
          grep -Fq 'LEVEL_KNOWLEDGE_ASSET = "knowledge/level_knowledge.json"' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          grep -Fq 'LEVEL KNOWLEDGE BUNDLE:' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          jq -e '.schemaVersion == 2 and (.levels | keys | length == 14) and (.levels | has("0.3") | not)' android-apk/app/src/main/assets/knowledge/level_knowledge.json >/dev/null
          jq -e '
            . as $root |
            ["0","0.1","0.2","0.5","0.7","manila_room","the_torment","red_rooms","1","2","3","4","5","6"] as $keys |
            ["identity","architecture","zones","sensory","anomalies","hazards","resources","entities","navigation","entrancesExits","gameplayOverride","gmConstraints","variationPool"] as $sections |
            all($keys[]; . as $k | all($sections[]; . as $s | ($root.levels[$k][$s] | type == "array" and length > 0)))
          ' android-apk/app/src/main/assets/knowledge/level_knowledge.json >/dev/null
          jq -e '
            .levels["0"] as $l |
            ($l.canonicalFacts | length >= 10) and
            ($l.microLocations | length >= 20) and
            ($l.environmentStates | length >= 10) and
            ($l.environmentEvents | length >= 18) and
            ($l.interactionRules | length >= 12) and
            ($l.actionConsequences | length >= 10) and
            ($l.persistenceRules | length >= 8) and
            ($l.evidenceRules | length >= 8) and
            ($l.navigationPatterns | length >= 8) and
            ($l.routeProgressionCues | length >= 7) and
            ($l.encounterStaging | length >= 7) and
            ($l.hazardEscalation | length >= 5) and
            ($l.quietTurnPatterns | length >= 8) and
            ($l.narrativeGrammar | length >= 8) and
            ($l.antiRepetition | length >= 10) and
            ($l.forbiddenInventions | length >= 18) and
            ($l.sceneSeeds | length >= 25)
          ' android-apk/app/src/main/assets/knowledge/level_knowledge.json >/dev/null
          grep -Fq 'rotatingSectionLimit' android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          grep -Fq 'structuredKnowledgeLoadsOnlyCurrentLevelBundle' android-apk/app/src/test/java/com/rabpit/backroom/core/LevelCoreTest.java
          grep -Fq 'structuredKnowledgeRotatesLargeScenePoolsByTurn' android-apk/app/src/test/java/com/rabpit/backroom/core/LevelCoreTest.java
          grep -Fq 'levelCore.rollRouteForExplorerAction(legacy, text)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java
          grep -Fq 'projected.remove("levelRoute")' android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
          grep -Fq 'projected.remove("log")' android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
          grep -Fq 'projected.remove("characterCanon")' android-apk/app/src/main/java/com/rabpit/backroom/core/GmNarrativePacket.java
