name: Build Backroom APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      HAIKU_API: ${{ secrets.HAIKU_API }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL || vars.HAIKU_BASE_URL }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || vars.HAIKU_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and provider baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 72' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.70'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.70.txt
          test -s android-apk/sync-kai-sru-assets.py
          test -s android-apk/patch-kai-sru-visuals.py
          test -s android-apk/sync-play-font-assets.py
          test -s android-apk/apply-android-ui.py
          test -s android-apk/test-android-ui-regressions.mjs
          test -s android-apk/patch-android-launch-safety.py
          test -s android-apk/patch-player-address-lock.py
          test -s android-apk/patch-runtime-canon-final.py
          test -s android-apk/patch-level-transition-final.py
          test -s android-apk/patch-haiku-provider-final.py
          test -s android-apk/patch-party-turn-combat-final.py
          test ! -e android-apk/patch-pressure-combat.py
          test ! -e android-apk/patch-entity-encounter-plus-8pct.py
          test ! -e android-apk/patch-diep-minh-boss.py
          test ! -e android-apk/patch-diep-minh-boss-finalize.py
          test ! -e android-apk/patch-game-master-storytelling-frame-final.py
          test ! -e android-apk/patch-combat-typography-final.py
          test ! -e android-apk/patch-mobile-swipe-ui.py
          test ! -e android-apk/patch-mobile-swipe-ui-final.py
          test ! -e android-apk/patch-three-action-ui-only.py
          test ! -e android-apk/patch-three-action-runtime-ui.py
          test ! -e android-apk/patch-immersive-fullscreen.py
          test ! -e android-apk/patch-pr3-layout-hotfix.py
          test ! -e android-apk/patch-luna-text.py
          test ! -e android-apk/patch-luna-model-failover-final.py
          test ! -e android-apk/patch-provider-deadline-final.py
          ! grep -q 'LUNA_' android-apk/app/build.gradle

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAIKU_API HAIKU_BASE_URL HAIKU_MODEL; do
            test -n "${!name:-}" || (echo "Missing Game Master configuration: $name" && exit 1)
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Sync verified Kai SRU visuals
        run: |
          set -euo pipefail
          python android-apk/sync-kai-sru-assets.py
          test -s android-apk/app/src/main/assets/kai_snapshot_overlay.png
          test -s android-apk/app/src/main/assets/kai_entity_overlay.png
          test -s android-apk/app/src/main/assets/avatars/kai_avatar.png

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-kai-sru-visuals.py patch-player-address-lock.py patch-runtime-canon-final.py sync-play-font-assets.py apply-android-ui.py patch-android-launch-safety.py patch-level-transition-final.py patch-haiku-provider-final.py patch-party-turn-combat-final.py patch-entity-rates-drops-final.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done
          git diff --check
          ! grep -q 'LUNA_' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -q 'Luna fallback' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.HAIKU_API' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.HAIKU_BASE_URL' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'BuildConfig.HAIKU_MODEL' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'private String haikuText' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'parseModelJson(auditText(prompt, excludedWorker))' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'buildConfigField "String", "HAIKU_API"' android-apk/app/build.gradle
          grep -Fq 'buildConfigField "String", "HAIKU_BASE_URL"' android-apk/app/build.gradle
          grep -Fq 'buildConfigField "String", "HAIKU_MODEL"' android-apk/app/build.gradle
          grep -q 'file:///android_asset/kai_entity_overlay.png' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'PLAYER ADDRESS HARD LOCK' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'normalizePlayerAddress(reply)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'ANDROID_DISPLAY_GEOMETRY_V1' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'ANDROID_DISPLAY_LAUNCH_SAFE_V2' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'safeApplyAndroidDisplayMode()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'safePushAndroidDisplayGeometry(insets)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'ANDROID_UI_KAI_SHIFT_RIGHT' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'getRoundedCorner(position)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'LEVEL TRANSITION STATE LOCK' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'levelNarrativeStateIssuesAndroid' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'level_narrative_state_mismatch' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'bãi đỗ xe' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'requireGameCore().processCombat(stateJson, actionKind, action)' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -q 'fun processCombat(legacyStateJson: String, actionKind: String, action: String)' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt
          grep -q 'PRESSURE_COMBAT_HUD_V1' android-apk/app/src/main/assets/index.html
          grep -q 'ANDROID_EDGE_UI_V1' android-apk/app/src/main/assets/index.html
          grep -q 'ANDROID_SWIPE_UI_V1' android-apk/app/src/main/assets/index.html
          grep -q 'ANDROID_THREE_ACTIONS_V1' android-apk/app/src/main/assets/index.html
          grep -q 'ANDROID_GAMEPLAY_PRESENTATION_V2' android-apk/app/src/main/assets/index.html
          grep -q 'STORYTELLING_CHRONOLOGICAL_FRAME_V5' android-apk/app/src/main/assets/index.html
          grep -q 'ANDROID_SWIPE_GESTURE_V2' android-apk/app/src/main/assets/index.html
          grep -q -- '--android-radius-tl' android-apk/app/src/main/assets/index.html
          grep -q -- '--android-ime-bottom' android-apk/app/src/main/assets/index.html
          grep -Fq 'height:calc(100dvh - var(--android-ime-bottom));min-height:0' android-apk/app/src/main/assets/index.html
          grep -Fq 'WindowInsets.Type.ime()' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'android:windowSoftInputMode="adjustResize"' android-apk/app/src/main/AndroidManifest.xml
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' android-apk/app/src/main/assets/index.html
          grep -q 'data:image/webp;base64,' android-apk/app/src/main/assets/index.html
          grep -q "font-family:var(--gameplay-font)" android-apk/app/src/main/assets/index.html
          grep -q "header.textContent='Storytelling'" android-apk/app/src/main/assets/index.html
          grep -q "font-family:'BackroomPlay'" android-apk/app/src/main/assets/index.html
          ! grep -q 'GAME_MASTER_STORYTELLING_FRAME_V1' android-apk/app/src/main/assets/index.html
          ! grep -q 'GAME_MASTER_PLAY_FONT_V1' android-apk/app/src/main/assets/index.html
          ! grep -q 'COMBAT_TYPOGRAPHY_V1' android-apk/app/src/main/assets/index.html
          ! grep -q 'TRUE_TURN_COMBAT_UI_V2' android-apk/app/src/main/assets/index.html
          ! grep -q 'autoPartyCombatStyle' android-apk/app/src/main/assets/index.html
          ! grep -q 'pressureCombatStyle' android-apk/app/src/main/assets/index.html
          ! grep -q 'MOBILE_SWIPE_UI_V1' android-apk/app/src/main/assets/index.html
          ! grep -q 'PR3_HEADER_SAFE_INSET' android-apk/app/src/main/assets/index.html
          ! grep -q 'STEP2_THREE_ACTIONS' android-apk/app/src/main/assets/index.html
          ! grep -q '<svg class="action-icon' android-apk/app/src/main/assets/index.html
          node android-apk/test-android-ui-regressions.mjs android-apk/app/src/main/assets/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.70.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.70.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.70.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.70.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='72' versionName='1.1.70'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          MANIFEST_TREE=$("$BUILD_TOOLS/aapt" dump xmltree Backroom-1.1.70.apk AndroidManifest.xml)
          grep -Eq 'windowSoftInputMode.*0x10' <<<"$MANIFEST_TREE"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.70.apk
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/avatars/MadGod.jpg'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/kai_snapshot_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/kai_entity_overlay.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/avatars/kai_avatar.png'
          unzip -l Backroom-1.1.70.apk | grep -q 'assets/fonts/Play-Bold.ttf'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'ANDROID_EDGE_UI_V1'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'ANDROID_SWIPE_UI_V1'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'ANDROID_GAMEPLAY_PRESENTATION_V2'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'STORYTELLING_CHRONOLOGICAL_FRAME_V5'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'ANDROID_SWIPE_GESTURE_V2'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q -- '--android-ime-bottom'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -Fq 'height:calc(100dvh - var(--android-ime-bottom));min-height:0'
          unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'data:image/webp;base64,'
          ! unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'GAME_MASTER_STORYTELLING_FRAME_V1'
          ! unzip -p Backroom-1.1.70.apk assets/index.html | grep -q 'COMBAT_TYPOGRAPHY_V1'
          unzip -p Backroom-1.1.70.apk assets/index.html > packaged-index.html
          node android-apk/test-android-ui-regressions.mjs packaged-index.html

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.70-debug-apk
          path: Backroom-1.1.70.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.70
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.70'
          TITLE='Backroom 1.1.70 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.70.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.70.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.70.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.70 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.70.apk' --output Backroom-1.1.70-verified.apk
          test -s Backroom-1.1.70-verified.apk
          cmp Backroom-1.1.70.apk Backroom-1.1.70-verified.apk
          sha256sum Backroom-1.1.70-verified.apk
