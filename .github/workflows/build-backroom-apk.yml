name: Restore Overlay Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/level-0-6-wiki-snapshots'

permissions:
  contents: write

jobs:
  restore-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Java source
        run: python3 .github/scripts/restore-overlay-runtime.py
      - name: Commit Java source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Overlay runtime already restored.'
            exit 0
          fi
          git commit -m 'Restore Kai and Entity snapshot overlays'
          git push origin HEAD:${GITHUB_REF_NAME}
