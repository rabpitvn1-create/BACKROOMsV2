name: Build Backroom APK
# Clean-state verification trigger after retired gameplay cleanup.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - massive-update
      - 'release/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and provider baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 66' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.64'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.64.txt
          test ! -e android-apk/patch-luna-text.py
          test ! -e android-apk/patch-luna-model-failover-final.py
          test ! -e android-apk/patch-provider-deadline-final.py
          ! grep -q 'LUNA_' android-apk/app/build.gradle

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-massive-item-update.py patch-kai-encounter-overlay.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done
          git diff --check

          # Omnivault is fully retired from executable runtime, active knowledge,
          # benchmark routing and LiteRT output classes.
          test ! -e android-apk/app/src/main/java/com/rabpit/backroom/core/OmnivaultEngine.kt
          ! grep -R -E 'OmnivaultCommand|OmnivaultEngine|KAI_OMNIVAULT_RING_ID' android-apk/app/src/main/java/com/rabpit/backroom/core
          ! grep -R -F 'CHAR.KAI.OMNIVAULT' android-apk/app/src/main/assets/knowledge android-apk/app/src/main/java/com/rabpit/backroom/core/knowledge android-apk/benchmark-knowledge-context.py android-apk/KNOWLEDGE_SOURCE_MAP.md
          ! grep -E '^OMNIVAULT_' android-apk/app/src/main/assets/models/backroom_intent_labels.txt

          # New item acquisition is Android-authoritative and only Entity/ItemBox
          # provenance may create inventory entries. Generic narrative loot is gone.
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/ItemDropAuthority.kt
          grep -Fq 'enum class ItemDropOrigin { ENTITY, ITEM_BOX }' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemDropAuthority.kt
          grep -Fq 'fun forEntity(entityKey: String): List<ItemStack> = emptyList()' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemDropAuthority.kt
          grep -Fq 'fun forItemBox(itemBoxId: String): List<ItemStack> = emptyList()' android-apk/app/src/main/java/com/rabpit/backroom/core/ItemDropAuthority.kt
          ! grep -R -F 'DROP_ROLL_KEY' android-apk/app/src/main/java/com/rabpit/backroom/core
          ! grep -F 'rolls.put("loot"' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -F 'rolls.put("almondWater"' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -F 'lootChanceBonusPercent' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java

          ! grep -q 'LUNA_' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -q 'Luna fallback' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.64.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.64.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.64.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.64.apk)
          grep -q "package: name='com.rabpit.backroom' versionCode='66' versionName='1.1.64'" <<<"$BADGING"
          grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.64.apk
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/kai_snapshot_overlay.png'
          unzip -l Backroom-1.1.64.apk | grep -q 'assets/kai_entity_overlay.png'
          test "$(unzip -p Backroom-1.1.64.apk assets/kai_snapshot_overlay.png | sha256sum | awk '{print $1}')" = '0d4a612a984e3b864d9220ea65d8032fd37a09160d8600ecd6ee0d4c24056589'
          test "$(unzip -p Backroom-1.1.64.apk assets/kai_entity_overlay.png | sha256sum | awk '{print $1}')" = '92e664409f2b1f4ab668e15ad9c372792ef8069c5dbc9a36056815fd47929d1a'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.64-debug-apk
          path: Backroom-1.1.64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.64
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.64'
          TITLE='Backroom 1.1.64 Debug'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.64.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.64.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.64.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.64 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.64.apk' --output Backroom-1.1.64-verified.apk
          test -s Backroom-1.1.64-verified.apk
          cmp Backroom-1.1.64.apk Backroom-1.1.64-verified.apk
          sha256sum Backroom-1.1.64-verified.apk
