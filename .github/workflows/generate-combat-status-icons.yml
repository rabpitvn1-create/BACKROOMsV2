name: Generate Combat Status Icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-combat-status-icons.yml'

permissions:
  contents: write

concurrency:
  group: generate-combat-status-icons-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      OUT_DIR: android-apk/app/src/main/assets/status

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done
          mkdir -p "$OUT_DIR"

      - name: Generate combat status icons via configured image API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          api = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = base if base.endswith("/images/generations") else (
              base + "/images/generations" if base.endswith("/v1") else base + "/v1/images/generations"
          )
          out = pathlib.Path(os.environ["OUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)

          common = (
              "A single compact combat status-effect HUD icon for a dark survival RPG game. "
              "Square composition, centered symbol, high contrast, crisp thin dark outline, clean cell-shaded game UI style, "
              "small-screen readable silhouette, no letters, no numbers, no words, no watermark, no border frame, "
              "isolated icon with transparent background and generous transparent padding. "
          )
          prompts = {
              "status_bleed": common + "BLEED status: a sharp crimson blood droplet split by two small slash marks, dangerous but clean, no gore.",
              "status_poison": common + "POISON status: toxic green-purple droplet with a small bubbling hazard motif, clearly poisonous, no skull text.",
              "status_stun": common + "STUN status: bright gold-white concussive spiral with three short electric sparks, readable as dazed or stunned.",
              "status_armor_break": common + "ARMOR BREAK status: steel-blue shield cracked through the center with a downward fracture, clearly broken defense."
          }

          def request_image(prompt):
              payload = {"model": model, "prompt": prompt, "n": 1, "response_format": "b64_json"}
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=240) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Image API HTTP {exc.code}: {detail[:2000]}")
              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit("Image API response has no data[0]")
              item = data[0]
              if item.get("b64_json"):
                  return base64.b64decode(item["b64_json"])
              if item.get("url"):
                  dl = urllib.request.Request(item["url"], headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"})
                  with urllib.request.urlopen(dl, timeout=240) as response:
                      return response.read()
              raise SystemExit("Image API response has neither b64_json nor url")

          for name, prompt in prompts.items():
              raw = request_image(prompt)
              (out / f"{name}.raw").write_bytes(raw)

          (out / "status_icons.generated.json").write_text(
              json.dumps({"model": model, "icons": prompts}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for name in status_bleed status_poison status_stun status_armor_break; do
            src="$OUT_DIR/$name.raw"
            dst="$OUT_DIR/$name.png"
            convert "$src" -auto-orient -resize '112x112>' -gravity center -background none -extent 128x128 "$dst"
            rm "$src"
          done

      - name: Verify generated status icons
        shell: bash
        run: |
          set -euo pipefail
          for name in status_bleed status_poison status_stun status_armor_break; do
            file="$OUT_DIR/$name.png"
            test -s "$file"
            dims="$(identify -format '%wx%h' "$file")"
            test "$dims" = "128x128" || { echo "::error::$file is $dims"; exit 1; }
            file "$file"
            sha256sum "$file"
          done

      - name: Commit generated status icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR/status_bleed.png" "$OUT_DIR/status_poison.png" "$OUT_DIR/status_stun.png" "$OUT_DIR/status_armor_break.png" "$OUT_DIR/status_icons.generated.json"
          git diff --cached --quiet && { echo 'Status icons unchanged.'; exit 0; }
          git commit -m 'Generate combat status icons'
          git push origin HEAD:main
