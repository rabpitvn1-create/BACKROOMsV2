name: Apply Cao Minh and Lucia proc update once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/automation-proc-cao-lucia-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal proc additions
        shell: python
        run: |
          from pathlib import Path
          engine = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java')
          s = engine.read_text()
          old = '''        characterProc("Ma Tâm Chấn", 45, 15, "Choáng", 1, 0),
        characterProc("Huyết Độc Ma Khí", 47, 20, "Trúng độc", 2, 3));'''
          new = '''        characterProc("Ma Tâm Chấn", 45, 15, "Choáng", 1, 0),
        characterProc("Huyết Độc Ma Khí", 47, 20, "Trúng độc", 2, 3),
        characterProc("Huyết Nguyệt Liệt Thương", 51, 22, "Chảy máu", 2, 4));'''
          assert old in s, 'Cao Minh proc anchor changed; refusing unsafe edit'
          s = s.replace(old, new, 1)
          old = '''        characterProc("Concussive Burst", 46, 15, "Choáng", 1, 0),
        characterProc("Rending Burst", 49, 20, "Chảy máu", 2, 3));'''
          new = '''        characterProc("Concussive Burst", 46, 15, "Choáng", 1, 0),
        characterProc("Rending Burst", 49, 20, "Chảy máu", 2, 3),
        characterProc("Corrosive Needle Burst", 50, 22, "Trúng độc", 2, 4));'''
          assert old in s, 'Lucia proc anchor changed; refusing unsafe edit'
          s = s.replace(old, new, 1)
          engine.write_text(s)

          test = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java')
          t = test.read_text()
          old = '''  @Test public void caoMinhAndLuciaEachHaveFourCharacterProcsAndKaiHasNone() {
    assertEquals(4, CombatChoiceEngine.characterProcCount("cao_minh"));
    assertEquals(4, CombatChoiceEngine.characterProcCount("lucia"));
    assertEquals(0, CombatChoiceEngine.characterProcCount("kai"));

    for (String id : new String[]{"cao_minh", "lucia"}) {
      for (int i = 0; i < 4; i++) {'''
          new = '''  @Test public void caoMinhAndLuciaEachHaveFiveCharacterProcsAndKaiHasNone() {
    assertEquals(5, CombatChoiceEngine.characterProcCount("cao_minh"));
    assertEquals(5, CombatChoiceEngine.characterProcCount("lucia"));
    assertEquals(0, CombatChoiceEngine.characterProcCount("kai"));

    for (String id : new String[]{"cao_minh", "lucia"}) {
      for (int i = 0; i < 5; i++) {'''
          assert old in t, 'proc-count test anchor changed; refusing unsafe edit'
          test.write_text(t.replace(old, new, 1))
      - name: Run combat regression tests
        working-directory: android-apk
        run: ./gradlew testDebugUnitTest --tests com.rabpit.backroom.core.CombatChoiceEngineTest
      - name: Commit gameplay change and remove one-shot workflow
        run: |
          rm .github/workflows/automation-proc-cao-lucia-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java .github/workflows/automation-proc-cao-lucia-once.yml
          git commit -m 'feat: add Cao Minh and Lucia procs'
          git push