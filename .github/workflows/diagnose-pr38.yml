name: Repair PR 38 final CI contract

on:
  push:
    branches:
      - fix/canon-fallback-safe-turns
    paths:
      - '.github/workflows/diagnose-pr38.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canon-fallback-safe-turns
          fetch-depth: 1
      - name: Align final audit-route assertion and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-backroom-apk.yml')
          text = path.read_text(encoding='utf-8')
          old = "          grep -Fq 'parseModelJson(auditText(prompt, excludedWorker))' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java\n"
          new = (
              "          grep -Fq 'String auditRaw = auditText(prompt, excludedWorker);' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java\n"
              "          grep -Fq 'JSONObject result = parseModelJson(auditRaw);' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale audit-route assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/diagnose-pr38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align final audit-route CI contract'
          git push origin HEAD:fix/canon-fallback-safe-turns
