name: Generate final Level 0 sublevel snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-final-level-0-sublevels.yml'

permissions:
  contents: write

concurrency:
  group: generate-final-level-0-sublevels
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMG_API: ${{ secrets.IMG_API }}
      IMG_MODEL: ${{ secrets.IMG_MODEL }}
      IMG_BASE_URL: ${{ secrets.IMG_BASE_URL }}
      TORMENT_DIR: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_the-torment
      RED_DIR: android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_red-rooms

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current asset state and secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in IMG_API IMG_MODEL IMG_BASE_URL; do
            test -n "${!name:-}" || { echo "::error::Missing GitHub Secret: $name"; exit 1; }
          done

          mkdir -p "$TORMENT_DIR" "$RED_DIR" .snapshot-debug

          test -s "$TORMENT_DIR/snapshot_level_0_sublevel_the-torment_01.webp"
          test -s "$TORMENT_DIR/snapshot_level_0_sublevel_the-torment_02.webp"
          test ! -e "$TORMENT_DIR/snapshot_level_0_sublevel_the-torment_03.webp"

          for i in 01 02 03; do
            test ! -e "$RED_DIR/snapshot_level_0_sublevel_red-rooms_${i}.webp"
          done

      - name: Generate one The Torment and three Red Rooms scenes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request

          api_key = os.environ["IMG_API"].strip()
          model = os.environ["IMG_MODEL"].strip()
          base = os.environ["IMG_BASE_URL"].strip().rstrip("/")
          endpoint = (
              base if base.endswith("/images/generations")
              else base + "/images/generations" if base.endswith("/v1")
              else base + "/v1/images/generations"
          )

          torment = pathlib.Path(os.environ["TORMENT_DIR"])
          red = pathlib.Path(os.environ["RED_DIR"])

          scenes = [
              (
                  "the_torment_03",
                  torment / "raw_03",
                  "Photorealistic environmental survival-horror game background of The Torment in the Backrooms. "
                  "A monochrome greyscale outdoor grave field at night, viewed from the foggy outer margin toward concentric curved rows of weathered stone graves. "
                  "Tall dead leafless trees stand between some graves, decayed leaves cover the ground, and dense cold grey fog limits visibility to only a few metres. "
                  "A pale unmoving moon is the main light source. Far through the fog, only a faint partial silhouette of the damaged hooded-man stone statue is visible as a distant landmark. "
                  "Near the foreground edge, a small patch of material is subtly losing its remaining color into ash-grey, suggesting the gray-spread hazard without showing a creature. "
                  "Quiet, realistic, oppressive uncertainty. Scene only. No people, no living creatures, no readable gravestone names or dates, no signs, no labels, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
              (
                  "red_rooms_01",
                  red / "raw_01",
                  "Photorealistic environmental survival-horror game background of the Backrooms Red Rooms, at the Threshold Bleed. "
                  "Human eye-level view where a familiar Level 0 interior gradually changes from faded yellow-beige wallpaper and fluorescent light into deep crimson-red wallpaper and dim darkroom-like red illumination. "
                  "The carpet becomes visibly rougher and slightly sticky-looking as the red deepens. The geometry remains unmistakably like Level 0: low ceiling, repetitive walls, simple openings and awkward empty rooms. "
                  "The entrance behind the viewer is implied to be sealing into an ordinary wall, but do not show text or symbols. "
                  "No people, no creatures, no signs, no labels, no posters, no documents, no screens, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
              (
                  "red_rooms_02",
                  red / "raw_02",
                  "Photorealistic environmental survival-horror game background deep inside the Backrooms Red Rooms. "
                  "A wide crimson hall and adjoining empty rooms with dark red wallpaper, oppressive dim red fluorescent lighting, low ceiling and coarse sticky carpet. "
                  "The architecture still resembles Level 0 but feels more enclosed and dead-ended. Black mold and small pale fungi collect only in damp shadowed wall corners, clearly environmental contamination rather than food or loot. "
                  "Strong depth, realistic damp wall texture, no visible exit, no characters and no monsters. "
                  "No signs, no labels, no readable text, no documents, no screens, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
              (
                  "red_rooms_03",
                  red / "raw_03",
                  "Photorealistic environmental survival-horror game background of the Deep Deadzone in the Backrooms Red Rooms. "
                  "A narrow sequence of deep-red rooms and offset corridors under weak darkroom-red fluorescent light, with cold damp crimson walls, rough sticky carpet, heavy shadow and sparse black mold near the floor. "
                  "The repeating Level 0 geometry makes landmarks difficult to distinguish: similar corners, similar doorless openings and a corridor that seems to fold back toward a familiar wall pattern. "
                  "The scene feels isolated and communications-dead without showing devices, text or supernatural creatures. No visible Level 1 exit yet. "
                  "No people, no creatures, no signs, no labels, no posters, no documents, no screens, no typography, no written words, no title card, no UI, no watermark. "
                  "Do not render or quote any part of this instruction."
              ),
          ]

          meta = []
          for key, target, prompt in scenes:
              payload = {
                  "model": model,
                  "prompt": prompt,
                  "n": 1,
                  "response_format": "b64_json",
                  "aspect_ratio": "16:9",
                  "resolution": "2k",
              }
              if model.startswith("grok-imagine-image-2.0"):
                  payload["quality"] = "medium"

              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=300) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{key}: Image API HTTP {exc.code}: {detail[:2000]}")

              data = body.get("data")
              if not isinstance(data, list) or not data:
                  raise SystemExit(f"{key}: Image API response has no data[0]")

              item = data[0]
              if item.get("b64_json"):
                  raw = base64.b64decode(item["b64_json"])
                  source = "b64_json"
              elif item.get("url"):
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          item["url"],
                          headers={"User-Agent": "BACKROOMsV2-GitHub-Actions"},
                      ),
                      timeout=300,
                  ) as response:
                      raw = response.read()
                  source = "url"
              else:
                  raise SystemExit(f"{key}: response has neither b64_json nor url")

              if len(raw) < 50000:
                  raise SystemExit(f"{key}: generated payload suspiciously small: {len(raw)} bytes")

              target.write_bytes(raw)
              meta.append({
                  "key": key,
                  "requested_model": model,
                  "served_model": body.get("model"),
                  "source": source,
                  "bytes": len(raw),
              })
              print(f"{key}: bytes={len(raw)} source={source} served_model={body.get('model') or 'unknown'}")

          pathlib.Path(".snapshot-debug/generation-metadata.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Install image QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp tesseract-ocr

      - name: Verify raw geometry, visual complexity and no prompt-card text
        shell: bash
        run: |
          set -euo pipefail

          check_raw() {
            src="$1"
            label="$2"

            test -s "$src"
            w="$(identify -format '%w' "$src")"
            h="$(identify -format '%h' "$src")"
            entropy="$(convert "$src" -auto-orient -colorspace Gray -format '%[entropy]' info:)"

            echo "$label raw: ${w}x${h}, entropy=${entropy}"

            python3 - <<PY
          w = $w
          h = $h
          entropy = float("$entropy")
          target = 16 / 9
          ratio = w / h
          if abs(ratio - target) / target > 0.03:
              raise SystemExit("$label: raw image is not native 16:9")
          if w < 1280 or h < 720:
              raise SystemExit("$label: raw image is below 1280x720")
          if entropy < 0.20:
              raise SystemExit("$label: visual entropy is too low; possible text-card or flat-image failure")
          PY

            ocr="$(tesseract "$src" stdout -l eng 2>/dev/null || true)"
            word_count="$(printf '%s' "$ocr" | tr -cs '[:alnum:]' '\n' | awk 'length($0) >= 3' | wc -l | tr -d ' ')"
            echo "$label OCR word count: $word_count"

            if [ "$word_count" -gt 12 ]; then
              echo "::error::$label contains too much readable text; possible rendered-prompt failure"
              printf '%s\n' "$ocr" | head -20
              exit 1
            fi
          }

          check_raw "$TORMENT_DIR/raw_03" "the_torment_03"
          check_raw "$RED_DIR/raw_01" "red_rooms_01"
          check_raw "$RED_DIR/raw_02" "red_rooms_02"
          check_raw "$RED_DIR/raw_03" "red_rooms_03"

      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-level-0-sublevels-raw
          path: |
            .snapshot-debug/
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_the-torment/raw_03
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_red-rooms/raw_01
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_red-rooms/raw_02
            android-apk/app/src/main/assets/level_snapshots/sublevels/level_0/sublevel_red-rooms/raw_03
          retention-days: 7

      - name: Convert to Full HD WebP without cropping
        shell: bash
        run: |
          set -euo pipefail

          convert "$TORMENT_DIR/raw_03" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95             "$TORMENT_DIR/snapshot_level_0_sublevel_the-torment_03.webp"

          for i in 01 02 03; do
            convert "$RED_DIR/raw_${i}" -auto-orient -filter Lanczos -resize '1920x1080!' -quality 95               "$RED_DIR/snapshot_level_0_sublevel_red-rooms_${i}.webp"
          done

          rm "$TORMENT_DIR/raw_03" "$RED_DIR/raw_01" "$RED_DIR/raw_02" "$RED_DIR/raw_03"

      - name: Verify exactly three snapshots per final sublevel
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t torment_files < <(find "$TORMENT_DIR" -maxdepth 1 -type f -name 'snapshot_level_0_sublevel_the-torment_*.webp' | sort)
          mapfile -t red_files < <(find "$RED_DIR" -maxdepth 1 -type f -name 'snapshot_level_0_sublevel_red-rooms_*.webp' | sort)

          test "${#torment_files[@]}" -eq 3 || { echo "::error::The Torment must have exactly 3 snapshots"; exit 1; }
          test "${#red_files[@]}" -eq 3 || { echo "::error::Red Rooms must have exactly 3 snapshots"; exit 1; }

          declare -A seen
          for f in "${torment_files[@]}" "${red_files[@]}"; do
            test -s "$f"
            dims="$(identify -format '%wx%h' "$f")"
            test "$dims" = "1920x1080" || { echo "::error::$f is $dims"; exit 1; }
            digest="$(sha256sum "$f" | awk '{print $1}')"
            test -z "${seen[$digest]:-}" || { echo "::error::Duplicate final image: $f"; exit 1; }
            seen[$digest]=1
            file "$f"
            echo "$digest  $f"
          done

      - name: Commit final Level 0 sublevel snapshots and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/generate-final-level-0-sublevels.yml

          git add             "$TORMENT_DIR/snapshot_level_0_sublevel_the-torment_03.webp"             "$RED_DIR/snapshot_level_0_sublevel_red-rooms_01.webp"             "$RED_DIR/snapshot_level_0_sublevel_red-rooms_02.webp"             "$RED_DIR/snapshot_level_0_sublevel_red-rooms_03.webp"

          git commit -m 'Complete final Level 0 sublevel snapshots'
          git push origin HEAD:main
