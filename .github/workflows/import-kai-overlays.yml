name: Import Kai Overlays

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kai-overlays.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact Drive images
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1dBC7cOhwVNHmSZ_fX8Rht89Mfvfdo6R9&export=download&confirm=t' \
            -o /tmp/kai_entity_overlay.png
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Fa02XR57AjMZoCR3XkqsTeU9mbXn45he&export=download&confirm=t' \
            -o /tmp/kai_snapshot_overlay.png
          echo '92e664409f2b1f4ab668e15ad9c372792ef8069c5dbc9a36056815fd47929d1a  /tmp/kai_entity_overlay.png' | sha256sum -c -
          echo '0d4a612a984e3b864d9220ea65d8032fd37a09160d8600ecd6ee0d4c24056589  /tmp/kai_snapshot_overlay.png' | sha256sum -c -

      - name: Validate and install PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          files = [
              (Path('/tmp/kai_entity_overlay.png'), 1448, 1086),
              (Path('/tmp/kai_snapshot_overlay.png'), 1024, 1536),
          ]
          for path, expected_w, expected_h in files:
              raw = path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not PNG')
              w, h = struct.unpack('>II', raw[16:24])
              if (w, h) != (expected_w, expected_h):
                  raise SystemExit(f'{path} unexpected dimensions {w}x{h}')
          PY
          install -m 0644 /tmp/kai_entity_overlay.png android-apk/app/src/main/assets/kai_entity_overlay.png
          install -m 0644 /tmp/kai_snapshot_overlay.png android-apk/app/src/main/assets/kai_snapshot_overlay.png

      - name: Add final Kai encounter overlay patch
        shell: bash
        run: |
          set -euo pipefail
          cat > android-apk/patch-kai-encounter-overlay.py <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          ROOT = Path(__file__).resolve().parent
          MAIN = ROOT / 'app/src/main/java/com/rabpit/backroom/MainActivity.java'
          ASSETS = ROOT / 'app/src/main/assets'
          EXPLORE = ASSETS / 'kai_snapshot_overlay.png'
          ENCOUNTER = ASSETS / 'kai_entity_overlay.png'

          EXPECTED = {
              EXPLORE: ('0d4a612a984e3b864d9220ea65d8032fd37a09160d8600ecd6ee0d4c24056589', (1024, 1536)),
              ENCOUNTER: ('92e664409f2b1f4ab668e15ad9c372792ef8069c5dbc9a36056815fd47929d1a', (1448, 1086)),
          }

          for path, (digest, dimensions) in EXPECTED.items():
              raw = path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise RuntimeError(f'{path.name} is not a valid PNG')
              width, height = struct.unpack('>II', raw[16:24])
              if (width, height) != dimensions:
                  raise RuntimeError(f'{path.name}: expected {dimensions}, got {(width, height)}')
              actual = hashlib.sha256(raw).hexdigest()
              if actual != digest:
                  raise RuntimeError(f'{path.name}: SHA-256 mismatch')

          text = MAIN.read_text(encoding='utf-8')

          helper = (
              "function kaiEntityActive(){try{"
              "var c=state&&state.combat;"
              "if(c&&typeof c.active==='boolean')return c.active===true&&!!String(c.entityKey||'').trim();"
              "var f=state&&state.flags||{};"
              "if(String(f.entityEncounterKey||'').trim())return true;"
              "if(f.jeff&&f.jeff.present===true)return true;"
              "if(f.jane&&f.jane.present===true)return true;"
              "var ev=state&&state._snapshotEvent;"
              "return !!(ev&&ev.shouldGenerate===true&&String(ev.kind||'').toUpperCase()==='ENTITY_CONFIRMED');"
              "}catch(e){return false}}"
              "function kaiDisplayOverlaySource(){"
              "if(kaiEntityActive())return 'kai_entity_overlay.png';"
              "return typeof kaiOverlaySource==='function'?kaiOverlaySource():'kai_snapshot_overlay.png';}"
          )

          if 'function kaiDisplayOverlaySource()' not in text:
              anchor = 'function cachedSnapshot(){'
              if text.count(anchor) != 1:
                  raise RuntimeError(f'Kai overlay helper anchor: expected 1, found {text.count(anchor)}')
              text = text.replace(anchor, helper + anchor, 1)

          if "kai.src=kaiDisplayOverlaySource();" not in text:
              candidates = [
                  "kai.src=kaiOverlaySource();",
                  "kai.src='kai_snapshot_overlay.png';",
                  "kai.src='file:///android_asset/kai_snapshot_overlay.png';",
                  "kai.src='kai_snapshot_overlay.webp';",
                  "kai.src='file:///android_asset/kai_snapshot_overlay.webp';",
              ]
              present = [candidate for candidate in candidates if candidate in text]
              if len(present) != 1:
                  raise RuntimeError(f'Kai renderer source anchor: expected 1 variant, found {present}')
              text = text.replace(present[0], "kai.src=kaiDisplayOverlaySource();", 1)

          for marker in (
              "function kaiEntityActive()",
              "function kaiDisplayOverlaySource()",
              "return 'kai_entity_overlay.png'",
              "'kai_snapshot_overlay.png'",
              "kai.src=kaiDisplayOverlaySource();",
          ):
              if marker not in text:
                  raise RuntimeError('Kai encounter overlay contract missing: ' + marker)

          MAIN.write_text(text, encoding='utf-8')
          print('Kai overlays installed: normal explore uses kai_snapshot_overlay.png; active Entity encounter uses kai_entity_overlay.png.')
          PY

      - name: Wire patch and packaged-asset verification into build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/build-backroom-apk.yml')
          text = workflow.read_text(encoding='utf-8')

          old_tail = 'patch-progression-snapshot-equipment.py)'
          new_tail = 'patch-progression-snapshot-equipment.py patch-kai-encounter-overlay.py)'
          if new_tail not in text:
              if text.count(old_tail) != 1:
                  raise RuntimeError(f'build patch-chain anchor: expected 1, found {text.count(old_tail)}')
              text = text.replace(old_tail, new_tail, 1)

          anchor = "          unzip -l Backroom-1.1.64.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'\n"
          checks = (
              anchor
              + "          unzip -l Backroom-1.1.64.apk | grep -q 'assets/kai_snapshot_overlay.png'\n"
              + "          unzip -l Backroom-1.1.64.apk | grep -q 'assets/kai_entity_overlay.png'\n"
              + "          test \"$(unzip -p Backroom-1.1.64.apk assets/kai_snapshot_overlay.png | sha256sum | awk '{print $1}')\" = '0d4a612a984e3b864d9220ea65d8032fd37a09160d8600ecd6ee0d4c24056589'\n"
              + "          test \"$(unzip -p Backroom-1.1.64.apk assets/kai_entity_overlay.png | sha256sum | awk '{print $1}')\" = '92e664409f2b1f4ab668e15ad9c372792ef8069c5dbc9a36056815fd47929d1a'\n"
          )
          if "assets/kai_entity_overlay.png" not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError(f'APK verification anchor: expected 1, found {text.count(anchor)}')
              text = text.replace(anchor, checks, 1)

          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Commit final overlay change and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/import-kai-overlays.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/kai_snapshot_overlay.png \
                  android-apk/app/src/main/assets/kai_entity_overlay.png \
                  android-apk/patch-kai-encounter-overlay.py \
                  .github/workflows/build-backroom-apk.yml
          git commit -m 'Update Kai explore and entity overlays'
          git push origin HEAD:main
