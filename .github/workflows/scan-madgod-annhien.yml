name: Purge Retired Gameplay Content

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scan-madgod-annhien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair one-shot cleanup transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/purge-retired-systems.py')
          text = p.read_text(encoding='utf-8')

          def switch_block(text, marker, end_marker):
              start = text.index(marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              opener = "write(rel, dedent('''\\\n"
              closer = "'''))\n\n"
              if opener not in block or closer not in block:
                  raise SystemExit(f'delimiters not found for {marker}')
              block = block.replace(opener, 'write(rel, dedent("""\\\n', 1)
              pos = block.rfind(closer)
              if pos < 0:
                  raise SystemExit(f'closing delimiter not found for {marker}')
              block = block[:pos] + '"""))\n\n' + block[pos + len(closer):]
              return text[:start] + block + text[end:]

          text = switch_block(
              text,
              '# State-op hardening now carries only the unrelated conservative deletion rule.',
              '# Audit patches: remove the retired high-risk root and prompt clause only.',
          )
          text = switch_block(
              text,
              '# Progression/Snapshot patch keeps its level/cache/combat/healthbar duties only.',
              '# Build packaging must not require removed assets.',
          )

          start = text.index('# Orchestrator: remove dedicated item/root/roll/state handling.')
          end = text.index('# State-op hardening now carries only the unrelated conservative deletion rule.', start)
          block = text[start:end]
          needle = 'write(rel, text)\n'
          extra = "text = text.replace(' MadGod roll success chỉ mở discovery route, không tự đưa set vào inventory.', '')\n"
          if extra not in block:
              block = block.replace(needle, extra + needle, 1)
          text = text[:start] + block + text[end:]

          marker = 'for path in APK.glob("*.py"):\n'
          sanitizer = '''for _name in active_clean:\n    _path = APK / _name\n    if not _path.exists():\n        continue\n    _text = _path.read_text(encoding="utf-8")\n    _text = _text.replace(", madGod,", ",")\n    _text = _text.replace(" MadGod roll success chỉ mở discovery route, không tự đưa set vào inventory.", "")\n    _path.write_text(_text, encoding="utf-8")\n\n'''
          if sanitizer not in text:
              if marker not in text:
                  raise SystemExit('active patch loop marker missing')
              text = text.replace(marker, sanitizer + marker, 1)

          p.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/purge-retired-systems.py

      - name: Remove retired systems and repair patch chain
        run: python3 .github/scripts/purge-retired-systems.py

      - name: Syntax-check surviving Python patches
        shell: bash
        run: |
          set -euo pipefail
          find android-apk -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

      - name: Verify production patch chain in disposable copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/backroom-verify
          mkdir -p /tmp/backroom-verify
          cp -a android-apk /tmp/backroom-verify/android-apk
          scripts=(patch-provider-status.py patch-gemini-five-keys.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-gemini-provider-label.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-kai-encounter-overlay.py)
          for script in "${scripts[@]}"; do
            echo "VERIFY ==> $script"
            python3 "/tmp/backroom-verify/android-apk/$script"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/backroom-verify/android-apk')
          target = re.compile(r'MadGod|Mad God|madgod|mad god|AN_NHIEN|AnNhien|an_nhien|an-nhien|An Nhiên|An Nhien|annhien', re.I)
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              match = target.search(text)
              if match:
                  line = text[:match.start()].count('\n') + 1
                  raise SystemExit(f'generated output still contains retired reference: {path}:{line}:{match.group(0)}')
          print('Generated patch-chain output is clean.')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/purge-retired-systems.py
          rm .github/workflows/scan-madgod-annhien.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired gameplay systems'
          git push origin HEAD:main
