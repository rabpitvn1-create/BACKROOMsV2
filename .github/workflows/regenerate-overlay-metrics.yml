name: Regenerate Overlay Metrics

on:
  push:
    paths:
      - ".github/workflows/regenerate-overlay-metrics.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Regenerate overlay metadata
        shell: bash
        run: |
          set -euo pipefail
          java android-apk/tools/GenerateOverlayMetrics.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/regenerate-overlay-metrics.yml
          git add android-apk/app/src/main/assets/snapshot-ui.js .github/workflows/regenerate-overlay-metrics.yml
          git commit -m "Regenerate overlay metrics"
          git push origin HEAD:main
