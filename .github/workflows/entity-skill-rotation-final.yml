name: Finalize Entity skill rotation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/entity-skill-rotation-final.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java'); s=p.read_text()
          def ins(needle,text):
            global s
            if needle not in s: raise SystemExit('missing '+needle[:50])
            s=s.replace(needle,text+needle,1)
          if 'private static final class EntitySkill' not in s:
            ins('  private static final class Ultimate {\n','''  private static final class EntitySkill {
            final String name; final int damagePercent; final int procPercent;
            EntitySkill(String name, int damagePercent, int procPercent) {
              this.name=name; this.damagePercent=damagePercent; this.procPercent=procPercent;
            }
          }

          ''')
          if 'ENTITY_SKILLS = new LinkedHashMap' not in s:
            s=s.replace('  private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();\n','  private static final Map<String, List<EntitySkill>> ENTITY_SKILLS = new LinkedHashMap<>();\n  private static final Map<String, Ultimate> ULTIMATES = new LinkedHashMap<>();\n',1)
          if 'entitySkill("Dead Bite"' not in s:
            ins('    // Only offensive canonical skills participate in Poker Dice Skill hands.','''    entitySkills("hound",
              entitySkill("Dead Bite",120,35), entitySkill("Rending Pounce",115,32), entitySkill("Pack Maul",110,38));
            entitySkills("clump",
              entitySkill("Grasping Crush",120,34), entitySkill("Limb Barrage",115,36), entitySkill("Drag Down",110,31));
            entitySkills("duller",
              entitySkill("Blindside Strike",125,33), entitySkill("Distorted Lunge",115,37), entitySkill("Column Ambush",120,30));

          ''')
          if 'static int entitySkillCount' not in s:
            ins('  static Map<String, String> semanticCatalog() {\n','''  private static EntitySkill entitySkill(String name,int damagePercent,int procPercent) {
            return new EntitySkill(name,damagePercent,procPercent);
          }
          private static void entitySkills(String id,EntitySkill... definitions) {
            List<EntitySkill> list=new ArrayList<>(); for(EntitySkill d:definitions) list.add(d); ENTITY_SKILLS.put(id,list);
          }
          static int entitySkillCount(String key) {
            List<EntitySkill> pool=ENTITY_SKILLS.get(key==null?"":key.trim().toLowerCase(Locale.ROOT)); return pool==null?0:pool.size();
          }
          static int entitySkillDamage(int rawDamage,int percent) {
            return Math.max(1,(int)(((long)Math.max(1,rawDamage)*Math.max(0,percent)+50L)/100L));
          }
          static int entitySkillProcRoll(int seed,int round,int actorIndex,int skillIndex) {
            long x=(seed&0xffffffffL)*1664525L+(long)Math.max(1,round)*1013904223L+(long)(actorIndex+1)*2654435761L+(long)(skillIndex+1)*97531L;
            x^=x>>>16; x^=x<<11; return (int)Math.floorMod(x,100L);
          }

          ''')
          if 'skill.name + " · -" + damage' not in s:
            a=s.index('    int rawDamage = Math.max(1, entity.optInt("attack", 1));',s.index('private static void resolveEntityResponse'))
            last='    addFeedback(combat, "entity", "actor", "damage", "-" + damage + " HP", true);'
            b=s.index(last,a)+len(last)
            repl='''    int rawDamage = Math.max(1, entity.optInt("attack", 1));
            int def = actor.optInt("DEF", CharacterProgressionCore.BASE_STAT);
            List<EntitySkill> pool = ENTITY_SKILLS.get(entity.optString("key", ""));
            boolean procTriggered = false;
            if (pool != null) {
              int seed = combat.optInt("seed", 1);
              int round = Math.max(1, combat.optInt("round", 1));
              int actorIndex = Math.max(0, combat.optInt("actorIndex", 0));
              for (int i = 0; i < pool.size(); i++) {
                EntitySkill skill = pool.get(i);
                if (entitySkillProcRoll(seed, round, actorIndex, i) >= skill.procPercent) continue;
                procTriggered = true;
                int damage = defendedIncomingDamage(entitySkillDamage(rawDamage, skill.damagePercent), def);
                actor.put("hp", Math.max(0, actor.optInt("hp", 0) - damage));
                addFeedback(combat, "entity", "actor", "damage", skill.name + " · -" + damage + " HP", true);
              }
            }
            if (!procTriggered) {
              int damage = defendedIncomingDamage(rawDamage, def);
              actor.put("hp", Math.max(0, actor.optInt("hp", 0) - damage));
              addFeedback(combat, "entity", "actor", "damage", "-" + damage + " HP", true);
            }'''
            s=s[:a]+repl+s[b:]
          p.write_text(s)
          tp=Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java'); t=tp.read_text()
          marker='  private static void finalizeAs(JSONObject state, int... values) throws Exception {\n'
          if 'firstEntityRotationHasExactlyThreeSkillsEach' not in t:
            tests='''  @Test public void firstEntityRotationHasExactlyThreeSkillsEach() {
            assertEquals(3, CombatChoiceEngine.entitySkillCount("hound"));
            assertEquals(3, CombatChoiceEngine.entitySkillCount("clump"));
            assertEquals(3, CombatChoiceEngine.entitySkillCount("duller"));
          }
          @Test public void entitySkillDamageIsBounded() {
            assertEquals(18, CombatChoiceEngine.entitySkillDamage(15,120));
            assertEquals(17, CombatChoiceEngine.entitySkillDamage(15,115));
            assertEquals(21, CombatChoiceEngine.entitySkillDamage(17,125));
          }
          @Test public void entitySkillProcRollIsStableWithinTurn() {
            int r=CombatChoiceEngine.entitySkillProcRoll(12345,4,2,1); assertTrue(r>=0&&r<100);
            assertEquals(r,CombatChoiceEngine.entitySkillProcRoll(12345,4,2,1));
          }

          '''
            t=t.replace(marker,tests+marker,1)
          tp.write_text(t)
          jp=Path('android-apk/app/src/main/assets/knowledge/entity_encounters.json'); root=json.loads(jp.read_text())
          data={'hound':[('Dead Bite',120,35),('Rending Pounce',115,32),('Pack Maul',110,38)],'clump':[('Grasping Crush',120,34),('Limb Barrage',115,36),('Drag Down',110,31)],'duller':[('Blindside Strike',125,33),('Distorted Lunge',115,37),('Column Ambush',120,30)]}
          for e in root['entities']:
            if e['key'] in data: e['autoProcSkills']=[{'name':n,'damagePercent':d,'procPercent':c} for n,d,c in data[e['key']]]
          root['rules']['entitySkillProcPolicy']='Each skill rolls independently once per valid Entity response; if none proc, use the normal basic attack.'
          jp.write_text(json.dumps(root,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Test and build
        working-directory: android-apk
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/entity-skill-rotation-once.yml .github/workflows/entity-skill-rotation-fix.yml .github/workflows/entity-skill-rotation-final.yml
          git add android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java android-apk/app/src/test/java/com/rabpit/backroom/core/CombatChoiceEngineTest.java android-apk/app/src/main/assets/knowledge/entity_encounters.json
          git commit -m 'Add first Entity auto-proc skills'
          git push origin HEAD:main
