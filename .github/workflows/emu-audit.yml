name: Temporary 20-turn Emulator Audit

on:
  push:
    branches:
      - fix/story-choice-authored-grounding
    paths:
      - '.github/workflows/emu-audit.yml'
      - '.github/scripts/emu-audit.sh'

permissions:
  contents: read

jobs:
  emulator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      HAIKU_API: ${{ secrets.HAIKU_API }}
      HAIKU_BASE_URL: ${{ secrets.HAIKU_BASE_URL || vars.HAIKU_BASE_URL }}
      HAIKU_MODEL: ${{ secrets.HAIKU_MODEL || vars.HAIKU_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK for emulator
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run 20-interaction emulator audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emu-audit.sh

      - name: Print audit summary
        if: always()
        run: cat emu-audit/summary.txt || true

      - name: Upload emulator audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-audit-20-turns
          path: emu-audit/
          if-no-files-found: warn
          retention-days: 7
