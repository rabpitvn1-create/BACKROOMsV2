<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8aa63"/>
      <stop offset=".58" stop-color="#948748"/>
      <stop offset="1" stop-color="#6c6135"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b7048"/>
      <stop offset="1" stop-color="#2e2a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".16" r=".72">
      <stop offset="0" stop-color="#fffbd5" stop-opacity=".94"/>
      <stop offset=".22" stop-color="#d9d19a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".78"/>
      <stop offset=".18" stop-color="#000" stop-opacity=".2"/>
      <stop offset=".82" stop-color="#000" stop-opacity=".24"/>
      <stop offset="1" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
    <pattern id="wallpaper" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="none"/>
      <path d="M21 2c7 8 7 16 0 24C14 18 14 10 21 2Zm0 24c7 7 7 12 0 14-7-2-7-7 0-14Z" fill="#6e6535" opacity=".16"/>
      <path d="M0 21h42M21 0v42" stroke="#d0c47d" stroke-width=".8" opacity=".08"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="13" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="260" fill="#5e5737"/>
  <rect width="1200" height="176" fill="url(#wall)"/>
  <rect width="1200" height="176" fill="url(#wallpaper)"/>

  <!-- ceiling -->
  <path d="M0 0h1200v42L890 58H280L0 41Z" fill="#d0c895" opacity=".45"/>
  <path d="M0 39 300 62h590l310-23" fill="none" stroke="#5d5738" stroke-width="3" opacity=".55"/>

  <!-- fluorescent fixtures -->
  <g>
    <rect x="150" y="16" width="178" height="14" rx="2" fill="#fffde8" opacity=".92"/>
    <rect x="505" y="22" width="190" height="13" rx="2" fill="#fffde8" opacity=".95"/>
    <rect x="856" y="14" width="166" height="14" rx="2" fill="#fffde8" opacity=".88"/>
    <rect x="128" y="-36" width="220" height="112" fill="url(#glow)" filter="url(#blur)" opacity=".78"/>
    <rect x="476" y="-32" width="248" height="118" fill="url(#glow)" filter="url(#blur)" opacity=".84"/>
    <rect x="822" y="-38" width="230" height="112" fill="url(#glow)" filter="url(#blur)" opacity=".76"/>
  </g>

  <!-- repeating corridor openings -->
  <g fill="#2c2b22" opacity=".96">
    <path d="M46 64h150v112H46z"/>
    <path d="M286 73h126v103H286z"/>
    <path d="M798 70h132v106H798z"/>
    <path d="M1014 62h142v114h-142z"/>
  </g>
  <g fill="#575038" opacity=".9">
    <rect x="58" y="76" width="126" height="100"/>
    <rect x="298" y="83" width="102" height="93"/>
    <rect x="810" y="81" width="108" height="95"/>
    <rect x="1027" y="74" width="116" height="102"/>
  </g>

  <!-- central impossible hallway -->
  <path d="M457 71h286l-76 105H533Z" fill="#3a382b"/>
  <path d="M494 82h212l-54 94h-107Z" fill="#746a3f"/>
  <path d="M531 92h138l-34 84h-70Z" fill="#191a17"/>
  <rect x="580" y="99" width="40" height="8" rx="2" fill="#f3efc8" opacity=".72"/>

  <!-- floor with perspective -->
  <path d="M0 176h1200v84H0z" fill="url(#floor)"/>
  <path d="M533 176 418 260M667 176l118 84M350 176 114 260M850 176l236 84" stroke="#a79b62" stroke-width="2" opacity=".18"/>
  <path d="M0 213h1200M0 238h1200" stroke="#191815" stroke-width="2" opacity=".25"/>

  <!-- water stains / wrong geometry -->
  <path d="M77 117c34-20 73 12 101-4 18-11 35-5 48 8-37 6-73 6-111 0-17-3-27 1-38-4Z" fill="#514a2d" opacity=".18"/>
  <path d="M944 121c35-11 80 7 110-6 19-8 37 0 49 11-46 4-93 4-139-1Z" fill="#4a432a" opacity=".16"/>
  <path d="M722 50 764 0h22l-39 67Z" fill="#272820" opacity=".35"/>

  <!-- subtle grime -->
  <rect width="1200" height="260" filter="url(#grain)" opacity=".55"/>
  <rect width="1200" height="260" fill="url(#vignette)"/>
  <rect width="1200" height="260" fill="#171610" opacity=".08"/>
</svg>