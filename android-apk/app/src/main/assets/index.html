<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Backroom</title>
<style>
/* Quicksand (Google Fonts, OFL) — bundled locally, same font set as Hui-s-Family.
   License: fonts/OFL-Quicksand.txt. No CDN: the game must work fully offline. */
@font-face{font-family:"Quicksand";src:url("fonts/Quicksand-400.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Quicksand";src:url("fonts/Quicksand-500.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Quicksand";src:url("fonts/Quicksand-600.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Quicksand";src:url("fonts/Quicksand-700.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
:root{--font-display:"Quicksand","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-reading:"Quicksand","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-ui:"Quicksand","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-code:"Quicksand","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2{font-family:var(--font-display)}
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px var(--font-ui)}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}
.campaign-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.eyebrow,.role{color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em;font-family:var(--font-code)}h1{margin:4px 0 0;font-size:23px}.turn{color:#9aa4ad;font-size:12px;letter-spacing:.1em;white-space:nowrap}.turn strong{font-size:21px;color:white}
button{font:inherit;border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700;cursor:pointer}textarea{font:inherit}
.burger-toggle{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px}.burger-line{display:block;width:20px;height:2px;background:#eef1f3}.burger-text{font-size:10px;font-weight:800;letter-spacing:.12em;color:#8f9aa4}
.snapshot-stage{position:relative;height:clamp(300px,82vw,340px);margin-top:10px}
.stage-bg{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:1px solid #252b31;background:#0b0d0f;box-shadow:0 20px 60px #0007}
#stage-background{display:block;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.snapshot-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.stage-figure{position:absolute;bottom:0;z-index:2;pointer-events:none}.stage-figure img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;border:0;background:transparent}
.stage-nameplate{position:absolute;left:50%;bottom:calc(100% - 5px);transform:translateX(-50%);z-index:4;padding:.12rem .5rem;border:1px solid #2b3137;border-radius:.35rem;background:rgba(8,10,12,.85);color:#eef1f3;font-size:.68rem;font-weight:600;letter-spacing:.05em;white-space:nowrap;pointer-events:none}
#stage-entity-figure{left:0;height:92%;max-width:55%;opacity:0;visibility:hidden;transition:opacity 260ms ease,visibility 260ms ease}
#stage-entity-figure.stage-entity-on{opacity:1;visibility:visible}
#stage-companion-figure{left:0;height:92%;max-width:55%;opacity:0;visibility:hidden;transition:opacity 600ms ease,visibility 600ms ease,left 600ms ease}
#stage-companion-figure.stage-companion-on{opacity:1;visibility:visible}
#stage-companion-figure.stage-companion-shifted{left:25%;z-index:1}
.stage-character-wrap{position:absolute;right:0;bottom:0;transform:translateX(10px);z-index:3;height:100%;aspect-ratio:1086/1448;max-width:62%}
#stage-character{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:contain;border:0;background:transparent;pointer-events:none;transition:opacity 160ms ease}
#stage-character.is-swapping{opacity:0}
.stage-sword{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;will-change:transform,opacity}
.stage-sword img{display:block;height:67%;width:auto;border:0;background:transparent;filter:drop-shadow(0 0 10px rgba(255,45,60,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.stage-sword-b img{height:70%}
.stage-sword-a{animation:sword-hover-a 3.8s ease-in-out infinite alternate}
.stage-sword-b{animation:sword-hover-b 4.37s ease-in-out infinite alternate}
@keyframes sword-hover-a{from{transform:translate(-32%,-10.5%) rotate(0deg)}to{transform:translate(-32%,-4.5%) rotate(0deg)}}
@keyframes sword-hover-b{from{transform:translate(32%,-4.5%) rotate(0deg)}to{transform:translate(32%,-10.5%) rotate(0deg)}}
.stage-caption{position:absolute;left:50%;bottom:.6rem;z-index:4;transform:translateX(-50%);max-width:calc(100% - 2rem);padding:.38rem .8rem;border:1px solid #2b3137;border-radius:999px;color:#eef1f3;background:rgba(8,10,12,.72);font-size:.72rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-panel{margin-top:10px;border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007;padding:10px}
.scene-header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:2px 2px 10px;border-bottom:1px solid #252b31;margin-bottom:12px}
.scene-kicker{color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em;font-family:var(--font-code)}
.scene-seal{color:#9aa4ad;font-size:11px;letter-spacing:.1em;white-space:nowrap}.scene-seal strong{color:#eef1f3;font-size:14px}
.log{display:grid;gap:10px;align-content:start}
.story-line{margin:0}
.dialogue{display:flex;gap:10px;border-left:3px solid #8b949e;padding:11px;background:#111519}.message-body{flex:1;min-width:0}
.speaker{display:block;margin-bottom:6px;color:#c9d1d8;font-size:12px;font-weight:700;letter-spacing:.06em}
.text{white-space:pre-wrap;line-height:1.55;font-family:var(--font-reading)}
#log article.reading{outline:1px solid #77828c}
.dialogue-avatar{width:2.8rem;height:2.8rem;flex:none;object-fit:cover;border:1px solid #2b3137;border-radius:.35rem;background:#090c0f}
.dialogue-avatar-crop{width:2.8rem;height:2.8rem;flex:none;overflow:hidden;padding:0;position:relative}
.dialogue-avatar-crop>img{display:block;height:385%;width:auto;max-width:none;position:relative;left:50%;transform:translateX(-50%)}
body.fast-read .story-panel *,body.fast-read .story-panel *::before,body.fast-read .story-panel *::after{animation-duration:.01s!important;transition-duration:.01s!important}
.choice-deck{margin-top:10px;border-top:1px solid #252b31;padding-top:10px}.choice-deck-tools{display:flex;flex-wrap:wrap;gap:8px}.choices{display:grid;gap:8px;margin-top:8px}.choices[hidden]{display:none}.choice{text-align:left}
.composer{display:grid;gap:8px;padding:10px 0 0}textarea{min-height:80px;background:#090c0f;color:white;border:1px solid #30373e;padding:10px}
.status{border-top:1px solid #252b31;padding:10px 0 0;margin-top:10px;color:#9aa4ad;font-size:12px}
.intel-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:119}.intel-scrim[hidden]{display:none}
.intel-panel{position:fixed;top:0;right:0;z-index:120;width:min(420px,92vw);height:100dvh;background:#0e1114;border-left:1px solid #2b3137;transform:translateX(105%);visibility:hidden;transition:transform 260ms ease,visibility 260ms ease;display:flex;flex-direction:column}
body.intel-open .intel-panel{transform:none;visibility:visible}
.intel-header{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #2b3137}.intel-header h2{margin:0;font-size:15px;letter-spacing:.08em}
.intel-scroll{overflow:auto;padding:10px;display:grid;gap:10px;align-content:start}
.card{border:1px solid #2b3137;background:#0e1114;padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}
.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}.chips .chip{border:1px solid #313940;padding:5px 7px;font-size:12px;font-weight:400}
.profile-card{display:flex;gap:12px;width:100%;padding:12px;border:1px solid #2b3137;background:#0b0d0f;color:inherit;text-align:left;cursor:pointer}
.portrait-frame{width:84px;height:84px;flex:none;overflow:hidden;border:1px solid #2b3137}.portrait-frame img{width:100%;height:100%;object-fit:cover}
.micro-label{margin:0;color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em;font-family:var(--font-code)}
.profile-copy h2{margin:4px 0;font-size:17px}.profile-copy h2 span{color:#8f9aa4;font-size:12px;font-weight:500}.profile-copy p{margin:0;color:#9aa4ad;font-size:12px;line-height:1.45}
.profile-list{display:grid;gap:8px}.profile-list button{text-align:left}
.backlog-overlay{position:fixed;inset:0;z-index:130;display:grid;place-items:center}.backlog-overlay[hidden]{display:none}
.backlog-scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.backlog-card{position:relative;width:min(680px,94vw);max-height:86dvh;overflow:auto;background:#0e1114;border:1px solid #2b3137;padding:16px}
.backlog-head{display:flex;justify-content:space-between;align-items:center}.backlog-head h2{margin:0;font-size:16px}.backlog-note{color:#9aa4ad;font-size:12px}
.backlog-list{display:grid;gap:10px}.backlog-item{border-left:3px solid #454e56;padding:8px 10px;background:#111519;font-size:13px;white-space:pre-wrap;line-height:1.5;font-family:var(--font-reading)}.backlog-item.player{border-left-color:#8b949e}
.character-overlay{position:fixed;inset:0;z-index:140;display:grid;place-items:center}.character-overlay[hidden]{display:none}
.character-overlay-scrim{position:absolute;inset:0;background:rgba(0,0,0,.65);border:0;padding:0}
.character-overlay-card{position:relative;width:min(560px,94vw);max-height:88dvh;overflow:auto;background:#0e1114;border:1px solid #2b3137;padding:16px}
.character-overlay-close{position:absolute;top:8px;right:8px;z-index:2;padding:6px 10px}
.character-overlay-portrait img{width:100%;max-height:300px;object-fit:cover;object-position:50% 25%;display:block}
.character-overlay-copy h2{margin:6px 0;font-size:22px}.character-overlay-copy h2 span{color:#8f9aa4;font-size:13px;font-weight:500}
.character-overlay-copy p{color:#c9d1d8;line-height:1.55}
</style>
</head>
<body>
<main class="shell">
<header class="campaign-header">

</main>

<span class="profile-copy"><span class="micro-label">ĐẠO TỔ · VẠN MA ĐẠO MÔN</span><h2>Cao Minh <span>/ Vạn Giới Ma Tổ</span></h2><p>Đạo Tổ · song kiếm Thái Cổ Song Sát · Hắc Long Chiến Khải</p></span>

</div>
<script>
const CURRENT_CHARACTER_CANON={
  version:"characters-2026-11-09",
  instruction:"Current Google Drive character canon. This overrides conflicting legacy character facts in old logs/local mirrors. KNOWLEDGE_LOCK is writer/GM canon, not automatic in-world knowledge. UNKNOWN/OPEN must remain unknown. Lucia is a fixed Level 0 story encounter and must never be auto-spawned just because the model knows her codex.",
  cao_minh:"Cao Minh / Vạn Giới Ma Tổ is the main character: Đạo Tổ of Vạn Ma Đạo Môn, realm Chí Tôn Đại Viên Mãn. Earthling reincarnated; fell into the Backrooms through the rift when Lôi Thiên Vực collapsed (Lục Trầm sacrificed himself to open the way). Equipment: Thái Cổ Song Sát twin swords (demon-face blade + red-core blade; both hover behind his back) and Hắc Long Chiến Khải armor. Named sword art: Thiên Kiếm Thất Thức — per-form details UNKNOWN/OPEN, do not invent. No guns, no powered armor, no storage ring.",
  iris:"Iris / ARGUS is SRU Scout / Target Eliminator in Cao Minh's team, a real ranged Gunslinger. No surname locked. Half-human/half-demon daughter of Belial and a deceased human mother; mother details, birth era and exact combat tier remain UNKNOWN. Belial Core provides infinite demon power for established functions. ARGUS Terrain Read uses direct observation plus local Recon Frame sensors for terrain/routes/LOS/cover/ambush/traces; no omniscience, wall vision, remote cameras or automatic true-form detection. Thousandfold Cognition is up to 1:1000 information processing, not body speed. Current gear: SRU Recon Frame R03 and Ivory & Ebony, whose bullets form from Iris's demon power. Iris loves Cao Minh; Cao Minh knows but reciprocation is not canonically established. Iris uses anh-em with Cao Minh; Iris and Syvial are trusted friends/teammates with romantic rivalry, not enemies.",
  syvial:"Syvial is half-human/half-demon daughter of Lucifer, origin era 2299, true age unknown, UR+ and same overall tier as Cao Minh. Current organization: SRU anti-anomalous police; deputy leader of Cao Minh's team. Lucifer Core supplies infinite demon power; Devil Trigger does not remove control or have an invented intrinsic cap/cooldown. GodKiller is a massive purely mechanical greatsword, never a gun/gunblade. Lucifer Armor is mobile black/gunmetal/silver mecha armor with magenta accents; pointed head modules are mechanical, not biological horns; very durable/fast self-repairing but not absolutely indestructible. GodKiller Override / Twenty-Four Severance = exactly 24 cuts while external time is fully stopped. Syvial is intensely yandere toward Cao Minh but lucid and socially/tactically competent; she values Cao Minh's voluntary choice and does not randomly murder, sabotage missions, erase memory or mind-control him.",
  lucia:"Hứa Thuý Mai is the legal/real name; Lucia Lục is a military nickname/callsign. She is a 19-year-old HUMAN Vietnamese woman of Hoa Kiều background, great-great-granddaughter of the Hứa family, with one year military training/service via Vietnam + USA and excellent entrance result. She is a capable human tactical riflewoman, not supernatural/UR+. Lucia is a fixed story-owned Level 0 encounter, not random/quest spawn and not part of the initial SRU group (Cao Minh/Iris/Syvial). Gameplay baseline: HP100 STR7 DF7 AGI8 CRIT7, +2 HP after each 3 separately completed turns. Main weapon personalized M4A1; baseline physical ammo 60 in main mags + 90 reserve = 150; combat dagger and military navigation watch. Relationship/address with Cao Minh remain OPEN."

const PROFILES={
  cao_minh:{name:"Cao Minh",alias:"Vạn Giới Ma Tổ",role:"ĐẠO TỔ · VẠN MA ĐẠO MÔN",image:"avatars/cao_minh_avatar.jpg",summary:"Người Trái Đất trọng sinh sau một đêm tăng ca quá độ; rơi vào Backrooms qua khe nứt khi Lôi Thiên Vực sụp đổ; song kiếm Thái Cổ Song Sát, Hắc Long Chiến Khải hộ thân."},

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status");
const stageBgEl=byId("stage-background"),entityFigEl=byId("stage-entity-figure"),entityImgEl=byId("stage-entity"),entityNameEl=byId("stage-entity-name"),companionFigEl=byId("stage-companion-figure"),companionImgEl=byId("stage-companion"),companionNameEl=byId("stage-companion-name"),charImgEl=byId("stage-character"),captionEl=byId("stage-scene-name"),swordAEl=document.querySelector(".stage-sword-a"),swordBEl=document.querySelector(".stage-sword-b");
const kickerEl=byId("scene-kicker"),progressEl=byId("scene-progress");
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

state.characterCanon=CURRENT_CHARACTER_CANON;
// Save format v2 is fixed-scene progress ({scene, flags, history}); any older
// turn/log save is discarded and play restarts at the first scene.
if(!state||state.v!==2||!Array.isArray(state.history))state=JSON.parse(JSON.stringify(initial));
if(state===initial)state=JSON.parse(JSON.stringify(initial));
loadStory().then(function(){
  if(state.scene&&scenesById[state.scene])render();
  else{state.history=[];enterScene(story.start)}
},function(){statusEl.textContent="Không tải được dữ liệu truyện (story/opening-chapter.json)."});
localStorage.setItem("backroom-apk-state",JSON.stringify(state));

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function profileKeyOf(name){const n=String(name||"").toLowerCase();if(n.includes("cao minh"))return"cao_minh";if(n.includes("iris"))return"iris";if(n.includes("syvial"))return"syvial";if(n.includes("lucia")||n.includes("thuý mai")||n.includes("thúy mai"))return"lucia";return""}
function partyChips(items){if(!items||!items.length)return"<span>Trống.</span>";return items.map(x=>{const name=typeof x==="string"?x:x.name||"—";const k=profileKeyOf(name);return k?"<button type='button' class='chip' data-profile-open='"+k+"'>"+esc(name)+"</button>":"<span>"+esc(name)+"</span>"}).join("")}
// shortcut: L8 reuses the L7 background by plan, and L9 has no asset yet so it falls back to the nearest existing one (L7); split the mapping when level_9.webp lands
function levelOf(loc){const m=/level\s*(\d+)/i.exec(String(loc||""));if(!m)return 0;const n=Math.min(9,Math.max(0,parseInt(m[1],10)));return n>=8?7:n}
function flagKey(v){if(!v)return"";const raw=typeof v==="string"?v:(v.id||v.key||v.name||"");return String(raw).toLowerCase().trim().replace(/\s+/g,"_")}
function flagName(v){const raw=v&&typeof v==="object"&&v.name?String(v.name):flagKey(v).replace(/[_-]+/g," ");return raw?raw.replace(/\b\w/g,c=>c.toUpperCase()):""}
function entitySrc(k){return"entity/"+k+(k==="hound"?".webp":".png")}
let stagePose="";
function renderStage(){
  const bgSrc="level_snapshots/level_"+levelOf(state.location)+".webp";
  if(stageBgEl.getAttribute("src")!==bgSrc)stageBgEl.src=bgSrc;
  captionEl.textContent=state.location||"";
  const flags=state.flags||{};
  const ek=flagKey(flags.entity)||flagKey(flags.encounter);
  const ck=flagKey(flags.companion);
  const encounter=!!ek;
  if(encounter){entityImgEl.src=entitySrc(ek);entityNameEl.textContent=flagName(flags.entity||flags.encounter);entityFigEl.classList.add("stage-entity-on")}else{entityFigEl.classList.remove("stage-entity-on")}
  if(ck&&ck!==ek){companionImgEl.src=entitySrc(ck);companionNameEl.textContent=flagName(flags.companion);companionFigEl.classList.add("stage-companion-on");companionFigEl.classList.toggle("stage-companion-shifted",encounter)}else{companionFigEl.classList.remove("stage-companion-on","stage-companion-shifted")}
  const pose=encounter?"cao_minh_entity_overlay.png":"cao_minh_snapshot_overlay.png";
  if(stagePose!==pose){stagePose=pose;charImgEl.classList.add("is-swapping");setTimeout(()=>{charImgEl.src=pose;charImgEl.classList.remove("is-swapping")},160)}
}
function lineHtml(x){
  if(!x.speaker)return"<article class='story-line'><div class='text'>"+esc(x.text)+"</div></article>";
  const av=x.speaker==="Cao Minh"?"<img class='dialogue-avatar' src='avatars/cao_minh_avatar.jpg' alt='Cao Minh'>":"";
  return"<article class='dialogue'>"+av+"<div class='message-body'><span class='speaker'>"+esc(x.speaker)+"</span><div class='text'>"+esc(x.text)+"</div></div></article>";
}
function visibleLines(sc){return sc.lines.filter(function(ln){return !ln.if||Object.keys(ln.if).every(function(k){return state.flags[k]===ln.if[k]})})}
let lastRenderedScene=null;
function render(){
  titleEl.textContent=state.title;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Cao Minh";partyEl.innerHTML=partyChips(state.party);inventoryEl.innerHTML=chips(state.inventory);
  // Hui model: the story frame holds ONLY the current scene's segment;
  // everything already read lives in state.history (backlog + save).
  const sc=story&&state.scene?scenesById[state.scene]:null;
  logEl.innerHTML=(sc?visibleLines(sc):(state.history||[])).map(lineHtml).join("");
  kickerEl.textContent=sc?"BACKROOMS // "+String(state.location||"").toUpperCase():"";
  progressEl.textContent=sc?String(sceneIndex[sc.id]||0).padStart(2,"0"):"00";
  if(sc&&lastRenderedScene!==sc.id){lastRenderedScene=sc.id;const snap=byId("snapshot");if(snap&&snap.scrollIntoView)snap.scrollIntoView({block:"start"})}
  renderChoices();renderStage();
}
let story=null;const scenesById={};const sceneIndex={};
function loadStory(){
  const got=(typeof fetch==="function")?fetch("story/opening-chapter.json").then(function(r){if(!r.ok)throw new Error("story http");return r.json()}):Promise.reject(new Error("no fetch"));
  return got.catch(function(){return new Promise(function(res,rej){const x=new XMLHttpRequest();x.open("GET","story/opening-chapter.json");x.onload=function(){try{res(JSON.parse(x.responseText))}catch(e){rej(e)}};x.onerror=rej;x.send()})}).then(function(data){story=data;data.scenes.forEach(function(sc,i){scenesById[sc.id]=sc;sceneIndex[sc.id]=i+1});return data});
}
function enterScene(id){
  const sc=scenesById[id];if(!sc)return;
  state.scene=id;state.location="Level "+sc.stage.level;state.flags.entity=sc.stage.entity||null;
  for(const ln of visibleLines(sc))state.history.push({speaker:ln.speaker||"",text:ln.text});
  save();render();
}
function choose(c){if(c.set)state.flags=Object.assign({},state.flags,c.set);enterScene(c.next)}
function restart(){state=JSON.parse(JSON.stringify(initial));if(story)enterScene(story.start);else render()}
function renderChoices(){
  const sc=story&&state.scene?scenesById[state.scene]:null;
  if(!sc){choicesEl.innerHTML="";return}
  if(!sc.choices.length){choicesEl.innerHTML="<div class='text'>— Hết phần nội dung hiện có —</div><button type='button' class='choice' data-restart='1'>Đọc lại từ đầu</button>";return}
  choicesEl.innerHTML=sc.choices.map(function(c,i){return"<button type='button' class='choice' data-choice='"+i+"'>"+esc(c.label)+"</button>"}).join("");
}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu tiến trình trên máy."}
function load(){state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;state.characterCanon=CURRENT_CHARACTER_CANON;render()}
function resetGame(){if(confirm("Bắt đầu lại từ đầu?"))restart()}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");restart()}}
function curState(){try{return state}catch(e){return null}}
const overlayEl=byId("character-overlay"),ovImg=byId("character-overlay-image"),ovRole=byId("character-overlay-role"),ovNameText=byId("character-overlay-name-text"),ovAlias=byId("character-overlay-alias"),ovSummary=byId("character-overlay-summary");
function openProfile(key){const p=PROFILES[key];if(!p)return;ovImg.src=p.image;ovImg.alt=p.name;ovRole.textContent=p.role;ovNameText.textContent=p.name;ovAlias.textContent=p.alias?"/ "+p.alias:"";ovSummary.textContent=p.summary;overlayEl.hidden=false}
function closeProfile(){overlayEl.hidden=true}
document.addEventListener("click",e=>{const t=e.target.closest?e.target.closest("[data-profile-open]"):null;if(t)openProfile(t.getAttribute("data-profile-open"))});
byId("character-overlay-close").addEventListener("click",closeProfile);
overlayEl.querySelector(".character-overlay-scrim").addEventListener("click",closeProfile);
entityImgEl.addEventListener("error",()=>entityFigEl.classList.remove("stage-entity-on"));
companionImgEl.addEventListener("error",()=>companionFigEl.classList.remove("stage-companion-on"));
const intelPanel=byId("intel-panel"),intelScrim=byId("intel-scrim"),intelToggle=byId("intel-toggle");
function setIntel(open){document.body.classList.toggle("intel-open",open);intelPanel.setAttribute("aria-hidden",open?"false":"true");intelToggle.setAttribute("aria-expanded",open?"true":"false");intelScrim.hidden=!open}
intelToggle.addEventListener("click",()=>setIntel(!document.body.classList.contains("intel-open")));
byId("intel-close").addEventListener("click",()=>setIntel(false));
intelScrim.addEventListener("click",()=>setIntel(false));
const backlogEl=byId("backlog-overlay"),backlogList=byId("backlog-list");
function openBacklog(){const s=curState();const items=s&&Array.isArray(s.history)?s.history.slice(-200):[];backlogList.innerHTML=items.length?items.map(x=>"<div class='backlog-item'>"+(x.speaker?"<span class='speaker'>"+esc(x.speaker)+"</span>":"")+esc(x.text)+"</div>").join(""):"<p>Chưa có nội dung.</p>";backlogEl.hidden=false}
byId("backlog-open").addEventListener("click",openBacklog);
byId("backlog-close").addEventListener("click",()=>{backlogEl.hidden=true});
backlogEl.querySelector(".backlog-scrim").addEventListener("click",()=>{backlogEl.hidden=true});
const choicesEl=byId("choices"),actionsToggle=byId("actions-toggle");
actionsToggle.addEventListener("click",()=>{const show=choicesEl.hidden;choicesEl.hidden=!show;actionsToggle.setAttribute("aria-expanded",show?"true":"false")});
choicesEl.addEventListener("click",e=>{const t=e.target.closest?e.target.closest("[data-choice],[data-restart]"):null;if(!t)return;if(t.hasAttribute("data-restart")){restart();return}const sc=scenesById[state.scene];const c=sc&&sc.choices[+t.getAttribute("data-choice")];if(c)choose(c)});
let autoOn=false,autoTimer=null,readIdx=0;
const autoToggle=byId("auto-toggle"),skipToggle=byId("skip-toggle");
function stopAuto(){autoOn=false;autoToggle.setAttribute("aria-pressed","false");if(autoTimer){clearInterval(autoTimer);autoTimer=null}logEl.querySelectorAll(".reading").forEach(n=>n.classList.remove("reading"))}
function stepAuto(){const items=logEl.querySelectorAll("article");if(!items.length||readIdx>=items.length){stopAuto();return}logEl.querySelectorAll(".reading").forEach(n=>n.classList.remove("reading"));const el=items[readIdx++];el.classList.add("reading");if(el.scrollIntoView)el.scrollIntoView({block:"nearest"})}
function autoInterval(){return document.body.classList.contains("fast-read")?400:2600}
autoToggle.addEventListener("click",()=>{if(autoOn){stopAuto();return}autoOn=true;autoToggle.setAttribute("aria-pressed","true");readIdx=0;stepAuto();autoTimer=setInterval(stepAuto,autoInterval())});
skipToggle.addEventListener("click",()=>{const on=document.body.classList.toggle("fast-read");skipToggle.setAttribute("aria-pressed",on?"true":"false");logEl.scrollTop=logEl.scrollHeight;if(autoOn){clearInterval(autoTimer);autoTimer=setInterval(stepAuto,autoInterval())}});
render();
</script>
</body>
</html>
