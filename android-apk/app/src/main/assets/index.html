<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px system-ui,sans-serif}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}
.campaign-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.eyebrow,.role{color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em}h1{margin:4px 0 0;font-size:23px}.turn{color:#9aa4ad;font-size:12px;letter-spacing:.1em;white-space:nowrap}.turn strong{font-size:21px;color:white}
button{font:inherit;border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700;cursor:pointer}textarea{font:inherit}
.burger-toggle{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px}.burger-line{display:block;width:20px;height:2px;background:#eef1f3}.burger-text{font-size:10px;font-weight:800;letter-spacing:.12em;color:#8f9aa4}
.snapshot-stage{position:relative;height:clamp(300px,82vw,340px);margin-top:10px}
.stage-bg{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:1px solid #252b31;background:#0b0d0f;box-shadow:0 20px 60px #0007}
#stage-background{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.snapshot-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.stage-figure{position:absolute;bottom:0;z-index:2;pointer-events:none}.stage-figure img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;border:0;background:transparent}
.stage-nameplate{position:absolute;left:50%;bottom:calc(100% - 5px);transform:translateX(-50%);z-index:4;padding:.12rem .5rem;border:1px solid #2b3137;border-radius:.35rem;background:rgba(8,10,12,.85);color:#eef1f3;font-size:.68rem;font-weight:600;letter-spacing:.05em;white-space:nowrap;pointer-events:none}
#stage-entity-figure{left:0;height:92%;max-width:55%;opacity:0;visibility:hidden;transition:opacity 260ms ease,visibility 260ms ease}
#stage-entity-figure.stage-entity-on{opacity:1;visibility:visible}
#stage-companion-figure{left:0;height:92%;max-width:55%;opacity:0;visibility:hidden;transition:opacity 600ms ease,visibility 600ms ease,left 600ms ease}
#stage-companion-figure.stage-companion-on{opacity:1;visibility:visible}
#stage-companion-figure.stage-companion-shifted{left:25%;z-index:1}
.stage-character-wrap{position:absolute;right:0;bottom:0;transform:translateX(10px);z-index:3;height:100%;aspect-ratio:1086/1448;max-width:62%}
#stage-character{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:contain;border:0;background:transparent;pointer-events:none;transition:opacity 160ms ease}
#stage-character.is-swapping{opacity:0}
.stage-sword{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stage-sword img{display:block;height:67%;width:auto;border:0;background:transparent;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.stage-sword-b img{height:70%}
.stage-sword-a{animation:sword-hover-a 3.8s ease-in-out infinite alternate}
.stage-sword-b{animation:sword-hover-b 4.37s ease-in-out infinite alternate}
@keyframes sword-hover-a{from{transform:translate(-32%,-10.5%)}to{transform:translate(-32%,-4.5%)}}
@keyframes sword-hover-b{from{transform:translate(32%,-4.5%)}to{transform:translate(32%,-10.5%)}}
.stage-caption{position:absolute;left:50%;bottom:.6rem;z-index:4;transform:translateX(-50%);max-width:calc(100% - 2rem);padding:.38rem .8rem;border:1px solid #2b3137;border-radius:999px;color:#eef1f3;background:rgba(8,10,12,.72);font-size:.72rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-panel{margin-top:10px;border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007;padding:10px}
.log{height:42vh;overflow:auto;display:grid;gap:10px;align-content:start}
.message{display:flex;gap:10px;border-left:3px solid #454e56;padding:11px;background:#111519}.message.player{border-left-color:#8b949e;background:#15191d}.message-body{flex:1;min-width:0}.role{margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.55}
.message.reading{outline:1px solid #77828c}
.dialogue-avatar{width:2.8rem;height:2.8rem;flex:none;object-fit:cover;border:1px solid #2b3137;border-radius:.35rem;background:#090c0f}
.dialogue-avatar-crop{width:2.8rem;height:2.8rem;flex:none;overflow:hidden;padding:0;position:relative}
.dialogue-avatar-crop>img{display:block;height:385%;width:auto;max-width:none;position:relative;left:50%;transform:translateX(-50%)}
body.fast-read *,body.fast-read *::before,body.fast-read *::after{animation-duration:.01s!important;transition-duration:.01s!important}
.choice-deck{margin-top:10px;border-top:1px solid #252b31;padding-top:10px}.choice-deck-tools{display:flex;flex-wrap:wrap;gap:8px}.choices{display:grid;gap:8px;margin-top:8px}.choices[hidden]{display:none}.choice{text-align:left}
.composer{display:grid;gap:8px;padding:10px 0 0}textarea{min-height:80px;background:#090c0f;color:white;border:1px solid #30373e;padding:10px}
.status{border-top:1px solid #252b31;padding:10px 0 0;margin-top:10px;color:#9aa4ad;font-size:12px}
.intel-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:119}.intel-scrim[hidden]{display:none}
.intel-panel{position:fixed;top:0;right:0;z-index:120;width:min(420px,92vw);height:100dvh;background:#0e1114;border-left:1px solid #2b3137;transform:translateX(105%);visibility:hidden;transition:transform 260ms ease,visibility 260ms ease;display:flex;flex-direction:column}
body.intel-open .intel-panel{transform:none;visibility:visible}
.intel-header{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #2b3137}.intel-header h2{margin:0;font-size:15px;letter-spacing:.08em}
.intel-scroll{overflow:auto;padding:10px;display:grid;gap:10px;align-content:start}
.card{border:1px solid #2b3137;background:#0e1114;padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}
.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}.chips .chip{border:1px solid #313940;padding:5px 7px;font-size:12px;font-weight:400}
.profile-card{display:flex;gap:12px;width:100%;padding:12px;border:1px solid #2b3137;background:#0b0d0f;color:inherit;text-align:left;cursor:pointer}
.portrait-frame{width:84px;height:84px;flex:none;overflow:hidden;border:1px solid #2b3137}.portrait-frame img{width:100%;height:100%;object-fit:cover}
.micro-label{margin:0;color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em}
.profile-copy h2{margin:4px 0;font-size:17px}.profile-copy h2 span{color:#8f9aa4;font-size:12px;font-weight:500}.profile-copy p{margin:0;color:#9aa4ad;font-size:12px;line-height:1.45}
.profile-list{display:grid;gap:8px}.profile-list button{text-align:left}
.backlog-overlay{position:fixed;inset:0;z-index:130;display:grid;place-items:center}.backlog-overlay[hidden]{display:none}
.backlog-scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.backlog-card{position:relative;width:min(680px,94vw);max-height:86dvh;overflow:auto;background:#0e1114;border:1px solid #2b3137;padding:16px}
.backlog-head{display:flex;justify-content:space-between;align-items:center}.backlog-head h2{margin:0;font-size:16px}.backlog-note{color:#9aa4ad;font-size:12px}
.backlog-list{display:grid;gap:10px}.backlog-item{border-left:3px solid #454e56;padding:8px 10px;background:#111519;font-size:13px;white-space:pre-wrap;line-height:1.5}.backlog-item.player{border-left-color:#8b949e}
.character-overlay{position:fixed;inset:0;z-index:140;display:grid;place-items:center}.character-overlay[hidden]{display:none}
.character-overlay-scrim{position:absolute;inset:0;background:rgba(0,0,0,.65);border:0;padding:0}
.character-overlay-card{position:relative;width:min(560px,94vw);max-height:88dvh;overflow:auto;background:#0e1114;border:1px solid #2b3137;padding:16px}
.character-overlay-close{position:absolute;top:8px;right:8px;z-index:2;padding:6px 10px}
.character-overlay-portrait img{width:100%;max-height:300px;object-fit:cover;object-position:50% 25%;display:block}
.character-overlay-copy h2{margin:6px 0;font-size:22px}.character-overlay-copy h2 span{color:#8f9aa4;font-size:13px;font-weight:500}
.character-overlay-copy p{color:#c9d1d8;line-height:1.55}
</style>
</head>
<body>
<main class="shell">
<header class="campaign-header">
<button id="intel-toggle" class="burger-toggle" type="button" aria-label="Hồ sơ" aria-controls="intel-panel" aria-expanded="false"><span class="burger-line"></span><span class="burger-line"></span><span class="burger-line"></span><span class="burger-text">Hồ sơ</span></button>
<div><div class="eyebrow">BACKROOM TEXT GAME</div><h1 id="title"></h1></div>
<div class="turn">TURN <strong id="turn"></strong></div>
</header>
<section id="snapshot" class="snapshot-stage" aria-label="Khung Snapshot minh họa">
<div class="stage-bg"><div id="stage-background"></div></div>
<div class="stage-figure" id="stage-entity-figure"><img id="stage-entity" src="entity/smiler.png" alt="" aria-hidden="true"><span class="stage-nameplate" id="stage-entity-name"></span></div>
<div class="stage-figure" id="stage-companion-figure"><img id="stage-companion" src="entity/smiler.png" alt="" aria-hidden="true"><span class="stage-nameplate" id="stage-companion-name"></span></div>
<div class="stage-character-wrap">
<span class="stage-sword stage-sword-a" aria-hidden="true"><img src="cao_minh_sword_demon_face.png" alt=""></span>
<span class="stage-sword stage-sword-b" aria-hidden="true"><img src="cao_minh_sword_red_core.png" alt=""></span>
<img id="stage-character" src="cao_minh_snapshot_overlay.png" alt="Cao Minh">
</div>
<div class="stage-caption"><span id="stage-scene-name"></span></div>
</section>
<section class="story-panel" id="story-panel">
<div class="log" id="log"></div>
<section class="choice-deck" aria-label="Thao tác">
<div class="choice-deck-tools">
<button id="actions-toggle" type="button" aria-expanded="true">Thao Tác</button>
<button id="backlog-open" type="button">Lịch sử đọc</button>
<button id="auto-toggle" type="button" aria-pressed="false">Tự chạy</button>
<button id="skip-toggle" type="button" aria-pressed="false">Đọc nhanh</button>
</div>
<div id="choices" class="choices">
<button type="button" class="choice" data-action="xem inventory">Xem inventory</button>
<button type="button" class="choice" data-action="xem đội hình">Xem đội hình</button>
</div>
</section>
<form class="composer" id="form"><textarea id="action" placeholder="Cao Minh làm gì trong Turn hiện tại?" rows="3"></textarea><button id="submit">THỰC HIỆN</button></form>
<div class="status" id="status"></div>
</section>
</main>
<div id="intel-scrim" class="intel-scrim" hidden></div>
<aside id="intel-panel" class="intel-panel" aria-label="Hồ sơ" aria-hidden="true">
<header class="intel-header"><h2>HỒ SƠ</h2><button id="intel-close" type="button" aria-label="Đóng hồ sơ">×</button></header>
<div class="intel-scroll">
<button class="profile-card" type="button" data-profile-open="cao_minh">
<span class="portrait-frame"><img src="avatars/cao_minh_avatar.jpg" alt="Chân dung Cao Minh, tôn hiệu Vạn Giới Ma Tổ"></span>
<span class="profile-copy"><span class="micro-label">ĐẠO TỔ · VẠN MA ĐẠO MÔN</span><h2>Cao Minh <span>/ Vạn Giới Ma Tổ</span></h2><p>Đạo Tổ · song kiếm Thái Cổ Song Sát · Hắc Long Chiến Khải</p></span>
</button>
<div class="card"><h2>Trạng thái</h2><div class="row"><b>Vị trí</b><span id="location"></span></div><div class="row"><b>Chế độ</b><span id="mode"></span></div><div class="row"><b>Nhân vật</b><span id="player"></span></div></div>
<div class="card"><h2>Party</h2><div class="chips" id="party"></div></div>
<div class="card"><h2>Inventory</h2><div class="chips" id="inventory"></div></div>
<div class="card"><h2>Hồ sơ nhân vật</h2><div class="profile-list">
<button type="button" data-profile-open="cao_minh">Cao Minh</button>
<button type="button" data-profile-open="iris">Iris</button>
<button type="button" data-profile-open="syvial">Syvial</button>
<button type="button" data-profile-open="lucia">Lucia</button>
</div></div>
<div class="card"><h2>Save / Load</h2><div class="actions"><button onclick="save()">Lưu</button><button onclick="load()">Tải</button><button class="wide" onclick="resetGame()">Bắt đầu lại từ đầu</button><button class="wide danger" onclick="clearSave()">Xóa save trên máy</button></div></div>
</div>
</aside>
<div id="backlog-overlay" class="backlog-overlay" hidden>
<div class="backlog-scrim"></div>
<section class="backlog-card" role="dialog" aria-modal="true" aria-labelledby="backlog-title">
<header class="backlog-head"><h2 id="backlog-title">Lịch sử đọc</h2><button id="backlog-close" type="button" aria-label="Đóng lịch sử đọc">×</button></header>
<p class="backlog-note">Nguyên văn những gì đã hiển thị trong lượt chơi này — giữ tối đa 200 mục gần nhất.</p>
<div id="backlog-list" class="backlog-list"></div>
</section>
</div>
<div id="character-overlay" class="character-overlay" hidden>
<button class="character-overlay-scrim" type="button" aria-label="Đóng hồ sơ nhân vật"></button>
<section class="character-overlay-card" role="dialog" aria-modal="true" aria-labelledby="character-overlay-name">
<button id="character-overlay-close" class="character-overlay-close" type="button" aria-label="Đóng hồ sơ nhân vật">×</button>
<div class="character-overlay-portrait"><img id="character-overlay-image" src="avatars/cao_minh_avatar.jpg" alt="Cao Minh"></div>
<div class="character-overlay-copy">
<p id="character-overlay-role" class="micro-label"></p>
<h2 id="character-overlay-name"><span id="character-overlay-name-text"></span> <span id="character-overlay-alias"></span></h2>
<p id="character-overlay-summary"></p>
</div>
</section>
</div>
<script>
const prologue=`Yến tiệc đêm ấy, mở đầu cũng như bao đêm khác.

Hoa Mãn Lâu là tửu lâu cao nhất trấn, tầng cao nhất tĩnh lặng đến độ nghe rõ tiếng chén khua vào đĩa, song chưa đến mức khiến người ta phải hạ thấp giọng. Ngoài dãy lan can chạm trổ, đèn hoa khắp trấn trải dài phía dưới, điểm từng vệt sáng đỏ vàng lên nền đêm. Thị nữ qua lại nhẹ nhàng không tiếng động, chỉ khi một bình rượu được đặt xuống mặt bàn, Cao Minh mới hay có người vừa đến bên.

Hắn đang cắt nốt miếng thịt cuối trong đĩa, chợt nhận ra Tử Xích Lão Quân lại đang nhìn sang.

Cao Minh vẫn cúi đầu, ung dung như thường.

“Lão có nhìn nữa cũng vô ích. Miếng cuối này, há lại tự chạy sang đĩa của lão sao?”

Tử Xích Lão Quân nhướng mày. “Ai nói lão phu nhìn miếng thịt?”

“Vậy là bổn tọa hiểu lầm rồi.”

“Phải. Lão phu chỉ lấy làm lạ, vì cớ gì Đạo Tổ giữ miếng cuối đến tận bây giờ, như sợ có kẻ tranh mất vậy.”

Cao Minh gắp miếng thịt lên, thản nhiên ăn trước mặt lão. “Giờ hết thắc mắc chưa?”

Tử Xích Lão Quân ngó chiếc đĩa đã trống, lại ngó hắn. “Đạo Tổ làm vậy, chẳng qua chỉ để chọc lão phu, phải không?”

Trương Lão đặt bình rượu xuống, khóe miệng hơi động. “Muốn ăn thì gọi thêm một đĩa. Chớ nhìn đĩa của Đạo Tổ mãi như thế.”

“Ta nào có nhìn mãi.”

“Đủ lâu để người cùng bàn đều nhận ra rồi.”

Tử Xích Lão Quân quay sang. “Ngươi đếm đấy à?”

“Không cần đếm.”

Cao Minh tựa lưng vào ghế, mặc cho hai người nhìn nhau qua mặt bàn. “Bổn tọa đề nghị đổi sang chuyện khác, kẻo bữa tiệc này lại hóa thành một cuộc tra hỏi về quyền sở hữu thức ăn.”

Tử Xích Lão Quân chống cằm. “Muộn rồi. Chuyện này, lão phu sẽ ghi nhớ.”

“Sổ nợ của lão, vẫn còn chỗ trống sao?”

“Ngài cứ việc tiếp tục thử.”

Cao Minh khẽ bật cười. Trương Lão lắc đầu, song thần sắc cũng đã dịu đi nhiều so với lúc mới nhập tiệc.

Chợt, lửa trong dãy đèn lồng đồng loạt lụi xuống, rồi lại bùng lên.

Khắp lầu, không một ai phản ứng. Thị nữ vẫn nghiêng bình rót rượu, dòng rượu đỏ sẫm chảy đều vào chén. Tiếng đàn sáo từ tầng dưới vẫn vọng lên không ngớt, chỉ có một nốt trầm vừa rồi nghe hơi lạc đi.

Cao Minh ngước mắt lên.

Lửa trong đèn lồng lại lụi xuống lần thứ hai.

Lần này, Tử Xích Lão Quân cũng dừng tay. Lão chẳng nhìn lên đèn, mà ngoảnh về phía góc lầu, như đang cố truy tìm một thanh âm vừa lạc khỏi chỗ của nó.

“Đạo Tổ.”

“Bổn tọa nghe thấy rồi.”

Tử Xích Lão Quân thu lại nét cười. Sắc mặt lão biến đổi rất nhanh; vẻ thư thả mới một khắc trước đã tan biến, ánh mắt quét khắp tửu lâu.

Cao Minh chẳng nghe thấy tiếng động lạ nào rõ rệt. Điều khiến hắn lưu tâm là những thanh âm vốn phải có đang dần mất đi phần vang của chúng. Tiếng người trò chuyện ở bàn gần nhất trở nên bằng phẳng đến khó chịu. Tiếng đàn vẫn chảy, song những nốt thấp kéo dài như bị bóp nghẹt. Ngay cả tiếng chén đĩa khua nhau cũng nghe gần hơn khoảng cách thực tế rất nhiều.

Một lão khách ngồi cách đó vài bàn đang nói dở câu, bỗng khựng lại. Chiếc chén trong tay ông ta trượt khỏi những ngón tay.

Cao Minh theo phản xạ nhìn sang.

Chiếc chén rơi xuống mới được nửa quãng, đã biến mất.

Chẳng vỡ. Chẳng bị hất sang bên. Cũng chẳng có ánh sáng hay làn khói nào che khuất. Một khoảnh khắc trước nó vẫn còn đó, khoảnh khắc sau, chỉ còn lại khoảng không.

Cao Minh lập tức đứng dậy.

“Đứng lên. Rời khỏi nơi này.”

Trương Lão đã rời ghế trước cả khi hắn dứt lời. Tử Xích Lão Quân cũng đứng lên theo, mắt vẫn quét khắp mặt sàn cùng các lối ra.

Song bọn họ chẳng kịp bước đi bước nào.

Mặt sàn dưới chân Cao Minh không nứt, không sập, cũng chẳng hề rung động. Nó chỉ đột nhiên thôi không nâng đỡ thân thể hắn nữa.

Bàn chân hắn xuyên qua lớp ván gỗ, tựa xuyên qua một ảo ảnh không có khối lượng.

Cao Minh giật tay về phía mép bàn, những ngón tay chỉ kịp quệt qua cạnh bàn trước khi cả người rơi xuống. Phía trên, Trương Lão lao tới, bàn tay gần như đã chạm được vào vạt áo hắn. Tử Xích Lão Quân cũng vươn tay theo, nhưng đúng khoảnh khắc ấy, khoảng không quanh Cao Minh bỗng gập lại, như thể chính nơi đó vừa bị rút đi mất; hai người bị một luồng lực vô hình đẩy bật lại nửa bước.

Khoảnh khắc cuối cùng Cao Minh còn trông thấy Hoa Mãn Lâu, chỉ là một mớ hình ảnh nghiêng lệch: chiếc bàn trượt khỏi tầm mắt, bàn tay Trương Lão đưa ra mà không chạm tới, tay áo tím của Tử Xích Lão Quân quét qua khoảng không, và những thực khách ở xa vẫn chưa hiểu chuyện gì đang xảy ra.

Rồi ánh sáng vụt tắt.

Không có cảm giác rơi tự do. Không có gió quất vào người, không có lực kéo mỗi lúc một tăng, cũng chẳng còn khái niệm rõ ràng về trên dưới. Theo bản năng, thần thức của hắn vươn ra tìm một điểm tựa, liền bị cắt cụt giữa chừng, tựa một sợi dây bị kẻ nào lặng lẽ cắt đứt. Thân thể Cao Minh vẫn còn đó, song khoảng cách xung quanh hắn dường như chẳng còn được đo theo cách quen thuộc nữa.

Cảm giác ấy kéo dài chưa đầy một nhịp tim.

Trọng lực đột ngột trở lại.

Cao Minh chạm xuống một bề mặt mềm hơn sàn lầu. Hắn theo phản xạ hạ thấp trọng tâm, đứng vững ngay tức khắc, thân hình không hề loạn.

Mùi ẩm mốc xộc đến trước tiên.

Kế đó là mùi giấy cũ, mùi bụi, mùi keo dán, cùng một thứ mùi hóa chất tẩy rửa nhạt đến mức chỉ còn vương lại trong không khí. Trên đỉnh đầu là một hàng vật dài tỏa ánh sáng trắng nhợt, kèm tiếng ù đều đều lấp kín cả căn phòng. Cao Minh chẳng biết thứ đó là gì — chúng sáng mà không cần lửa, kêu mà bên trong chẳng có gì.

Cao Minh đứng thẳng người dậy.

Hoa Mãn Lâu đã biến mất.

Quanh hắn là những bức tường phủ giấy màu vàng nhạt, hoa văn lặp lại đến phát ngấy. Tấm thảm dưới chân ẩm lạnh, dù chẳng thấy nước chảy từ đâu. Trần nhà ghép bằng những tấm vuông giống hệt nhau, kéo dài qua các ô cửa mở sang những căn phòng kế tiếp.

Không cửa sổ. Không bàn ghế. Cũng không còn dấu vết nào của trấn nhỏ dưới chân núi.

Và không có Tử Xích Lão Quân, cũng không có Trương Lão.

Cao Minh xoay người một vòng, xem kỹ từng lối mở, rồi mới cất tiếng gọi.

“Tử Xích Lão Quân?”

Đáp lại chỉ có tiếng ù của những vật phát sáng kia.

“Trương Lão?”

Giọng hắn truyền qua hai căn phòng, dội lại rất yếu, rồi chìm hẳn vào một khoảng không không thấy điểm cuối.

Cao Minh không gọi lần thứ ba. Hắn chuyển sang truyền âm.

Truyền âm phát ra, chẳng nhận được hồi đáp. Ngọc phù liên lạc vẫn còn ấm, linh quang chưa tắt, vậy mà không một dao động nào trả về. Thần thức của hắn vươn ra xa hơn, liền mỏng dần đi, như bị thứ gì lặng lẽ nuốt lấy; vừa chạm tới vách tường trước mặt đã như đâm vào một lớp bông dày, không sao đi xa hơn được nữa.

Hắn kiểm tra lại từng thứ một lần nữa, lần này phân tách rõ ràng: ngọc phù hỏng, hay là đường truyền đã hỏng.

Kết quả vẫn không đổi.

Đây chẳng giống truyền âm quá yếu. Cũng chẳng giống một vùng cấm chế thông thường. Không dao động méo mó, không hồi âm giả tạo, cũng không chút dấu hiệu cho thấy đầu bên kia đã nhận được lời gọi rồi bất lực không trả lời nổi.

Chỉ có im lặng.

Song kiếm vẫn ở sau lưng hắn. Thái Cổ Song Sát, hai thanh lơ lửng đúng vị trí cũ; Hắc Long Chiến Khải trên người không một vết xước. Ít nhất, thứ vừa nuốt chửng hắn vẫn chưa lấy được gì của hắn — hoặc là chưa lấy.

Chưa đầy một phút trước, hai người kia còn ở trong tầm tay hắn. Cao Minh đã trông thấy bàn tay Trương Lão gần chạm được vạt áo mình, ngay trước khi khoảng không gập lại. Đó là điều duy nhất hắn có thể chắc chắn.

Hắn không biết giờ hai người họ đang ở đâu.

Không biết họ còn ở phía bên kia, hay cũng đã bị đưa tới một nơi nào khác.

Không biết từ phía Hoa Mãn Lâu, liệu có ai lần ra được dấu vết của hắn hay không.

Không dấu tích nào để đối chiếu. Không hồi âm nào để lần theo. Và trước mắt, chẳng có lời giải thích nào cho căn phòng vàng vô tận đang mở ra quanh hắn.

Cao Minh đứng yên thêm mấy giây, lắng nghe.

Tiếng ù vẫn đều đều trên đỉnh đầu. Tấm thảm vẫn ẩm dưới đế giày. Phía trước, một hành lang rẽ sang trái sau lớp tường vàng; bên phải là một ô cửa khác, dẫn vào căn phòng gần như giống hệt nơi hắn đang đứng.

Không có tiếng gọi nào đáp lại.

Cao Minh khẽ cười. “Lâu lắm rồi, mới có một nơi dám không trả lời bổn tọa.”

Cao Minh chỉ còn lại những gì đang mang theo bên mình, những gì chính mắt hắn có thể kiểm chứng, cùng một việc phải làm trước tiên: xác định nơi này rốt cuộc là đâu. Còn Tử Xích Lão Quân và Trương Lão đang ở đâu, và thứ vừa mở ra dưới chân hắn là gì, đều là những câu hỏi để lại về sau.`;

actionsToggle.addEventListener("click",()=>{const show=choicesEl.hidden;choicesEl.hidden=!show;actionsToggle.setAttribute("aria-expanded",show?"true":"false")});
choicesEl.addEventListener("click",e=>{const b=e.target.closest?e.target.closest("[data-action]"):null;if(!b)return;actionEl.value=b.getAttribute("data-action");if(formEl.requestSubmit)formEl.requestSubmit();else formEl.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))});
let autoOn=false,autoTimer=null,readIdx=0;
const autoToggle=byId("auto-toggle"),skipToggle=byId("skip-toggle");
function stopAuto(){autoOn=false;autoToggle.setAttribute("aria-pressed","false");if(autoTimer){clearInterval(autoTimer);autoTimer=null}logEl.querySelectorAll(".reading").forEach(n=>n.classList.remove("reading"))}
function stepAuto(){const items=logEl.querySelectorAll("article");if(!items.length||readIdx>=items.length){stopAuto();return}logEl.querySelectorAll(".reading").forEach(n=>n.classList.remove("reading"));const el=items[readIdx++];el.classList.add("reading");if(el.scrollIntoView)el.scrollIntoView({block:"nearest"})}
function autoInterval(){return document.body.classList.contains("fast-read")?400:2600}
autoToggle.addEventListener("click",()=>{if(autoOn){stopAuto();return}autoOn=true;autoToggle.setAttribute("aria-pressed","true");readIdx=0;stepAuto();autoTimer=setInterval(stepAuto,autoInterval())});
skipToggle.addEventListener("click",()=>{const on=document.body.classList.toggle("fast-read");skipToggle.setAttribute("aria-pressed",on?"true":"false");logEl.scrollTop=logEl.scrollHeight;if(autoOn){clearInterval(autoTimer);autoTimer=setInterval(stepAuto,autoInterval())}});
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=JSON.parse(json);state.characterCanon=CURRENT_CHARACTER_CANON;actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi: "+message};
render();
</script>
</body>
</html>
