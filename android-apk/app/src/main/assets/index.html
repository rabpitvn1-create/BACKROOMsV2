const byId=id=>document.getElementById(id);
const titleEl=byId("title"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),profileListEl=byId("profile-list"),logEl=byId("log"),statusEl=byId("status");
const stageBgEl=byId("stage-background"),entityFigEl=byId("stage-entity-figure"),entityImgEl=byId("stage-entity"),entityNameEl=byId("stage-entity-name"),companionFigEl=byId("stage-companion-figure"),companionImgEl=byId("stage-companion"),companionNameEl=byId("stage-companion-name"),charImgEl=byId("stage-character"),captionEl=byId("stage-scene-name"),swordAEl=document.querySelector(".stage-sword-a"),swordBEl=document.querySelector(".stage-sword-b");
const kickerEl=byId("scene-kicker"),progressEl=byId("scene-progress");
const V=window.__V||"";

const buildIdEl=byId("build-id"),gameLayoutEl=byId("game-layout");
function newRunId(){return"run-"+Date.now().toString(36)+"-"+Math.floor(Math.random()*1e6).toString(36)}
let saveBlocked=false;
function migrateState(){
  // Additive v2 history migration: the legacy per-line history is kept
  // verbatim; per-scene history (historyFormat 2) only records from here.
  try{
    if(state.historyFormat===2&&Array.isArray(state.sceneHistory)&&state.runId)return;
    state.historyFormat=2;
    if(!Array.isArray(state.sceneHistory))state.sceneHistory=[];
    if(!state.runId)state.runId=newRunId();
    if(typeof state.legacyHistoryCount!=="number")state.legacyHistoryCount=(state.history||[]).length;
  }catch(e){saveBlocked=true;statusEl.textContent="Không bổ sung được định dạng lịch sử mới — đã chặn ghi đè để bảo toàn save cũ."}
}
function resetReaderScroll(){
  // .game-layout is the reading scroller; the page itself is fixed (Hui mechanism).
  if(!gameLayoutEl)return;
  gameLayoutEl.scrollTop=0;
  window.requestAnimationFrame(()=>{gameLayoutEl.scrollTop=0});
}
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

state.characterCanon=CURRENT_CHARACTER_CANON;
// Save format v2 is fixed-scene progress ({scene, flags, history}); any older
// turn/log save is discarded and play restarts at the first scene.
if(!state||state.v!==2||!Array.isArray(state.history))state=JSON.parse(JSON.stringify(initial));
if(state===initial)state=JSON.parse(JSON.stringify(initial));
migrateState();
loadStory().then(function(){
  if(state.scene&&scenesById[state.scene]){ensureSceneEntry();render()}
  else{state.history=[];state.sceneHistory=[];enterScene(story.start)}
},function(){statusEl.textContent="Không tải được dữ liệu truyện (story/opening-chapter.json)."});
localStorage.setItem("backroom-apk-state",JSON.stringify(state));

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function profileKeyOf(name){const n=String(name||"").toLowerCase();if(n.includes("cao minh"))return"cao_minh";if(n.includes("hạ liên"))return"ha_lien";if(n.includes("iris"))return"iris";if(n.includes("syvial"))return"syvial";if(n.includes("lucia")||n.includes("thuý mai")||n.includes("thúy mai"))return"lucia";return""}
function partyChips(items){if(!items||!items.length)return"<span>Trống.</span>";return items.map(x=>{const name=typeof x==="string"?x:x.name||"—";const k=profileKeyOf(name);return k?"<button type='button' class='chip' data-profile-open='"+k+"'>"+esc(name)+"</button>":"<span>"+esc(name)+"</span>"}).join("")}
// shortcut: L8 reuses the L7 background by plan; L9 has its own asset
function levelOf(loc){const m=/level\s*(\d+)/i.exec(String(loc||""));if(!m)return 0;const n=Math.min(9,Math.max(0,parseInt(m[1],10)));return n===8?7:n}
function flagKey(v){if(!v)return"";const raw=typeof v==="string"?v:(v.id||v.key||v.name||"");return String(raw).toLowerCase().trim().replace(/\s+/g,"_")}
function flagName(v){const raw=v&&typeof v==="object"&&v.name?String(v.name):flagKey(v).replace(/[_-]+/g," ");return raw?raw.replace(/\b\w/g,c=>c.toUpperCase()):""}
function entitySrc(k){return"entity/"+k+(k==="hound"?".webp":".png")+V}
// Companion overlays follow the avatar resolver's convention: a profiled
// character's non-portrait profile image IS the overlay file; unprofiled
// generics resolve by the <key>_overlay.webp naming convention.
function companionSrc(k){const p=PROFILES[k];return p&&p.image.indexOf("avatars/")!==0?p.image+V:k+"_overlay.webp"+V}
let stagePose="";
function renderStage(){
  const bgSrc="level_snapshots/level_"+levelOf(state.location)+".webp"+V;
  if(stageBgEl.getAttribute("src")!==bgSrc)stageBgEl.src=bgSrc;
  captionEl.textContent=state.location||"";
  const flags=state.flags||{};
  const ek=flagKey(flags.entity)||flagKey(flags.encounter);
  const ck=flagKey(flags.companion);
  const encounter=!!ek;
  if(encounter){entityImgEl.src=entitySrc(ek);entityNameEl.textContent=flagName(flags.entity||flags.encounter);entityFigEl.classList.add("stage-entity-on")}else{entityFigEl.classList.remove("stage-entity-on")}
  if(ck&&ck!==ek){companionImgEl.src=companionSrc(ck);companionNameEl.textContent=(PROFILES[ck]&&PROFILES[ck].name)||flagName(flags.companion);companionFigEl.classList.add("stage-companion-on");companionFigEl.classList.toggle("stage-companion-shifted",encounter)}else{companionFigEl.classList.remove("stage-companion-on","stage-companion-shifted")}

  if(stagePose!==pose){stagePose=pose;charImgEl.classList.add("is-swapping");setTimeout(()=>{charImgEl.src=pose+V;charImgEl.classList.remove("is-swapping")},160)}
}
function initialsFor(name){const w=String(name||"?").trim().split(/\s+/).filter(Boolean);return w.length?w.slice(0,2).map(x=>x[0].toUpperCase()).join(""):"?"}
// Dialogue avatars resolve from PROFILES data (Hui model): a dedicated
// portrait under avatars/ is used as-is; any other profile image is the
// character's full-body overlay, shown through the shoulder-to-head crop
// frame. A speaker with no profile entry gets an initials fallback.
function avatarHtml(speaker){
  const p=Object.values(PROFILES).find(x=>x.name===speaker);
  if(!p)return"<span class='dialogue-avatar dialogue-avatar-fallback' role='img' aria-label='Avatar của "+esc(speaker)+"'>"+esc(initialsFor(speaker))+"</span>";
  if(p.image.indexOf("avatars/")===0)return"<img class='dialogue-avatar' src='"+p.image+V+"' alt='"+esc(p.name)+"'>";
  return"<span class='dialogue-avatar-crop'><img src='"+p.image+V+"' alt='"+esc(p.name)+"'></span>";
}
function lineHtml(x){
  if(!x.speaker)return"<article class='story-line'><div class='text'>"+esc(x.text)+"</div></article>";
  return"<article class='dialogue'>"+avatarHtml(x.speaker)+"<div class='message-body'><span class='speaker'>"+esc(x.speaker)+"</span><div class='text'>"+esc(x.text)+"</div></div></article>";
}
function visibleLines(sc){return sc.lines.filter(function(ln){return !ln.if||Object.keys(ln.if).every(function(k){return state.flags[k]===ln.if[k]})})}
let lastRenderedScene=null;
function render(){
  titleEl.textContent=state.title;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Cao Minh";partyEl.innerHTML=partyChips(state.party);inventoryEl.innerHTML=chips(state.inventory);
  // Drawer profile buttons are generated from PROFILES: a character gets a button exactly when it has a profile entry.
  profileListEl.innerHTML=Object.keys(PROFILES).map(k=>"<button type='button' data-profile-open='"+k+"'>"+esc(PROFILES[k].name)+"</button>").join("");
  // Hui model: the story frame holds ONLY the current scene's segment;
  // everything already read lives in state.history (backlog + save).
  const sc=story&&state.scene?scenesById[state.scene]:null;
  logEl.innerHTML=(sc?visibleLines(sc):(state.history||[])).map(lineHtml).join("");
  kickerEl.textContent=sc?"BACKROOMS // "+String(state.location||"").toUpperCase():"";
  progressEl.textContent=sc?String(sceneIndex[sc.id]||0).padStart(2,"0"):"00";
  if(buildIdEl)buildIdEl.textContent=document.documentElement.dataset.build||"unversioned";
  if(sc&&lastRenderedScene!==sc.id){lastRenderedScene=sc.id;resetReaderScroll()}
  renderChoices();renderStage();scheduleAuto();
}
let story=null;const scenesById={};const sceneIndex={};
function loadStory(){
  const got=(typeof fetch==="function")?fetch("story/opening-chapter.json"+V).then(function(r){if(!r.ok)throw new Error("story http");return r.json()}):Promise.reject(new Error("no fetch"));
  return got.catch(function(){return new Promise(function(res,rej){const x=new XMLHttpRequest();x.open("GET","story/opening-chapter.json"+V);x.onload=function(){try{res(JSON.parse(x.responseText))}catch(e){rej(e)}};x.onerror=rej;x.send()})}).then(function(data){story=data;data.scenes.forEach(function(sc,i){scenesById[sc.id]=sc;sceneIndex[sc.id]=i+1});return data});
}
let currentEntry=-1;
function sceneTitle(sc){return"BACKROOMS // LEVEL "+sc.stage.level+" — CẢNH "+String(sceneIndex[sc.id]||0).padStart(2,"0")}
function beginSceneEntry(sc){
  if(!state.runId)state.runId=newRunId();
  if(!Array.isArray(state.sceneHistory))state.sceneHistory=[];
  state.sceneHistory.push({sceneId:sc.id,title:sceneTitle(sc),lines:visibleLines(sc).map(ln=>({speaker:ln.speaker||"",text:ln.text})),selectedChoice:null,runId:state.runId});
  if(state.sceneHistory.length>200)state.sceneHistory=state.sceneHistory.slice(-200);
  currentEntry=state.sceneHistory.length-1;
}
function ensureSceneEntry(){
  const sc=story&&state.scene?scenesById[state.scene]:null;if(!sc)return;
  const last=Array.isArray(state.sceneHistory)?state.sceneHistory[state.sceneHistory.length-1]:null;
  if(last&&last.sceneId===sc.id){currentEntry=state.sceneHistory.length-1;return}
  beginSceneEntry(sc);
}
function enterScene(id){
  const sc=scenesById[id];if(!sc)return;
  state.scene=id;state.location="Level "+sc.stage.level;state.flags.entity=sc.stage.entity||null;state.flags.companion=sc.stage.companion||null;
  for(const ln of visibleLines(sc))state.history.push({speaker:ln.speaker||"",text:ln.text});
  beginSceneEntry(sc);
  save();render();
}
function choose(c,idx){
  const e=Array.isArray(state.sceneHistory)?state.sceneHistory[currentEntry]:null;
  if(e&&e.sceneId===state.scene)e.selectedChoice={choiceIndex:idx,choiceLabel:c.label,nextSceneId:c.next,choiceSet:c.set?JSON.parse(JSON.stringify(c.set)):null};
  if(c.set)state.flags=Object.assign({},state.flags,c.set);
  enterScene(c.next);
}
function restart(){stopPlayback();state=JSON.parse(JSON.stringify(initial));currentEntry=-1;if(story)enterScene(story.start);else render()}
function renderChoices(){
  const sc=story&&state.scene?scenesById[state.scene]:null;
  if(!sc){choicesEl.innerHTML="";return}
  if(!sc.choices.length){choicesEl.innerHTML="<div class='text'>— Hết phần nội dung hiện có —</div><button type='button' class='choice' data-restart='1'>Đọc lại từ đầu</button>";return}
  choicesEl.innerHTML=sc.choices.map(function(c,i){return"<button type='button' class='choice' data-choice='"+i+"'>"+esc(c.label)+"</button>"}).join("");
}
function save(){if(saveBlocked)return;localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu tiến trình trên máy."}
function load(){const s=JSON.parse(localStorage.getItem("backroom-apk-state")||"null");state=s&&s.v===2&&Array.isArray(s.history)?s:JSON.parse(JSON.stringify(initial));state.characterCanon=CURRENT_CHARACTER_CANON;currentEntry=-1;migrateState();ensureSceneEntry();render();resetReaderScroll()}
function resetGame(){if(confirm("Bắt đầu lại từ đầu?"))restart()}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");restart()}}
function curState(){try{return state}catch(e){return null}}
const overlayEl=byId("character-overlay"),ovImg=byId("character-overlay-image"),ovRole=byId("character-overlay-role"),ovNameText=byId("character-overlay-name-text"),ovAlias=byId("character-overlay-alias"),ovSummary=byId("character-overlay-summary");
let lastProfileOpener=null;
function openProfile(key){const p=PROFILES[key];if(!p)return;ovImg.src=p.image+V;ovImg.alt=p.name;ovRole.textContent=p.role;ovNameText.textContent=p.name;ovAlias.textContent=p.alias?"/ "+p.alias:"";ovSummary.textContent=p.summary;overlayEl.hidden=false;setTimeout(()=>byId("character-overlay-close").focus(),50)}
function closeProfile(){overlayEl.hidden=true;if(lastProfileOpener)lastProfileOpener.focus({preventScroll:true})}
document.addEventListener("click",e=>{const t=e.target.closest?e.target.closest("[data-profile-open]"):null;if(t){lastProfileOpener=t;openProfile(t.getAttribute("data-profile-open"))}});
byId("character-overlay-close").addEventListener("click",closeProfile);
overlayEl.querySelector(".character-overlay-scrim").addEventListener("click",closeProfile);
entityImgEl.addEventListener("error",()=>entityFigEl.classList.remove("stage-entity-on"));
companionImgEl.addEventListener("error",()=>companionFigEl.classList.remove("stage-companion-on"));
const intelPanel=byId("intel-panel"),intelScrim=byId("intel-scrim"),intelToggle=byId("intel-toggle");
function setIntel(open){document.body.classList.toggle("intel-open",open);intelPanel.setAttribute("aria-hidden",open?"false":"true");intelToggle.setAttribute("aria-expanded",open?"true":"false");intelScrim.hidden=!open;if(open)setTimeout(()=>byId("intel-close").focus(),50);else intelToggle.focus({preventScroll:true})}
intelToggle.addEventListener("click",()=>setIntel(!document.body.classList.contains("intel-open")));
byId("intel-close").addEventListener("click",()=>setIntel(false));
intelScrim.addEventListener("click",()=>setIntel(false));
const backlogEl=byId("backlog-overlay"),backlogList=byId("backlog-list");
function backlogLine(x){return"<div class='backlog-item'>"+(x.speaker?"<span class='speaker'>"+esc(x.speaker)+"</span>":"")+esc(x.text)+"</div>"}
function openBacklog(){
  const s=curState();const parts=[];
  const hist=s&&Array.isArray(s.history)?s.history:[];
  const legacy=s&&typeof s.legacyHistoryCount==="number"?Math.min(s.legacyHistoryCount,hist.length):0;
  if(legacy>0)parts.push("<p class='backlog-note'>Lịch sử kế thừa — phần đọc trước khi lịch sử được ghi theo cảnh; không có ranh giới cảnh chính xác.</p>",hist.slice(0,legacy).map(backlogLine).join(""));
  const entries=s&&Array.isArray(s.sceneHistory)?s.sceneHistory:[];
  for(const e of entries){
    const body=e.lines.map(ln=>(ln.speaker?ln.speaker+": ":"")+ln.text).join("\n")+(e.selectedChoice?"\n→ Đã chọn: "+e.selectedChoice.choiceLabel:"");
    parts.push("<div class='backlog-item'><span class='speaker'>"+esc(e.title)+"</span>"+esc(body)+"</div>");
  }
  if(!entries.length&&!legacy)parts.push(hist.length?hist.slice(-200).map(backlogLine).join(""):"<p>Chưa có nội dung.</p>");
  backlogList.innerHTML=parts.join("");
  backlogEl.hidden=false;
}
byId("backlog-open").addEventListener("click",openBacklog);
byId("backlog-close").addEventListener("click",()=>{backlogEl.hidden=true});
backlogEl.querySelector(".backlog-scrim").addEventListener("click",()=>{backlogEl.hidden=true});
const choicesEl=byId("choices"),actionsToggle=byId("actions-toggle"),storyPanelEl=byId("story-panel");
actionsToggle.addEventListener("click",()=>{const collapsed=storyPanelEl.classList.toggle("choices-collapsed");actionsToggle.setAttribute("aria-expanded",collapsed?"false":"true")});
choicesEl.addEventListener("click",e=>{const t=e.target.closest?e.target.closest("[data-choice],[data-restart]"):null;if(!t)return;stopPlayback();if(t.hasAttribute("data-restart")){restart();return}const sc=scenesById[state.scene];const idx=+t.getAttribute("data-choice");const c=sc&&sc.choices[idx];if(c)choose(c,idx)});
// ── Playback: Tự chạy / Đọc nhanh (Hui mechanism) ───────────────────────
// Autoplay may only take a scene's single choice when that choice has a
// valid next and no real set — anything else is the player's decision.
// Skip replays the choice recorded in sceneHistory for the current scene,
// validated against the live choice data; no valid record → stops quietly.
// Picking a choice by hand (click or number key) stops both modes.
let autoOn=false,autoTimer=null,skipOn=false,skipTimer=null;
const autoToggle=byId("auto-toggle"),skipToggle=byId("skip-toggle");
function syncPlayback(){autoToggle.setAttribute("aria-pressed",autoOn?"true":"false");skipToggle.setAttribute("aria-pressed",skipOn?"true":"false")}
function stopPlayback(){autoOn=false;skipOn=false;if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(skipTimer){clearTimeout(skipTimer);skipTimer=null}syncPlayback()}
function hasRealSet(c){return!!(c&&c.set&&Object.keys(c.set).length)}
function scheduleAuto(){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
  if(!autoOn)return;
  const sc=story&&state.scene?scenesById[state.scene]:null;
  if(!sc||sc.choices.length!==1||!sc.choices[0].next||hasRealSet(sc.choices[0])){autoOn=false;syncPlayback();return}
  const words=visibleLines(sc).reduce((n,ln)=>n+String(ln.text||"").split(/\s+/).length,0);
  const delay=Math.min(12000,Math.max(3000,2200+words*42));
  const c=sc.choices[0];
  autoTimer=setTimeout(()=>{if(autoOn)choose(c,0)},delay);
}
function sameChoiceSet(a,b){return JSON.stringify(a||null)===JSON.stringify(b||null)}
function skipStep(){
  if(!skipOn)return;
  const sc=story&&state.scene?scenesById[state.scene]:null;
  let rec=null;
  if(sc&&Array.isArray(state.sceneHistory))for(let i=state.sceneHistory.length-1;i>=0;i--){const e=state.sceneHistory[i];if(e.sceneId===sc.id&&e.selectedChoice){rec=e.selectedChoice;break}}
  const c=rec?sc.choices[rec.choiceIndex]:null;
  if(!c||c.label!==rec.choiceLabel||c.next!==rec.nextSceneId||!sameChoiceSet(c.set,rec.choiceSet)){skipOn=false;syncPlayback();return}
  choose(c,rec.choiceIndex);
  if(skipOn)skipTimer=setTimeout(skipStep,420);
}
autoToggle.addEventListener("click",()=>{if(autoOn){stopPlayback();return}stopPlayback();autoOn=true;syncPlayback();scheduleAuto()});
skipToggle.addEventListener("click",()=>{if(skipOn){stopPlayback();return}stopPlayback();skipOn=true;syncPlayback();skipStep()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(!overlayEl.hidden){closeProfile();return}
    if(!backlogEl.hidden){backlogEl.hidden=true;return}
    if(document.body.classList.contains("intel-open"))setIntel(false);
    return;
  }
  if(/^[1-9]$/.test(e.key)&&overlayEl.hidden&&backlogEl.hidden&&!document.body.classList.contains("intel-open")&&!/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||"")){
    const b=choicesEl.querySelector("[data-choice='"+(Number(e.key)-1)+"']");if(b)b.click();
  }
});
render();
</script>
