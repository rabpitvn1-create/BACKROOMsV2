<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px system-ui,sans-serif}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}.game,.card{border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.topbar{display:flex;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid #2b3137}.eyebrow,.role{color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em}h1{margin:4px 0 0;font-size:23px}.turn{color:#9aa4ad;font-size:12px;letter-spacing:.1em}.turn strong{font-size:21px;color:white}.snapshot{height:170px;margin:10px;border:1px solid #252b31;display:grid;place-items:center;background:#0b0d0f;color:#69737c}.snapshot img{width:100%;height:100%;object-fit:cover}.log{height:42vh;overflow:auto;padding:10px;display:grid;gap:10px}.message{border-left:3px solid #454e56;padding:11px;background:#111519}.message.player{border-left-color:#8b949e;background:#15191d}.role{margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.55}.composer{display:grid;gap:8px;padding:10px}textarea,button{font:inherit}textarea{min-height:80px;background:#090c0f;color:white;border:1px solid #30373e;padding:10px}button{border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700}.status{border-top:1px solid #252b31;padding:10px;color:#9aa4ad;font-size:12px}.side{display:grid;gap:10px;margin-top:10px}.card{padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}
</style>
</head>
<body>
<main class="shell">
<section class="game">
<header class="topbar"><div><div class="eyebrow">BACKROOM TEXT GAME</div><h1 id="title"></h1></div><div class="turn">TURN <strong id="turn"></strong></div></header>
<div class="snapshot" id="snapshot">SNAPSHOT — Android bản đầu chưa tạo ảnh tự động</div>
<div class="log" id="log"></div>
<form class="composer" id="form"><textarea id="action" placeholder="Kai làm gì trong Turn hiện tại?" rows="3"></textarea><button id="submit">THỰC HIỆN</button></form>
<div class="status" id="status"></div>
</section>
<aside class="side">
<div class="card"><h2>Trạng thái</h2><div class="row"><b>Vị trí</b><span id="location"></span></div><div class="row"><b>Chế độ</b><span id="mode"></span></div><div class="row"><b>Nhân vật</b><span id="player"></span></div></div>
<div class="card"><h2>Save / Load</h2><div class="actions"><button onclick="save()">Lưu</button><button onclick="load()">Tải</button><button class="wide" onclick="resetGame()">Bắt đầu lại từ đầu</button><button class="wide danger" onclick="clearSave()">Xóa save trên máy</button></div></div>
<div class="card"><h2>Party</h2><div class="chips" id="party"></div></div>
<div class="card"><h2>Inventory</h2><div class="chips" id="inventory"></div></div>
</aside>
</main>
<script>
const prologue=`SRU / ASYNC / SPATIAL GATE

Năm 2299.

Cánh cổng nằm giữa khu thử nghiệm như một vết cắt dựng đứng trong không khí.

Kai đứng cách nó vài mét, hai tay thả tự nhiên bên hông. Qua lớp giáp SRU, hắn cảm nhận được rung động rất nhẹ truyền lên từ sàn kim loại, đều đến mức nếu không đứng yên sẽ dễ bỏ qua. Phía sau lớp kính quan sát, các màn hình của đội kỹ thuật vẫn sáng. Những dãy số liên tục đổi nhưng không có tiếng báo động nào vang lên.

Nhiệm vụ đã được nhắc lại hai lần trước khi ba người vào khu triển khai. Không ai trong số họ cần nghe lần thứ ba.

Async đã tham gia vào một dự án nghiên cứu hiện tượng không gian bất thường. Một cổng ổn định đủ lâu để con người có thể vượt qua đã xuất hiện trong quá trình đó. Những báo cáo đi kèm dùng cùng một cái tên mà SRU đã thấy trong hồ sơ tình báo: Backrooms.

Chưa có bằng chứng nào cho thấy Async tạo ra nơi ở phía bên kia. Cũng chưa có bằng chứng họ hiểu đầy đủ thứ mình đã mở.

Đó chính là lý do SRU có mặt.

Kai nghiêng đầu nhìn dải sáng méo ở mép cổng. Không gian phía trong không cho một hình ảnh đủ rõ để gọi là cảnh vật. Mỗi lần mắt cố bám vào một điểm, chiều sâu của nó lại thay đổi một chút.

“Kiểm tra lần cuối.”

Iris đứng bên trái hắn. Cô rà lại những chỉ báo trên thiết bị của mình, rồi ngẩng lên. “Hệ thống cá nhân bình thường. Liên kết nội bộ ổn định. Em chưa thấy thay đổi nào ở vùng quanh cổng.”

Syvial đứng bên phải, đã sẵn sàng từ trước khi Kai lên tiếng. Cô nhìn cánh cổng thêm một nhịp rồi quay sang hắn. “Không có lý do để kéo dài. Nếu dữ liệu bên kia khác dữ liệu Async gửi về, chúng ta kiểm chứng tại chỗ.”

Kai khẽ gật đầu.

Một sĩ quan điều phối ở phía sau xác nhận hành lang triển khai đã sạch. Mệnh lệnh cuối cùng của SRU không thay đổi: vào, đánh giá mối đe dọa đối với Frontrooms, xác minh hoạt động liên quan Async nếu có bằng chứng thực tế, duy trì liên lạc khi điều kiện cho phép và quay về bằng tuyến đã mở nếu tuyến đó còn tồn tại.

Không ai gọi đây là chuyến đi an toàn.

Cũng không ai buộc ba người bước qua.

Kai nhìn Iris trước. Cô đã chuyển toàn bộ sự chú ý vào cổng, tư thế bình tĩnh như trước mỗi lần bắt đầu một nhiệm vụ khó. Hắn nhìn sang Syvial. Cô bắt gặp ánh mắt hắn và hơi nhướng mày.

“Anh định đứng đó thêm bao lâu?”

“Đang cho hai người cơ hội đổi ý.”

Syvial bật ra một tiếng cười ngắn. “Anh biết câu trả lời rồi.”

Iris không cười, nhưng giọng cô dịu hơn khi nói: “Đi thôi, anh Kai.”

Kai quay lại phía cổng.

“Giữ khoảng cách một bước. Qua bên kia mới tách đội hình.”

Hắn bước trước.

Bề mặt cổng không lạnh, không nóng. Thứ đầu tiên Kai mất là cảm giác về khoảng cách. Bàn chân trước của hắn đã đi qua, nhưng phần còn lại của cơ thể dường như vẫn cách nó xa hơn một bước. Trong chưa đầy một giây, cảm giác đó kéo dài thành một khoảng trống không thể đo.

Rồi nó chấm dứt.

Kai nghe tiếng Iris phía sau.

Một âm tiết ngắn, không đủ thành câu.

Sau đó giọng Syvial biến mất cùng lúc với toàn bộ âm thanh từ khu triển khai.

Hắn xoay người.

Không có phía sau.

Không phải bóng tối che mất cánh cổng. Không phải khói, nhiễu hay một bức tường chắn tầm nhìn. Không gian mà hắn vừa đi qua đơn giản không còn nối với vị trí hắn đang đứng.

Trọng lực kéo Kai xuống.

Hắn chạm đất bằng một chân, hạ trọng tâm theo phản xạ và đứng vững ngay sau cú tiếp đất. Tay hắn đã tới vị trí có thể rút vũ khí trước khi mắt kịp hoàn tất lượt quét đầu tiên.

Không có mục tiêu.

Không có Iris.

Không có Syvial.

Không có cánh cổng.

Chỉ có màu vàng.

Tường phủ giấy cũ ngả vàng, hoa văn lặp lại nhưng không hoàn toàn trùng nhau. Thảm dưới chân mềm và ẩm, giữ lại một thứ mùi trộn giữa vải lâu ngày, keo dán và hơi mốc. Trần ghép từ những tấm vuông trắng đục. Đèn huỳnh quang chạy thành hàng phía trên, phát ra tiếng ù đều không có khoảng nghỉ.

Kai không di chuyển ngay.

Hắn quan sát ba lối mở gần nhất, kiểm tra góc khuất, khoảng cách, vật liệu bề mặt và những điểm có thể che một người. Không thấy chuyển động. Không có dấu máu, dấu chân rõ ràng hay vật thể nào cho thấy hai đồng đội đã rơi xuống cùng khu vực.

Hắn thử liên lạc.

“Iris, báo trạng thái.”

Không có hồi đáp.

“Syvial.”

Chỉ tiếng ù trên đầu.

Kai đổi kênh. Liên kết trực tiếp trong đội không nhận được tín hiệu. Tuyến SRU không về được sở chỉ huy. Beacon không bắt tay với mạng ngoài. Telemetry không có nơi nhận. Hắn kiểm tra lại thiết bị thay vì kết luận ngay rằng chúng đã hỏng.

Các hệ thống cục bộ vẫn hoạt động.

Thứ biến mất là đường nối.

Kai nhìn lại nơi mình vừa xuất hiện. Không có đường viền sáng, không có biến dạng giống cổng, không có thứ gì để bước ngược qua.

Hắn đứng yên thêm vài giây và nghe.

Tiếng đèn.

Một tiếng nước rất nhỏ ở đâu đó, hoặc chỉ là âm thanh từ lớp thảm ẩm khi vật liệu co lại. Không đủ căn cứ để gọi nó là bước chân. Không đủ để gọi nó là sinh vật.

Kai không tự cho mình câu trả lời dễ chịu hơn dữ kiện.

Nhiệm vụ của SRU chưa kết thúc chỉ vì điểm vào đã mất.

Async vẫn là đối tượng cần điều tra, nhưng bản tóm tắt nhiệm vụ không biến mọi thứ hắn nhìn thấy thành dấu vết của Async. Căn phòng vàng này chưa chứng minh điều gì về nguồn gốc của Backrooms, về người tạo ra nó, hay thậm chí về việc Async đã từng đặt chân tới đúng nơi hắn đang đứng.

Những gì hắn biết ít hơn thế.

Ba người đã chủ động bước qua cùng một cổng.

Họ không còn ở cùng nhau.

Liên lạc với Iris, Syvial, SRU và Frontrooms đều mất.

Hắn đang ở một nơi có cấu trúc phòng nối tiếp, vật liệu cũ, thảm ẩm và ánh đèn không dứt. Bản đồ chưa có. Lối quay lại chưa có. Mức độ đe dọa chưa biết.

Kai đặt một mốc quan sát đầu tiên trong trí nhớ: vết sẫm ở chân tường bên trái, ổ cắm đặt thấp bất thường ở phòng kế tiếp, một đoạn giấy dán hơi bong gần góc. Chúng chỉ là mốc tạm thời. Hắn chưa có lý do để tin nơi này sẽ giữ nguyên chúng cho mình.

Hắn kiểm tra lại trang bị trên người, xác nhận những thứ cần thiết vẫn ở đúng vị trí. Không có vết thương đáng kể sau khi qua cổng. Không có dấu hiệu phải kích hoạt sức mạnh chỉ vì một căn phòng đang im lặng.

Cách tiếp cận hợp lý vẫn như mọi nhiệm vụ chưa đủ dữ liệu: quan sát trước, kiểm chứng sau, không biến giả định thành sự thật.

Kai nhìn sang hành lang gần nhất.

Tiếng huỳnh quang tiếp tục rung trong không khí, đều đến mức sau một lúc nó bắt đầu lấp vào khoảng trống mà giọng của Iris và Syvial vừa để lại.

Hắn không gọi thêm lần nữa.

Không phải vì từ bỏ.

Bởi gọi trong một hệ thống không có đường truyền chỉ tiêu tốn thời gian, còn tìm một tuyến có thể nối lại với họ mới là việc cần làm.

Kai bước tới mép ô cửa, dừng trước khi vượt qua và quan sát phần phòng tiếp theo.

Từ đây, nhiệm vụ chính thức đổi hình dạng nhưng không đổi mục tiêu.

Sống sót. Hiểu nơi này đủ để không bị nó dẫn dắt bằng những kết luận sai. Tìm Iris và Syvial. Xác minh bất kỳ dấu vết Async nào chỉ khi có bằng chứng thật. Và nếu tồn tại một con đường trở lại Frontrooms, phải tìm ra nó thay vì giả định rằng cánh cổng cũ vẫn đang chờ ở đâu đó.

Phía trước vẫn chỉ là những căn phòng vàng.

Turn đầu tiên bắt đầu ở đó.`;

const initial={
  title:"MAIN_BACKROOMS — Kai Akechi",
  turn:1,
  mode:"local APK",
  level:{number:0,name:"The Lobby"},
  location:"Level 0 / The Lobby — khu phòng vàng ban đầu",
  player:{name:"Kai Akechi",condition:"Ổn định"},
  party:[],
  inventory:[
    {name:"White Wraith Magnum"},
    {name:"Blackblood Armor & linked modules"},
    {name:"Omnivault Ring / Nhẫn Vạn Tàng"}
  ],
  flags:{
    activeRun:true,
    campaign:"MAIN_BACKROOMS",
    prologueShown:true,
    mission:{id:"SRU_ASYNC_INVESTIGATION",status:"active",year:2299,entry:"voluntary_spatial_gate",origin:"UNKNOWN"},
    currentLevel:{number:0,name:"The Lobby"},
    exploration:{sublevelId:""},
    iris:{continuity:"separated_location_unknown_to_kai",relationship:"kai_loves_iris"},
    syvial:{continuity:"separated_location_unknown_to_kai",relationship:"kai_loves_syvial"},
    communication:{iris:"OFFLINE",syvial:"OFFLINE",sru:"OFFLINE",frontrooms:"OFFLINE",beacon:"OFFLINE",telemetry:"OFFLINE"},
    storyArc:{current:"MAIN.PROLOGUE",currentBeat:"STORY.PROLOGUE.ENTRY_COMPLETE",nextBeat:"STORY.LEVEL0.ARRIVAL",completed:["STORY.PROLOGUE.ENTRY_COMPLETE"]},
    storyContinuity:{
      schemaVersion:1,
      source:"campaign-startup",
      lastTurn:1,
      events:[{id:"EVT.1.PROLOGUE.ENTRY",turn:1,type:"story-beat",fact:"Kai, Iris and Syvial voluntarily crossed the SRU-monitored Async-linked spatial gate and were separated; Kai arrived alone in Level 0."}],
      discoveries:[],
      objectives:[
        {id:"MAIN.SURVIVE",status:"active",fact:"Survive and learn the current environment."},
        {id:"MAIN.ASYNC",status:"active",fact:"Investigate Async only when gameplay evidence supports an actual Async connection."},
        {id:"MAIN.REUNITE.IRIS",status:"active",fact:"Determine Iris's condition and re-establish a route if possible."},
        {id:"MAIN.REUNITE.SYVIAL",status:"active",fact:"Determine Syvial's condition and re-establish a route if possible."},
        {id:"MAIN.EXIT",status:"active",fact:"Seek a way to communicate with or return to Frontrooms only when evidence supports one."}
      ],
      unresolvedThreads:[
        {id:"THREAD.REUNITE.IRIS",status:"open",turn:1,fact:"Iris remains separated; her location is unknown to Kai."},
        {id:"THREAD.REUNITE.SYVIAL",status:"open",turn:1,fact:"Syvial remains separated; her location is unknown to Kai."},
        {id:"THREAD.ASYNC.EVIDENCE",status:"open",turn:1,fact:"No local Level 0 observation has yet been verified as Async evidence."}
      ],
      knowledge:[{id:"KNOW.STORY.PROLOGUE.ENTRY",factId:"STORY.PROLOGUE.ENTRY_COMPLETE",turn:1,knownBy:["kai"]}],
      relationshipChanges:[]
    }
  },
  log:[
    {role:"gm",text:"MỞ ĐẦU\n\n"+prologue},
    {role:"gm",text:"LƯỢT 1\n\nKai đang ở một mình tại Level 0. Liên lạc với Iris, Syvial, SRU và Frontrooms đều ngoại tuyến. Không có lối thoát, Entity hay dấu vết Async nào được xác nhận chỉ từ phần mở đầu. Bạn điều khiển Kai từ đây."}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

const campaignPrologueSignature="SRU / ASYNC / SPATIAL GATE";
if(state.turn===1&&Array.isArray(state.log)&&state.log[0]){
  const currentOpening=String(state.log[0].text||"");
  if(!currentOpening.includes(campaignPrologueSignature)){
    state=JSON.parse(JSON.stringify(initial));
    localStorage.setItem("backroom-apk-state",JSON.stringify(state));
  }
}

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function render(){titleEl.textContent=state.title;turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(state.party);inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");logEl.scrollTop=logEl.scrollHeight;statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Gemini đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=JSON.parse(json);actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi Gemini: "+message};
render();
</script>
</body>
</html>
