<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}.game,.card{border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid #2b3137}.eyebrow,.role{color:#8f9aa4;font-size:9px;font-weight:800;letter-spacing:.16em}h1{margin:2px 0 0;font-size:19px;line-height:1.15}.turn{color:#9aa4ad;font-size:10px;letter-spacing:.08em;min-width:48px}.turn strong{font-size:18px;color:white}.snapshot{height:250px;margin:8px 10px 10px;border:1px solid #252b31;display:grid;place-items:center;background:#0b0d0f;color:#69737c}.snapshot img{width:100%;height:100%;object-fit:cover}.log{height:clamp(360px,55vh,620px);overflow:auto;padding:10px;display:grid;gap:10px}.message{border-left:3px solid #454e56;padding:11px;background:#111519}.message.player{border-left-color:#8b949e;background:#15191d}.role{margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.55}.player-action-bar{padding:10px;border-top:1px solid #252b31}.player-action-bar button{width:100%;letter-spacing:.08em}.player-action-modal[hidden]{display:none}.player-action-modal{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.player-action-backdrop{position:absolute;inset:0;background:#000b}.player-action-sheet{position:relative;width:min(100%,680px);max-height:100%;overflow:auto;background:#0e1114;border:1px solid #3a4249;border-bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px #000b}.player-action-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.player-action-head h2{margin:0;font:800 14px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.1em}.player-action-close{width:auto;min-width:42px;padding:8px 10px}.composer{display:grid;gap:10px;padding:0}.composer label{font-weight:700;font-size:13px}.composer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}textarea,button{font:inherit}textarea{min-height:150px;max-height:42vh;resize:vertical;background:#090c0f;color:white;border:1px solid #30373e;padding:12px;line-height:1.45}button{border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700}.status{border-top:1px solid #252b31;padding:10px;color:#9aa4ad;font-size:12px}.side{display:grid;gap:10px;margin-top:10px}.card{padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}body.player-action-open{overflow:hidden}
</style>
</head>
<body>
<main class="shell">
<section class="game">
<header class="topbar"><div><div class="eyebrow">BACKROOM TEXT GAME</div><h1 id="title"></h1></div><div class="turn">TURN <strong id="turn"></strong></div></header>
<div class="snapshot" id="snapshot">LEVEL SNAPSHOT — LOCAL ASSET</div>
<div class="log" id="log"></div>
<div class="player-action-bar"><button id="playerActionOpen" type="button">PLAYER ACTION</button></div>
<div class="player-action-modal" id="playerActionModal" hidden aria-hidden="true">
  <div class="player-action-backdrop" id="playerActionBackdrop"></div>
  <section class="player-action-sheet" role="dialog" aria-modal="true" aria-labelledby="playerActionTitle">
    <div class="player-action-head"><h2 id="playerActionTitle">PLAYER ACTION</h2><button class="player-action-close" id="playerActionClose" type="button" aria-label="Đóng">×</button></div>
    <form class="composer" id="form">
      <label for="action">Kai sẽ làm gì?</label>
      <textarea id="action" placeholder="Nhập hành động của Kai…" rows="5"></textarea>
      <div class="composer-actions"><button id="playerActionCancel" type="button">HỦY</button><button id="submit" type="submit">THỰC HIỆN</button></div>
    </form>
  </section>
</div>
<div class="status" id="status"></div>
</section>
<aside class="side">
<div class="card"><h2>Trạng thái</h2><div class="row"><b>Vị trí</b><span id="location"></span></div><div class="row"><b>Chế độ</b><span id="mode"></span></div><div class="row"><b>Nhân vật</b><span id="player"></span></div></div>
<div class="card"><h2>Save / Load</h2><div class="actions"><button onclick="save()">Lưu</button><button onclick="load()">Tải</button><button class="wide" onclick="resetGame()">Bắt đầu lại từ đầu</button><button class="wide danger" onclick="clearSave()">Xóa save trên máy</button></div></div>
<div class="card"><h2>Party</h2><div class="chips" id="party"></div></div>
<div class="card"><h2>Inventory</h2><div class="chips" id="inventory"></div></div>
</aside>
</main>
<script>
// 6. PROLOGUE — MANDATORY NEW GAME OPENING
const prologue=`Năm 2299.

Khu tập kết của SRU không mang dáng vẻ của một nơi chuẩn bị cho chuyến đi một chiều.

Toàn bộ thiết bị đo đạc đã hoàn tất kiểm tra. Hệ thống liên lạc nội bộ vẫn hoạt động ổn định. Phía trước đội, cổng không gian duy trì trạng thái cân bằng trong giới hạn mà bộ phận kỹ thuật xác nhận là đủ an toàn để triển khai.

Đây không phải một chuyến thám hiểm được tổ chức vì tò mò.

Async đã trở thành đối tượng của một cuộc điều tra chính thức. Những cổng không gian cùng mối liên hệ chưa được xác minh giữa chúng và Backrooms là trọng tâm mà SRU cần làm rõ bằng dữ liệu thực địa.

Không giả thuyết nào được phép thay thế bằng chứng.

Kai kiểm tra trang bị lần cuối.

Iris đứng bên trái hắn. Syvial ở phía còn lại.

Cả ba đã nhận cùng một bản tóm tắt nhiệm vụ, cùng nắm rõ mục tiêu và cùng hiểu giới hạn quan trọng nhất của chiến dịch: SRU vẫn chưa xác định được nguồn gốc của Backrooms, cũng chưa có đủ bằng chứng để kết luận Async thực sự đóng vai trò gì trong hiện tượng này.

Không ai bị kéo đi ngoài ý muốn.

Không có tai nạn.

Không có sự cố ngoài kế hoạch.

Theo đúng mệnh lệnh nhiệm vụ, Kai, Iris và Syvial chủ động bước qua cùng một cổng không gian.

Quá trình chuyển tiếp diễn ra gần như tức thời.

Trong khoảnh khắc ngắn ngủi giữa hai phía của cổng, Kai không thể thiết lập bất kỳ hệ tọa độ nào có ý nghĩa. Không có phương hướng. Không có điểm tham chiếu ổn định. Chỉ có cảm giác không gian quanh cơ thể bị kéo giãn trong một tích tắc trước khi trọng lực đột ngột xuất hiện trở lại.

Kai tiếp đất trên một bề mặt mềm và ẩm.

Theo phản xạ huấn luyện, hắn lập tức hạ trọng tâm, giữ thăng bằng rồi kiểm tra các góc khuất trước khi tìm kiếm đồng đội.

Không có Iris.

Không có Syvial.

Cả ba đã đi qua cùng một điểm vào, nhưng bằng một cơ chế chưa xác định, họ không xuất hiện tại cùng một vị trí ở phía bên kia.

Kai ngẩng lên quan sát.

Ánh sáng huỳnh quang trắng nhợt phủ lên những căn phòng màu vàng kéo dài trước mắt. Tường giấy lặp lại cùng một kiểu hoa văn. Tấm thảm dưới chân giữ một lớp ẩm khó chịu. Trần thả nối tiếp nhau qua những hành lang và ô cửa gần như giống hệt.

Tiếng ù đều đều của hệ thống chiếu sáng vọng khắp không gian.

Không có dấu hiệu nhận dạng.

Không có thiết bị định vị của SRU.

Không có bất kỳ bằng chứng nào cho thấy khu vực này từng nằm dưới sự kiểm soát của con người.

Kai kích hoạt kênh liên lạc trực tiếp của đội.

Không phản hồi.

Hắn chuyển sang kênh của lực lượng SRU.

Im lặng.

Kênh chỉ huy.

Không thể thiết lập kết nối.

Kênh dự phòng.

Không có tín hiệu đáp lại.

Hệ thống truyền dữ liệu đo xa cũng không thể kết nối với bên ngoài.

Kai không vội kết luận thiết bị đã hỏng. Mất liên lạc không đồng nghĩa với lỗi phần cứng, và một giả định chưa được kiểm chứng vẫn chỉ là giả định.

Những gì hắn thực sự biết lúc này chỉ có vài điểm.

Mọi tuyến liên lạc với bên ngoài đều không thể thiết lập.

Iris và Syvial không xuất hiện tại vị trí của hắn.

Môi trường xung quanh phù hợp với những mô tả đã được SRU thu thập về Backrooms.

Ngoài ra, chưa có gì được xác nhận.

Nhiệm vụ Async vẫn còn hiệu lực.

Vị trí Iris: CHƯA XÁC ĐỊNH.

Vị trí Syvial: CHƯA XÁC ĐỊNH.

Liên lạc với SRU: MẤT KẾT NỐI.

Việc Kai xuất hiện trong Backrooms không tự động chứng minh bất kỳ giả thuyết nào về Async. Chưa có dữ liệu nào đủ để xác định nguyên nhân, cơ chế hay mối liên hệ thực sự đứng sau những gì vừa xảy ra.

Vì vậy, nhiệm vụ không thay đổi.

Kai bắt đầu tại Level 0 — The Lobby.

Một mình.

Mất liên lạc.

Hai thành viên trong đội mất dấu.

Trước khi có thể tìm Iris, Syvial hay bất kỳ câu trả lời nào khác, hắn phải làm điều căn bản nhất mà một đặc vụ SRU được huấn luyện để thực hiện khi tiến vào một môi trường chưa xác định:

Quan sát.

Thu thập bằng chứng.

Sống sót.

Duy trì khả năng quay lại những khu vực đã xác nhận an toàn bất cứ khi nào có thể.

Và trên hết, không bao giờ biến điều chưa biết thành một câu trả lời chỉ vì nó thuận tiện.`;

const CURRENT_CHARACTER_CANON={
  version:"drive-characters-2026-09-17",
  instruction:"Current Google Drive character canon. This overrides conflicting legacy character facts in old logs/local mirrors. KNOWLEDGE_LOCK is writer/GM canon, not automatic in-world knowledge. UNKNOWN/OPEN must remain unknown. Character encounters and Party joins are owned exclusively by CharacterEncounterCore; Gemini must never spawn a character or mutate Party.",
  kai:"Kai Akechi / Twilight is current SRU captain in the anti-anomalous police force, UR+, origin era 2299 but true age unknown. Public SRU record says human; KNOWLEDGE_LOCK: half-human/half-demon son of Sparda and Eve. Sparda Core gives infinite demon power with no intrinsic depletion/cooldown/corruption/berserk and self-repairs all currently equipped items. Current signature weapon is SRU Assault Rifle MK19: physical 5.56x45 NATO, 30-round physical mags, 700-950 rpm, ~500-600 m effective; physical ammo is finite. It also fires Sparda demonic 5.56x45 formed directly from Core, no physical ammo use. SRU-MK20 is current powered armor. Devil Trigger has no intrinsic cap. Guilty Crown Override is a 40% combat proc; on proc it fires exactly 24 MK19 demonic shots while external time is fully stopped, dealing exactly 10 HP per shot (240 HP total). Omnivault now ONLY stores/retrieves inanimate objects and Restores the same existing equipment, with 24h per-item restore cooldown. Old Scan/Copy/Create/Marked/Upgrade mechanics are removed.",
  iris:"Iris / ARGUS is SRU Scout / Target Eliminator in Kai's team, a real ranged Gunslinger. No surname locked. Half-human/half-demon daughter of Belial and a deceased human mother; mother details, birth era and exact combat tier remain UNKNOWN. Belial Core provides infinite demon power for established functions. ARGUS Terrain Read uses direct observation plus local Recon Frame sensors for terrain/routes/LOS/cover/ambush/traces; no omniscience, wall vision, remote cameras or automatic true-form detection. Thousandfold Cognition is up to 1:1000 information processing, not body speed. Current gear: SRU Recon Frame R03 and Ivory & Ebony, whose bullets form from Iris's demon power. Iris loves Kai; Kai knows but reciprocation is not canonically established. Iris uses anh-em with Kai; Iris and Syvial are trusted friends/teammates with romantic rivalry, not enemies.",
  syvial:"Syvial is half-human/half-demon daughter of Lucifer, origin era 2299, true age unknown, UR+ and same overall tier as Kai. Current organization: SRU anti-anomalous police; deputy leader of Kai's team. Lucifer Core supplies infinite demon power; Devil Trigger does not remove control or have an invented intrinsic cap/cooldown. GodKiller is a massive purely mechanical greatsword, never a gun/gunblade. Lucifer Armor is mobile black/gunmetal/silver mecha armor with magenta accents; pointed head modules are mechanical, not biological horns; very durable/fast self-repairing but not absolutely indestructible. GodKiller Override / Twenty-Four Severance = exactly 24 cuts while external time is fully stopped. Syvial is intensely yandere toward Kai but lucid and socially/tactically competent; she values Kai's voluntary choice and does not randomly murder, sabotage missions, erase memory or mind-control him.",
  lucia:"Hứa Thuý Mai is the legal/real name; Lucia Lục is a military nickname/callsign. She is a 19-year-old HUMAN Vietnamese woman of Hoa Kiều background, great-great-granddaughter of the Hứa family, with one year military training/service via Vietnam + USA and excellent entrance result. She is a capable human tactical riflewoman, not supernatural/UR+. Lucia can only be encountered through CharacterEncounterCore's Level 0 Explorer roll and is not part of the initial SRU group (Kai/Iris/Syvial). Gameplay baseline: HP100 STR7 DF7 AGI8 CRIT7, +2 HP after each 3 separately completed turns. Main weapon personalized M4A1; baseline physical ammo 60 in main mags + 90 reserve = 150; combat dagger and military navigation watch. Relationship/address with Kai remain OPEN."
};

const LEVEL_NODE_TITLES={
  "0":"Level 0 : The Lobby",
  "0.1":"Level 0.1 : Zenith Station",
  "0.2":"Level 0.2 : Remodeled Mess",
  "0.5":"Level 0.5 : Aquaclaustrophobic Infirmary",
  "0.7":"Level 0.7 : The Reminiscence District",
  "manila_room":"Manila Room",
  "the_torment":"The Torment",
  "red_rooms":"Red Rooms",
  "1":"Level 1 : Parking Zone",
  "2":"Level 2 : Pipe Dreams",
  "3":"Level 3 : The Electrical Station",
  "4":"Level 4 : The Abandoned Office",
  "5":"Level 5 : Terror Hotel",
  "6":"Level 6 : Lights Out"
};

const initial={
  title:"Level 0 : The Lobby",
  turn:1,
  mode:"local APK",
  currentLevel:0,
  currentLevelKey:"0",
  location:"Level 0 / The Lobby — khu phòng vàng ban đầu sau khi đi qua cổng không gian",
  player:{name:"Kai Akechi",condition:"Ổn định"},
  party:[],
  inventory:[
    {name:"SRU Assault Rifle MK19"},
    {name:"SRU-MK20 Powered Armor"},
    {name:"Omnivault Ring / Nhẫn Vạn Tàng"}
  ],
  flags:{communication:{sru:"OFFLINE",iris:"OFFLINE",syvial:"OFFLINE"}},
  characterCanon:CURRENT_CHARACTER_CANON,
  log:[
    {role:"gm",text:"MỞ ĐẦU\n\n"+prologue},
    {role:"gm",text:"LƯỢT 1\n\nKhông có liên lạc với Iris, Syvial hay SRU. Bạn điều khiển Kai từ đây."}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
function normalizeCoreState(value){try{return window.Android&&typeof Android.normalizeState==="function"?JSON.parse(Android.normalizeState(JSON.stringify(value))):value}catch(_){return value}}
let state=normalizeCoreState(JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial);
let busy=false;

function inferLevelKey(s){
  const existing=String(s?.currentLevelKey||"").trim();
  if(existing)return existing;
  const location=String(s?.location||"").toLowerCase();
  if(location.includes("manila room"))return "manila_room";
  if(location.includes("the torment")||/\btorment\b/.test(location))return "the_torment";
  if(location.includes("red rooms")||location.includes("red room"))return "red_rooms";
  const m=String(s?.location||"").match(/\bLevel\s*([0-6](?:\.[0-9]+)?)\b/i);
  if(m)return m[1];
  return String(Number.isInteger(s?.currentLevel)?s.currentLevel:0);
}
function ensureCurrentLevel(s){
  if(!Number.isInteger(s?.currentLevel)||s.currentLevel<0||s.currentLevel>6){
    const m=String(s?.location||"").match(/\bLevel\s*([0-6])\b/i);
    s.currentLevel=m?Number(m[1]):0;
  }
  s.currentLevelKey=inferLevelKey(s);
  return s;
}
ensureCurrentLevel(state);
state.characterCanon=CURRENT_CHARACTER_CANON;
if(state.turn===1){
  const currentOpening=String(state.log?.[0]?.text||"");
  const oldInventory=Array.isArray(state.inventory)&&state.inventory.some(x=>String(x?.name||"").includes("White Wraith"));
  if(oldInventory) state.inventory=JSON.parse(JSON.stringify(initial.inventory));
  if(state.flags?.communication?.blackBlood!==undefined){
    delete state.flags.communication.blackBlood;
    state.flags.communication.sru="OFFLINE";
  }
  if(currentOpening!==initial.log[0].text){
    if(!Array.isArray(state.log)) state.log=[];
    state.log[0]=initial.log[0];
    if(state.log[1]) state.log[1]=initial.log[1];
  }
  state.location=initial.location;
}
localStorage.setItem("backroom-apk-state",JSON.stringify(state));

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function levelTitle(){const key=String(state?.currentLevelKey||state?.currentLevel||0);return LEVEL_NODE_TITLES[key]||("Level "+key)}
function partyDisplayItems(){const result=[];const seen=new Set();const add=x=>{if(!x)return;const name=typeof x==="string"?x:String(x.name||x.id||"").trim();if(!name)return;const key=name.toLocaleLowerCase("vi");if(seen.has(key))return;seen.add(key);result.push(typeof x==="string"?{name}:x)};add(state?.player||{name:"Kai Akechi"});(Array.isArray(state?.party)?state.party:[]).filter(x=>x&&x.joined===true).forEach(add);return result}
function render(){titleEl.textContent=levelTitle();turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(partyDisplayItems());inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=normalizeCoreState(ensureCurrentLevel(JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial));state.characterCanon=CURRENT_CHARACTER_CANON;save();render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="GAME MASTER đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=ensureCurrentLevel(JSON.parse(json));state.characterCanon=CURRENT_CHARACTER_CANON;actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" · "+levelTitle()+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi AI: "+message};
window.backroomCommittedError=json=>{const payload=JSON.parse(json);state=ensureCurrentLevel(payload.state||state);state.characterCanon=CURRENT_CHARACTER_CANON;busy=false;submitEl.disabled=false;save();render();const pending=Array.isArray(state?.characterEncounter?.pendingIntro)&&state.characterEncounter.pendingIntro.length>0;statusEl.textContent="Lỗi AI: "+String(payload.message||"Không thể xử lý lượt.")+(pending?" Character encounter đã được lưu và hội thoại đang chờ thử lại.":" Trạng thái Core trước lần gọi AI đã được giữ nguyên.")};
render();
