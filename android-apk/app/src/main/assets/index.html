<main class="shell">

// 6. PROLOGUE — MANDATORY NEW GAME OPENING
const prologue=`Ma Sơn.

Không có đại chiến.

Không có thiên kiếp.

Cũng không có bất kỳ biến cố nào báo trước rằng thế giới sắp làm một chuyện vô lý.

Cao Minh ngồi bên vách đá, Huyết Ma Kiếm dựng cạnh người. Phía dưới là biển mây trải đến tận chân trời. Trong tay hắn là một vò linh tửu đã cất đủ lâu để phần lớn tu sĩ ngoài kia sẵn sàng tranh nhau đến đỏ mắt.

Hắn chỉ thấy rượu hôm nay uống được.

Những năm gần đây, phần lớn mọi chuyện cũng chỉ còn đến thế.

Các tông môn từng khiến thiên hạ kính sợ, những bí cảnh được truyền tụng qua hàng nghìn năm, những cấm địa mà vô số người vào rồi không trở ra... Cao Minh đã thấy quá nhiều.

Có nơi hắn từng đánh qua.

Có nơi hắn từng đi qua.

Có nơi chỉ cần nhìn một lần là đủ hiểu chẳng còn thứ gì đáng để hắn mất thêm thời gian.

Đứng trên đỉnh quá lâu không khiến thế giới rộng hơn.

Chỉ khiến những thứ từng được gọi là kỳ ngộ dần trở nên quen thuộc.

Cao Minh nâng vò rượu lên.

Ngay lúc ấy, mặt đất dưới chân biến mất.

Không nứt.

Không sụp.

Không có trận văn sáng lên.

Không có linh lực dao động.

Thậm chí không có lấy một khoảnh khắc báo trước.

Vách đá, mặt đất và cả cảm giác về phương hướng đơn giản biến mất khỏi nhận thức của hắn.

Cơ thể Cao Minh rơi xuống.

Ánh mắt hắn lập tức lạnh đi.

Huyết Ma Kiếm rời khỏi mặt đất cùng lúc với chủ nhân, lơ lửng sát bên người dưới sự điều khiển của thần niệm. Vò linh tửu biến mất vào Vạn Tàng Giới trước khi một giọt nào kịp đổ ra ngoài.

Trong khoảng không đang nuốt lấy hắn, Cao Minh mở rộng thần thức.

Không có trận pháp truyền tống.

Không có dấu vết của hư không loạn lưu.

Không có kết cấu tiểu thế giới hay bí cảnh mà hắn từng biết.

Không có gì để khóa lại.

Rồi trọng lực đổi hướng.

Cao Minh chạm đất.

Hắn tiếp đất bằng hai chân, gần như không phát ra tiếng động.

Huyết Ma Kiếm dừng giữa không trung bên cạnh vai hắn.

Trước mắt không còn Ma Sơn.

Một hành lang vàng nhạt kéo dài qua những góc rẽ vuông vức. Ánh sáng trắng lạnh từ những dãy đèn trên trần phủ xuống lớp giấy tường đã ngả màu. Dưới chân là một loại thảm mềm, giữ hơi ẩm và tỏa ra thứ mùi cũ kỹ khó gọi tên.

Tiếng ù của đèn vang đều trong không gian.

Không có gió.

Không có tiếng người.

Không có linh khí vận hành theo bất kỳ cấu trúc tự nhiên nào hắn quen thuộc.

Cao Minh đứng yên vài giây.

Không phải vì sợ.

Hắn đang nghe.

Thần thức lan ra.

Qua căn phòng đầu tiên.

Qua hành lang kế tiếp.

Qua thêm những khoảng không có bố cục gần như lặp lại.

Nhưng khoảng cách mà thần thức cảm nhận được không khớp hoàn toàn với những gì mắt hắn nhìn thấy.

Một bức tường đáng lẽ phải nằm ở đó lại cho cảm giác xa hơn.

Một hành lang nhìn như kéo thẳng về phía trước lại không tạo ra phương hướng ổn định trong cảm nhận.

Không gian tồn tại.

Nhưng nó không chịu cư xử theo cách không gian nên cư xử.

Cao Minh khẽ nhướng mày.

Lần đầu tiên sau rất lâu, hắn không lập tức có câu trả lời.

Hắn bước tới.

Ở một góc tường, Cao Minh để lại một ma ấn.

Dấu ấn ổn định.

Không có dấu hiệu bị phá hủy hay can thiệp.

Hắn tiếp tục đi.

Một hành lang.

Hai lần rẽ.

Ba căn phòng gần như giống hệt nhau.

Cao Minh ghi nhớ từng đoạn đường, từng góc chuyển hướng và từng thay đổi nhỏ trong môi trường. Khi đã đi đủ xa, hắn quay lại theo chính lộ tuyến vừa qua.

Ma ấn vẫn còn đó.

Nhưng nó không còn nằm ở nơi nó phải nằm.

Cao Minh dừng lại trước dấu ấn.

Hắn nhìn nó một lúc lâu.

Không gian xung quanh vẫn im lặng như thể chẳng có chuyện gì xảy ra.

Huyết Ma Kiếm lơ lửng phía sau hắn, huyết văn trên thân kiếm chỉ phát ra một lớp sáng đỏ rất mỏng.

Cao Minh không phá tường.

Không chém thử hành lang.

Cũng không lập tức dùng sức mạnh để cưỡng ép một thứ mà hắn còn chưa hiểu.

Nếu ma ấn không dịch chuyển, nhưng vị trí của nó lại không còn tương ứng với lộ tuyến đã đi, vấn đề không nằm ở dấu ấn.

Ít nhất, đó là giả thuyết đầu tiên đáng để kiểm chứng.

Hắn quay đầu nhìn dãy hành lang vàng kéo dài trước mặt.

Một nơi không giống động phủ.

Không giống bí cảnh.

Không giống tiểu thế giới.

Cũng không vận hành theo những quy luật không gian mà hắn từng biết.

Cao Minh im lặng một lúc.

Rồi khóe miệng hắn hơi nhếch lên.

Đã rất lâu rồi hắn mới gặp một thứ không chịu đưa ra đáp án ngay từ cái nhìn đầu tiên.

Việc trở về thế giới cũ vẫn cần được giải quyết.

Nhưng chưa phải lúc này.

Trước hết, hắn muốn biết nơi này là gì.

Không gian ở đây vận hành theo quy luật nào.

Những hành lang này có điểm cuối hay không.

Và nếu trong nơi này tồn tại thứ gì khác ngoài hắn...

Chúng tuân theo loại pháp tắc nào.

Cao Minh giơ tay.

Huyết Ma Kiếm lặng lẽ bay đến, dừng bên cạnh người như thể đã hiểu ý chủ nhân.

Hắn bước tiếp vào hành lang.

Không bản đồ.

Không tên gọi.

Không một lời giải thích.

Chỉ có một thế giới chưa biết đang mở ra trước mắt.

Và lần đầu tiên sau rất nhiều năm, Vạn Giới Ma Tôn cảm thấy chuyến đi phía trước có lẽ sẽ không nhàm chán.`;

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
function normalizeCoreState(value){try{return window.Android&&typeof Android.normalizeState==="function"?JSON.parse(Android.normalizeState(JSON.stringify(value))):value}catch(_){return value}}
let state=normalizeCoreState(JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial);
let busy=false;

function inferLevelKey(s){
  const existing=String(s?.currentLevelKey||"").trim();
  if(existing)return existing;
  const location=String(s?.location||"").toLowerCase();
  if(location.includes("manila room"))return "manila_room";
  if(location.includes("the torment")||/\btorment\b/.test(location))return "the_torment";
  if(location.includes("red rooms")||location.includes("red room"))return "red_rooms";
  const m=String(s?.location||"").match(/\bLevel\s*([0-6](?:\.[0-9]+)?)\b/i);
  if(m)return m[1];
  return String(Number.isInteger(s?.currentLevel)?s.currentLevel:0);
}
function ensureCurrentLevel(s){
  if(!Number.isInteger(s?.currentLevel)||s.currentLevel<0||s.currentLevel>6){
    const m=String(s?.location||"").match(/\bLevel\s*([0-6])\b/i);
    s.currentLevel=m?Number(m[1]):0;
  }
  s.currentLevelKey=inferLevelKey(s);
  return s;
}
ensureCurrentLevel(state);
state.characterCanon=CURRENT_CHARACTER_CANON;
if(state.turn===1){
  const currentOpening=String(state.log?.[0]?.text||"");
  const playerName=String(state.player?.name||"").trim().toLowerCase();
  const legacyOpening=currentOpening!==initial.log[0].text||playerName.includes("kai")||playerName.includes("twilight");
  if(legacyOpening){
    state.title=initial.title;
    state.currentLevel=initial.currentLevel;
    state.currentLevelKey=initial.currentLevelKey;
    state.location=initial.location;
    state.player=JSON.parse(JSON.stringify(initial.player));
    state.party=[];
    state.inventory=JSON.parse(JSON.stringify(initial.inventory));
    state.flags={};
    state.log=JSON.parse(JSON.stringify(initial.log));
    state.characterCanon=CURRENT_CHARACTER_CANON;
  }
}
localStorage.setItem("backroom-apk-state",JSON.stringify(state));

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function levelTitle(){const key=String(state?.currentLevelKey||state?.currentLevel||0);return LEVEL_NODE_TITLES[key]||("Level "+key)}
function partyDisplayItems(){const result=[];const seen=new Set();const add=x=>{if(!x)return;const name=typeof x==="string"?x:String(x.name||x.id||"").trim();if(!name)return;const key=name.toLocaleLowerCase("vi");if(seen.has(key))return;seen.add(key);result.push(typeof x==="string"?{name}:x)};add(state?.player||{name:"Cao Minh"});(Array.isArray(state?.party)?state.party:[]).filter(x=>x&&x.joined===true).forEach(add);return result}
function render(){titleEl.textContent=levelTitle();turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Cao Minh";partyEl.innerHTML=chips(partyDisplayItems());inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=normalizeCoreState(ensureCurrentLevel(JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial));state.characterCanon=CURRENT_CHARACTER_CANON;save();render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="GAME MASTER đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=ensureCurrentLevel(JSON.parse(json));state.characterCanon=CURRENT_CHARACTER_CANON;actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" · "+levelTitle()+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi AI: "+message};
window.backroomCommittedError=json=>{const payload=JSON.parse(json);state=ensureCurrentLevel(payload.state||state);state.characterCanon=CURRENT_CHARACTER_CANON;busy=false;submitEl.disabled=false;save();render();const pending=Array.isArray(state?.characterEncounter?.pendingIntro)&&state.characterEncounter.pendingIntro.length>0;statusEl.textContent="Lỗi AI: "+String(payload.message||"Không thể xử lý lượt.")+(pending?" Character encounter đã được lưu và hội thoại đang chờ thử lại.":" Trạng thái Core trước lần gọi AI đã được giữ nguyên.")};
render();
</script>
</body>
</html>
