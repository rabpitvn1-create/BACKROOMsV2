<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px system-ui,sans-serif}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}.game,.card{border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid #2b3137}.eyebrow,.role{color:#8f9aa4;font-size:9px;font-weight:800;letter-spacing:.16em}h1{margin:2px 0 0;font-size:19px;line-height:1.15}.turn{color:#9aa4ad;font-size:10px;letter-spacing:.08em;min-width:48px}.turn strong{font-size:18px;color:white}.snapshot{height:250px;margin:8px 10px 10px;border:1px solid #252b31;display:grid;place-items:center;background:#0b0d0f;color:#69737c}.snapshot img{width:100%;height:100%;object-fit:cover}.log{height:42vh;overflow:auto;padding:10px;display:grid;gap:10px}.message{border-left:3px solid #454e56;padding:11px;background:#111519}.message.player{border-left-color:#8b949e;background:#15191d}.role{margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.55}.composer{display:grid;gap:8px;padding:10px}textarea,button{font:inherit}textarea{min-height:80px;background:#090c0f;color:white;border:1px solid #30373e;padding:10px}button{border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700}.status{border-top:1px solid #252b31;padding:10px;color:#9aa4ad;font-size:12px}.side{display:grid;gap:10px;margin-top:10px}.card{padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}
</style>
</head>
<body>
<main class="shell">
<section class="game">
<header class="topbar"><div><div class="eyebrow">BACKROOM TEXT GAME</div><h1 id="title"></h1></div><div class="turn">TURN <strong id="turn"></strong></div></header>
<div class="snapshot" id="snapshot">SNAPSHOT — Android bản đầu chưa tạo ảnh tự động</div>
<div class="log" id="log"></div>
<form class="composer" id="form"><textarea id="action" placeholder="Kai làm gì trong Turn hiện tại?" rows="3"></textarea><button id="submit">THỰC HIỆN</button></form>
<div class="status" id="status"></div>
</section>
<aside class="side">
<div class="card"><h2>Trạng thái</h2><div class="row"><b>Vị trí</b><span id="location"></span></div><div class="row"><b>Chế độ</b><span id="mode"></span></div><div class="row"><b>Nhân vật</b><span id="player"></span></div></div>
<div class="card"><h2>Save / Load</h2><div class="actions"><button onclick="save()">Lưu</button><button onclick="load()">Tải</button><button class="wide" onclick="resetGame()">Bắt đầu lại từ đầu</button><button class="wide danger" onclick="clearSave()">Xóa save trên máy</button></div></div>
<div class="card"><h2>Party</h2><div class="chips" id="party"></div></div>
<div class="card"><h2>Inventory</h2><div class="chips" id="inventory"></div></div>
</aside>
</main>
<script>
const prologue=`Bữa tối bắt đầu như bao lần khác.

Nhà hàng nằm trên một tầng cao của khu thương mại, đủ yên để người ta nghe rõ tiếng dao chạm vào đĩa nhưng không đến mức phải giữ giọng. Qua lớp kính lớn sát tường, thành phố trải xuống bên dưới bằng những dải đèn trắng, vàng và đỏ. Nhân viên phục vụ đi lại nhẹ đến mức chỉ khi một chiếc ly được đặt xuống, Kai mới để ý có người vừa tới gần bàn.

Hắn đang cắt nốt phần thịt trong đĩa thì nhận ra Syvial lại nhìn sang.

Kai vẫn cúi đầu.

“Em nhìn tiếp cũng vô ích. Miếng cuối này không tự chạy sang đĩa em đâu.”

Syvial nhướng mày. “Ai bảo em nhìn miếng thịt?”

“Vậy chắc anh hiểu lầm.”

“Đúng. Em chỉ đang thắc mắc tại sao một người ăn chậm như anh lại nhất quyết giữ phần cuối đến tận bây giờ.”

Kai đưa nĩa lên, ăn luôn miếng thịt trước khi cô kịp nói thêm. “Hết thắc mắc chưa?”

Syvial nhìn chiếc đĩa trống, rồi nhìn hắn. “Anh làm thế chỉ để chọc em đúng không?”

Iris đặt ly nước xuống. Khóe miệng cô hơi động. “Muốn ăn thì gọi thêm đi. Đừng nhìn đĩa của anh ấy mãi.”

“Có nhìn mãi đâu.”

“Đủ lâu để người ngồi đối diện cũng nhận ra.”

Syvial quay sang. “Đếm à?”

“Không cần.”

Kai dựa lưng vào ghế, để mặc hai người nhìn nhau qua mặt bàn. “Anh đề nghị đổi chủ đề trước khi bữa tối biến thành một cuộc điều tra về quyền sở hữu thức ăn.”

Syvial chống cằm. “Muộn rồi. Em sẽ nhớ chuyện này.”

“Danh sách của em còn chỗ à?”

“Anh cứ tiếp tục thử xem.”

Kai bật cười khẽ. Iris lắc đầu, nhưng vẻ mặt cũng đã bớt nghiêm hơn lúc mới ngồi xuống.

Đèn trên trần chớp một lần.

Không ai ở những bàn xung quanh phản ứng. Một nhân viên vẫn nghiêng chai rượu, dòng chất lỏng đỏ sẫm chảy đều vào ly. Bản nhạc trong nhà hàng tiếp tục trôi qua, chỉ có một nốt trầm vừa rồi nghe hơi lệch.

Kai ngẩng lên.

Đèn chớp lần thứ hai.

Lần này Iris cũng dừng tay. Cô không nhìn lên trần mà quay sang phía cửa kính, như thể đang cố xác định một âm thanh vừa lọt khỏi chỗ của nó.

“Anh Kai.”

“Anh nghe rồi.”

Syvial thôi cười. Sự thay đổi trên gương mặt cô diễn ra rất nhanh; vẻ thư thả còn đó một giây trước đã biến mất khi cô nhìn quanh căn phòng.

Kai không nghe thấy tiếng động lạ nào rõ ràng. Điều khiến hắn chú ý là những âm thanh vốn phải có đang mất dần phần vang của chúng. Tiếng trò chuyện ở bàn gần nhất trở nên phẳng một cách khó chịu. Nhạc vẫn phát, nhưng các nốt thấp kéo dài như bị bóp méo. Ngay cả tiếng dao nĩa cũng nghe gần hơn khoảng cách thực tế.

Một người đàn ông cách họ vài bàn đang nói chuyện thì khựng lại. Chiếc ly trong tay ông trượt khỏi những ngón tay.

Kai nhìn theo phản xạ.

Chiếc ly rơi xuống được nửa quãng rồi biến mất.

Không vỡ. Không bị hất sang bên. Không có ánh sáng hay khói che khuất. Trong một khoảnh khắc nó vẫn còn ở đó, khoảnh khắc tiếp theo chỉ còn khoảng không.

Kai đứng dậy ngay.

“Đứng lên. Ra khỏi đây.”

Iris đã rời ghế trước khi hắn nói hết câu. Syvial đẩy ghế lùi lại, mắt vẫn quét quanh sàn và các lối ra.

Họ không kịp đi bước nào.

Mặt sàn dưới chân Kai không nứt, không sập và cũng không hề rung. Nó chỉ đột ngột thôi cản cơ thể hắn lại.

Chân hắn xuyên qua lớp gỗ như xuyên qua một hình ảnh không có khối lượng.

Kai giật tay về phía mép bàn. Những ngón tay chỉ kịp quệt qua cạnh bàn trước khi cả người rơi xuống. Phía trên, Iris lao tới theo phản xạ. Syvial cũng xoay người chụp lấy hắn, nhưng đúng lúc đó phần sàn dưới chân hai người họ cũng mất độ rắn.

Khoảnh khắc cuối cùng Kai còn nhìn thấy nhà hàng là một mớ hình ảnh nghiêng lệch: chiếc bàn trượt khỏi tầm mắt, bàn tay Iris đưa ra nhưng không chạm tới, mái tóc Syvial quét qua vai khi cô rơi, những thực khách phía xa vẫn chưa hiểu chuyện gì đang xảy ra.

Rồi ánh sáng biến mất.

Không có cảm giác rơi tự do. Không có gió quất vào người, không có lực kéo tăng dần, cũng không còn khái niệm rõ ràng về trên hay dưới. Cơ thể Kai vẫn ở đó, nhưng khoảng cách xung quanh hắn dường như không còn được đo theo cách quen thuộc.

Cảm giác ấy kéo dài chưa tới một nhịp tim.

Trọng lực trở lại đột ngột.

Kai chạm xuống một bề mặt mềm hơn sàn nhà hàng. Hắn chống một chân, hạ thấp trọng tâm và giữ được thăng bằng gần như ngay lập tức.

Mùi ẩm mốc xộc vào trước tiên.

Sau đó là mùi giấy cũ, bụi, keo dán và thứ hóa chất tẩy rửa nhạt đến mức chỉ còn bám lại trong không khí. Trên đầu, hàng đèn huỳnh quang tỏa ánh sáng trắng nhợt. Tiếng ù đều đều của chúng lấp kín căn phòng.

Kai đứng thẳng lên.

Nhà hàng đã biến mất.

Quanh hắn là những bức tường phủ giấy màu vàng nhạt với hoa văn lặp lại đến phát ngấy. Tấm thảm dưới chân ẩm lạnh dù không thấy nước chảy từ đâu. Trần nhà ghép bằng những tấm vuông giống hệt nhau, kéo dài qua các ô cửa mở sang những căn phòng kế tiếp.

Không có cửa sổ. Không có bàn ghế. Không có dấu vết của thành phố.

Và không có Iris hay Syvial.

Kai quay một vòng, nhìn kỹ từng lối mở trước khi gọi.

“Iris?”

Chỉ có tiếng đèn.

“Syvial?”

Giọng hắn đi qua hai căn phòng, dội lại rất yếu rồi chìm mất trong một khoảng không không cho thấy điểm cuối.

Kai không gọi lần thứ ba. Hắn chuyển sang liên lạc.

Kênh trực tiếp của đội không trả lời. Kênh nội bộ SRU im lặng. Kênh chỉ huy, kênh khẩn cấp và các đường truyền dự phòng mã hóa cũng không nhận được bất kỳ tín hiệu hồi đáp nào.

Hắn kiểm tra lại từng kênh một lần nữa, lần này tách riêng lỗi thiết bị khỏi lỗi đường truyền.

Kết quả không thay đổi.

Đây không giống tín hiệu yếu. Cũng không giống một vùng nhiễu thông thường. Không có tín hiệu méo, không có gói dữ liệu hỏng, không có dấu hiệu cho thấy đầu bên kia đã nhận được lời gọi rồi thất bại khi trả lời.

Chỉ có im lặng.

Chưa đầy một phút trước, Iris và Syvial còn ngồi trong tầm tay hắn. Kai đã thấy cả hai cùng rơi khi mặt sàn mất đi dưới chân họ. Đó là điều duy nhất hắn có thể chắc chắn.

Hắn không biết họ đã rơi tới đâu.

Không biết họ có ở cùng nơi này hay không.

Không biết SRU còn có thể tìm thấy dấu vết của ba người từ phía bên kia hay không.

Không có tọa độ để đối chiếu. Không có tín hiệu định vị. Không có dữ liệu trạng thái từ hai người còn lại. Và trước mắt, không có bất kỳ lời giải thích nào cho căn phòng vàng vô tận đang mở ra quanh hắn.

Kai đứng yên thêm vài giây để nghe.

Tiếng đèn vẫn ù trên đầu. Thảm vẫn ẩm dưới đế giày. Ở phía trước, một hành lang rẽ sang trái sau lớp tường vàng; bên phải là một ô cửa khác dẫn vào căn phòng gần như giống hệt nơi hắn đang đứng.

Không có tiếng gọi đáp lại.

Kai chỉ còn những gì mình đang mang theo, những gì chính mắt hắn có thể kiểm chứng, và một việc phải làm trước tiên: xác định mình đang ở đâu, rồi tìm Iris và Syvial.`;

const CURRENT_CHARACTER_CANON={
  version:"drive-characters-2026-09-17",
  instruction:"Current Google Drive character canon. This overrides conflicting legacy character facts in old logs/local mirrors. KNOWLEDGE_LOCK is writer/GM canon, not automatic in-world knowledge. UNKNOWN/OPEN must remain unknown. Lucia is a fixed Level 0 story encounter and must never be auto-spawned just because the model knows her codex.",
  kai:"Kai Akechi / Twilight is current SRU captain in the anti-anomalous police force, UR+, origin era 2299 but true age unknown. Public SRU record says human; KNOWLEDGE_LOCK: half-human/half-demon son of Sparda and Eve. Sparda Core gives infinite demon power with no intrinsic depletion/cooldown/corruption/berserk and self-repairs all currently equipped items. Current signature weapon is SRU Assault Rifle MK19: physical 5.56x45 NATO, 30-round physical mags, 700-950 rpm, ~500-600 m effective; physical ammo is finite. It also fires Sparda demonic 5.56x45 formed directly from Core, no physical ammo use. SRU-MK20 is current powered armor. Devil Trigger has no intrinsic cap. Guilty Crown Override is a 40% combat proc; on proc it fires exactly 24 MK19 demonic shots while external time is fully stopped, dealing exactly 10 HP per shot (240 HP total). Omnivault now ONLY stores/retrieves inanimate objects and Restores the same existing equipment, with 24h per-item restore cooldown. Old Scan/Copy/Create/Marked/Upgrade mechanics are removed.",
  iris:"Iris / ARGUS is SRU Scout / Target Eliminator in Kai's team, a real ranged Gunslinger. No surname locked. Half-human/half-demon daughter of Belial and a deceased human mother; mother details, birth era and exact combat tier remain UNKNOWN. Belial Core provides infinite demon power for established functions. ARGUS Terrain Read uses direct observation plus local Recon Frame sensors for terrain/routes/LOS/cover/ambush/traces; no omniscience, wall vision, remote cameras or automatic true-form detection. Thousandfold Cognition is up to 1:1000 information processing, not body speed. Current gear: SRU Recon Frame R03 and Ivory & Ebony, whose bullets form from Iris's demon power. Iris loves Kai; Kai knows but reciprocation is not canonically established. Iris uses anh-em with Kai; Iris and Syvial are trusted friends/teammates with romantic rivalry, not enemies.",
  syvial:"Syvial is half-human/half-demon daughter of Lucifer, origin era 2299, true age unknown, UR+ and same overall tier as Kai. Current organization: SRU anti-anomalous police; deputy leader of Kai's team. Lucifer Core supplies infinite demon power; Devil Trigger does not remove control or have an invented intrinsic cap/cooldown. GodKiller is a massive purely mechanical greatsword, never a gun/gunblade. Lucifer Armor is mobile black/gunmetal/silver mecha armor with magenta accents; pointed head modules are mechanical, not biological horns; very durable/fast self-repairing but not absolutely indestructible. GodKiller Override / Twenty-Four Severance = exactly 24 cuts while external time is fully stopped. Syvial is intensely yandere toward Kai but lucid and socially/tactically competent; she values Kai's voluntary choice and does not randomly murder, sabotage missions, erase memory or mind-control him.",
  lucia:"Hứa Thuý Mai is the legal/real name; Lucia Lục is a military nickname/callsign. She is a 19-year-old HUMAN Vietnamese woman of Hoa Kiều background, great-great-granddaughter of the Hứa family, with one year military training/service via Vietnam + USA and excellent entrance result. She is a capable human tactical riflewoman, not supernatural/UR+. Lucia is a fixed story-owned Level 0 encounter, not random/quest spawn and not part of the initial SRU group (Kai/Iris/Syvial). Gameplay baseline: HP100 STR7 DF7 AGI8 CRIT7, +2 HP after each 3 separately completed turns. Main weapon personalized M4A1; baseline physical ammo 60 in main mags + 90 reserve = 150; combat dagger and military navigation watch. Relationship/address with Kai remain OPEN."
};

const LEVEL_TITLES={0:"The Lobby",1:"Parking Zone",2:"Pipe Dreams",3:"The Electrical Station",4:"The Abandoned Office",5:"Terror Hotel",6:"Lights Out"};

const initial={
  title:"Level 0 : The Lobby",
  turn:1,
  mode:"local APK",
  currentLevel:0,
  location:"Level 0 / The Lobby — khu phòng vàng ban đầu sau no-clip",
  player:{name:"Kai Akechi",condition:"Ổn định"},
  party:[],
  inventory:[
    {name:"SRU Assault Rifle MK19"},
    {name:"SRU-MK20 Powered Armor"},
    {name:"Omnivault Ring / Nhẫn Vạn Tàng"}
  ],
  flags:{communication:{sru:"OFFLINE",iris:"OFFLINE",syvial:"OFFLINE"}},
  characterCanon:CURRENT_CHARACTER_CANON,
  log:[
    {role:"gm",text:"MỞ ĐẦU\n\n"+prologue},
    {role:"gm",text:"LƯỢT 1\n\nKhông có liên lạc với Iris, Syvial hay SRU. Bạn điều khiển Kai từ đây."}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

function ensureCurrentLevel(s){if(!Number.isInteger(s?.currentLevel)||s.currentLevel<0||s.currentLevel>6){const m=String(s?.location||"").match(/\bLevel\s*([0-6])\b/i);s.currentLevel=m?Number(m[1]):0}return s}
ensureCurrentLevel(state);
state.characterCanon=CURRENT_CHARACTER_CANON;
const oldPrologueSignature="Không beacon. Không telemetry.";
if(state.turn===1){
  const currentOpening=String(state.log?.[0]?.text||"");
  const oldInventory=Array.isArray(state.inventory)&&state.inventory.some(x=>String(x?.name||"").includes("White Wraith"));
  if(oldInventory) state.inventory=JSON.parse(JSON.stringify(initial.inventory));
  if(state.flags?.communication?.blackBlood!==undefined){
    delete state.flags.communication.blackBlood;
    state.flags.communication.sru="OFFLINE";
  }
  if(state.log?.[0]&&(currentOpening.length<1000||currentOpening.includes(oldPrologueSignature)||currentOpening.includes("Black Blood"))){
    state.log[0]=initial.log[0];
    if(state.log[1]) state.log[1]=initial.log[1];
  }
}
localStorage.setItem("backroom-apk-state",JSON.stringify(state));

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function levelTitle(){const level=Number.isInteger(state?.currentLevel)?state.currentLevel:0;return "Level "+level+" : "+(LEVEL_TITLES[level]||"Unknown")}
function partyDisplayItems(){const result=[];const seen=new Set();const add=x=>{if(!x)return;const name=typeof x==="string"?x:String(x.name||x.id||"").trim();if(!name)return;const key=name.toLocaleLowerCase("vi");if(seen.has(key))return;seen.add(key);result.push(typeof x==="string"?{name}:x)};add(state?.player||{name:"Kai Akechi"});(Array.isArray(state?.party)?state.party:[]).forEach(add);return result}
function render(){titleEl.textContent=levelTitle();turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(partyDisplayItems());inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");logEl.scrollTop=logEl.scrollHeight;statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=ensureCurrentLevel(JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial);state.characterCanon=CURRENT_CHARACTER_CANON;render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Gemini đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=ensureCurrentLevel(JSON.parse(json));state.characterCanon=CURRENT_CHARACTER_CANON;actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" · Level "+state.currentLevel+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi Gemini: "+message};
render();
</script>
</body>
</html>
