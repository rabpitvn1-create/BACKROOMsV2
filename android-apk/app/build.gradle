plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def secret = { name ->
  def value = System.getenv(name) ?: ""
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 74
    versionName '1.1.72'
    buildConfigField "String", "GEMINI_API_KEY_1", "\"" + secret("GEMINI_API_KEY_1") + "\""
    buildConfigField "String", "GEMINI_API_KEY_2", "\"" + secret("GEMINI_API_KEY_2") + "\""
    buildConfigField "String", "GEMINI_API_KEY_3", "\"" + secret("GEMINI_API_KEY_3") + "\""
    buildConfigField "String", "GEMINI_API_KEY_4", "\"" + secret("GEMINI_API_KEY_4") + "\""
    buildConfigField "String", "GEMINI_API_KEY_5", "\"" + secret("GEMINI_API_KEY_5") + "\""
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions { unitTests.returnDefaultValues = true }
}

// Materialize the campaign chain through the latest authored module before tests/assets
// are packaged. Each campaign patch invokes its predecessor, so clean checkouts and
// already-patched trees converge to the same state.
def applyMainCampaignContinuation = tasks.register('applyMainCampaignContinuation', Exec) {
  workingDir rootProject.projectDir
  commandLine 'python3', 'patch-main-campaign-level0-01.py'
}

tasks.configureEach { task ->
  if (task.name == 'preBuild') {
    task.dependsOn applyMainCampaignContinuation
  }
}

dependencies {
  implementation 'com.google.ai.edge.litert:litert:2.2.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
