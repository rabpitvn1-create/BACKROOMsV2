plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def secret = { name ->
  def value = System.getenv(name) ?: ""
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 75
    versionName '1.1.73'
    buildConfigField "String", "GEMINI_API_KEY_1", "\"" + secret("GEMINI_API_KEY_1") + "\""
    buildConfigField "String", "GEMINI_API_KEY_2", "\"" + secret("GEMINI_API_KEY_2") + "\""
    buildConfigField "String", "GEMINI_API_KEY_3", "\"" + secret("GEMINI_API_KEY_3") + "\""
    buildConfigField "String", "GEMINI_API_KEY_4", "\"" + secret("GEMINI_API_KEY_4") + "\""
    buildConfigField "String", "GEMINI_API_KEY_5", "\"" + secret("GEMINI_API_KEY_5") + "\""
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions { unitTests.returnDefaultValues = true }
}

// Exercise the authored campaign materializer as a validation step only. The validator
// restores index.html before preBuild continues so a release never ships a later checkpoint
// (for example Level 0.41) as the player's startup state.
def validateMainCampaignContinuation = tasks.register('validateMainCampaignContinuation', Exec) {
  workingDir rootProject.projectDir
  commandLine 'python3', 'patch-main-campaign-validate-current.py'
}

tasks.configureEach { task ->
  if (task.name == 'preBuild') {
    task.dependsOn validateMainCampaignContinuation
  }
}

dependencies {
  implementation 'com.google.ai.edge.litert:litert:2.2.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
